<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>China-GPT — Universal AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --panel:#0a0a0a; --panel-2:#101010; --panel-3:#161616; --raised:#1b1b1b;
  --line:#232323; --line-strong:#303030; --text:#ededed; --muted:#9a9a9a; --dim:#6b6b6b;
  --accent:#3d7dff; --accent-soft:rgba(61,125,255,.14); --danger:#f26161;
  --ok:#56d364;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --t-fast:150ms cubic-bezier(.2,.6,.2,1); --t-base:180ms cubic-bezier(.2,.6,.2,1);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sidebar-w:236px; --measure:720px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;touch-action:manipulation}
svg{width:16px;height:16px;fill:none;stroke:currentColor}

*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box;border:3px solid transparent}

/* ============ Shell ============ */
.shell{position:relative;height:100vh;height:100dvh;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
.scrim{position:fixed;inset:0;background:#0000;pointer-events:none;transition:background var(--t-base);z-index:39}
.shell.nav-open .scrim{background:rgba(0,0,0,.55);pointer-events:auto}

.sidebar{
  position:relative;z-index:40;display:flex;flex-direction:column;background:var(--panel);
  border-right:1px solid var(--line);min-height:0;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);
}
.side-brand{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;font-weight:600}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:26px;height:26px;flex:0 0 auto;display:grid;place-items:center}
.logo svg{width:100%;height:100%;display:block}
.logo-sm{width:18px;height:18px}
.logo-sm svg{width:100%;height:100%;display:block}
.drawer-close{display:none;width:30px;height:30px;border-radius:var(--r-sm);color:var(--dim)}
.drawer-close:hover{background:var(--panel-3);color:var(--text)}

.side-nav{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.side-nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 11px;color:var(--muted);border:1px solid transparent;border-radius:var(--r-sm);transition:background-color var(--t-base),color var(--t-base)}
.side-nav button:hover{background:var(--panel-3);color:var(--text)}
.side-nav button.is-active{background:var(--panel-3);color:var(--text);border-color:var(--line)}
.side-new{margin-bottom:8px;background:var(--panel-3)!important;color:var(--text)!important;border-color:var(--line)!important}
.side-new:hover{background:var(--raised)!important;border-color:var(--line-strong)!important}

.side-recent{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.side-label{flex:0 0 auto;padding:6px 16px 4px;color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.side-list{flex:1 1 0;min-height:0;overflow-y:auto;padding:0 10px 8px;overscroll-behavior:contain}
.side-chat-row{display:flex;align-items:center;gap:2px}
.side-chat{flex:1;display:block;min-width:0;padding:7px 8px;color:var(--muted);font-size:13px;text-align:left;border-radius:var(--r-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background-color var(--t-base),color var(--t-base)}
.side-chat:hover{background:var(--panel-3);color:var(--text)}
.side-empty{padding:8px;color:var(--dim);font-size:12px;line-height:1.5}

.side-api-link{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  height:36px;padding:0 10px;margin:0 10px;
  color:var(--dim);font-size:12.5px;border-radius:var(--r-sm);
  font-family:var(--mono);
  transition:background-color var(--t-base),color var(--t-base);
}
.side-api-link:hover{background:var(--panel-3);color:var(--text)}

.side-account{flex:0 0 auto;padding:8px 10px 10px;border-top:1px solid var(--line)}
.account-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:var(--r-md);text-align:left}
.account-btn:hover{background:var(--panel-3)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--text);font-size:12px;font-weight:600;flex:0 0 auto}
.account-id{flex:1;min-width:0;overflow:hidden}
.account-id b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-id small{display:block;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.main-head{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  height:calc(56px + var(--safe-t));
  padding:var(--safe-t) calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l));
  border-bottom:1px solid var(--line);
}
.drawer-open{display:none;width:32px;height:32px;border-radius:var(--r-sm);color:var(--muted)}
.drawer-open:hover{background:var(--panel-3);color:var(--text)}

.model-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 12px;color:var(--text);font-size:13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-3);max-width:60vw;transition:background-color var(--t-base),border-color var(--t-base)}
.model-btn:hover{background:var(--raised);border-color:var(--line-strong)}
.model-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-caret{width:14px;height:14px;color:var(--dim);flex:0 0 auto}

.stage{position:relative;flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.stage-scroll{flex:1 1 auto;min-height:0;overflow:hidden auto;display:flex;flex-direction:column;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.stage-inner{width:min(100%,var(--measure));margin:0 auto;padding:0 20px}
.stage.is-home .stage-inner{margin-top:auto}
.stage.is-home::before{
  content:"";position:absolute;left:50%;top:18%;width:min(560px,86vw);height:340px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(139,92,246,.16),transparent 72%);pointer-events:none;z-index:0;
}
.stage-head{position:relative;overflow:hidden;margin:0 0 20px;max-height:80px;font-size:30px;font-weight:600;letter-spacing:-.03em;text-align:center;transition:opacity var(--t-base),transform var(--t-base),max-height var(--t-base)}
.stage:not(.is-home) .stage-head{max-height:0;margin-bottom:0;opacity:0;transform:translateY(-10px)}
.stage-sub{position:relative;margin:-10px 0 24px;text-align:center;color:var(--muted);font-size:13.5px}
.stage:not(.is-home) .stage-sub{display:none}

.thread{display:flex;flex-direction:column;gap:18px;padding:22px 0 16px}
.thread:empty{display:none}
.msg{display:flex;flex-direction:column;gap:5px}
.msg-user{align-items:flex-end}
.msg-user .bubble{max-width:min(100%,540px);padding:10px 14px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-lg);white-space:pre-wrap;overflow-wrap:anywhere}
.msg-assistant .msg-who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.msg-assistant .bubble{max-width:min(100%,620px);padding:0;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}

/* ============ Composer ============ */
.composer-slot{
  flex:0 0 auto;
  width:min(100%,var(--measure));
  margin:0 auto;
  padding:0 calc(20px + var(--safe-r)) calc(16px + var(--safe-b)) calc(20px + var(--safe-l));
}
.composer{
  position:relative;
  display:flex;flex-direction:column;gap:4px;
  padding:10px 12px 8px;
  background-color:var(--panel-2);
  background-image:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 55%);
  border:1px solid var(--line-strong);
  border-radius:28px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.03) inset,
    0 12px 32px -20px rgba(0,0,0,.9);
  transition:border-color var(--t-base),box-shadow var(--t-base);
}
.composer:focus-within{
  border-color:rgba(139,92,246,.5);
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 0 0 4px rgba(139,92,246,.13),
    0 16px 40px -22px rgba(139,92,246,.55);
}
.composer.is-dragging{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

.composer-model-chip{
  display:inline-flex;align-items:center;gap:5px;
  align-self:flex-start;
  max-width:100%;min-width:0;
  height:22px;
  padding:0 6px 0 4px;
  border-radius:6px;
  background:transparent;
  border:1px solid transparent;
  color:var(--dim);
  font-size:11.5px;
  font-weight:500;
  transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base);
}
.composer-model-chip:hover{background:var(--panel-3);color:var(--muted);border-color:var(--line)}
.composer-model-chip .cmc-icon{width:14px;height:14px;display:grid;place-items:center;flex:0 0 auto;font-size:9px;font-weight:800}
.composer-model-chip .cmc-icon img{width:14px;height:14px;object-fit:contain;display:block}
.composer-model-chip .cmc-icon[data-letter] img{display:none}
.composer-model-chip .cmc-icon[data-letter]::before{content:attr(data-letter)}
.composer-model-chip .cmc-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;padding-right:2px}
.composer-model-chip .cmc-caret{width:10px;height:10px;opacity:.55;flex:0 0 auto}

.composer textarea{
  width:100%;
  min-height:28px;max-height:200px;
  padding:2px 10px 4px;
  resize:none;line-height:1.55;
  outline:0;
  font:inherit;font-size:15.5px;
  background:transparent;color:var(--text);
  border-radius:18px;
}
.composer textarea::placeholder{color:var(--dim)}

.composer-bar{display:flex;align-items:center;gap:6px;padding:2px 2px 0;min-height:38px}
.composer-spacer{flex:1;min-width:6px}

.chip-btn{
  display:grid;place-items:center;width:34px;height:34px;padding:0;
  color:var(--muted);font-size:15px;
  border:1px solid var(--line);border-radius:50%;
  flex:0 0 auto;
  transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base),transform var(--t-fast);
}
.chip-btn:hover{background:var(--panel-3);color:var(--text);border-color:var(--line-strong)}
.chip-btn:active{transform:scale(.94)}
.chip-btn.is-on{color:var(--accent);border-color:rgba(61,125,255,.4);background:var(--accent-soft)}

.send{
  display:grid;place-items:center;
  width:36px;height:36px;flex:0 0 auto;
  background:var(--text);color:#0a0a0a;
  border-radius:50%;
  transition:background-color var(--t-base),transform var(--t-fast),box-shadow var(--t-base);
}
.send:hover{background:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.send:active{transform:scale(.94)}
.stop-btn{background:var(--danger)!important;color:#fff!important}
.stop-btn:hover{background:#ff7a7a!important;box-shadow:0 0 0 4px rgba(242,97,97,.18)}

/* ============ Provider tiles (CSS masks) ============
   The tile itself is a rounded coloured chip. When a brand icon
   is available, it renders as a mask filled with currentColor —
   so the icon picks up the brand colour instead of the SVG's own
   black fill. When no icon resolves, we fall back to a letter. */
.tile{
  width:26px;height:26px;border-radius:7px;
  display:grid;place-items:center;
  flex:0 0 auto;
  font-size:10px;font-weight:800;
  overflow:hidden;
  line-height:1;
}
.tile-icon{
  display:block;
  width:66%;height:66%;
  background-color:currentColor;
  -webkit-mask-image:var(--icon-url);
          mask-image:var(--icon-url);
  -webkit-mask-size:contain;
          mask-size:contain;
  -webkit-mask-repeat:no-repeat;
          mask-repeat:no-repeat;
  -webkit-mask-position:center;
          mask-position:center;
}
.tile.tile-sm{width:18px;height:18px;border-radius:6px}
.tile.tile-sm .tile-icon{width:72%;height:72%}
.tile.tile-xs{width:16px;height:16px;border-radius:4px;font-size:9px}
.tile.tile-xs .tile-icon{width:76%;height:76%}
.tile.tile-lg{width:34px;height:34px;border-radius:10px;font-size:13px}
.tile.tile-lg .tile-icon{width:66%;height:66%}

/* Loading spinner shown on a tile while its icon URL is being
   probed. Collapses the moment the icon resolves or fails. */
.tile[data-loading]::after{
  content:"";
  width:38%;height:38%;
  border-radius:50%;
  border:1.5px solid currentColor;
  border-right-color:transparent;
  animation:think-spin .9s linear infinite;
  opacity:.6;
}

/* ============ Admin: Provider Icons ============ */
.provider-grid{
  display:flex;flex-direction:column;gap:8px;
}
.provider-row{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) auto;
  align-items:center;gap:12px;
  padding:12px;
  border:1px solid var(--line);border-radius:12px;
  background:var(--panel-2);
}
.provider-row-main{min-width:0}
.provider-row-main b{display:block;font-size:13.5px;font-weight:500}
.provider-row-main small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.provider-row-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.provider-row-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim)}
.provider-row-status.ok{color:var(--ok)}
.provider-row-status.ok::before{background:var(--ok)}
.provider-row-status.override{color:var(--accent)}
.provider-row-status.override::before{background:var(--accent)}
.provider-row-status.missing{color:var(--danger)}
.provider-row-status.missing::before{background:var(--danger)}
.provider-row-input{
  display:flex;gap:6px;align-items:center;
  grid-column:1 / -1;
  margin-top:4px;
}
.provider-row-input input{
  flex:1;min-width:0;
  padding:10px 12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--text);
  outline:0;
}
.provider-row-input input:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px var(--accent-soft)}
.provider-row-input button{
  padding:10px 14px;
  font-size:12.5px;
  border-radius:8px;
  flex:0 0 auto;
}
@media (max-width:520px){
  .provider-row{grid-template-columns:36px minmax(0,1fr)}
  .provider-row-status{grid-column:1 / -1;margin-top:4px}
}

.qs-copy-id{
  display:grid;place-items:center;
  width:28px;height:28px;flex:0 0 auto;
  border-radius:8px;
  color:var(--dim);
  opacity:.55;
  transition:background-color var(--t-base),color var(--t-base),opacity var(--t-base);
}
.qs-copy-id:hover{background:var(--raised);color:var(--text);opacity:1}
.qs-copy-id.is-copied{color:var(--ok);opacity:1}
.qs-copy-id svg{width:13px;height:13px}
@media (hover:none){.qs-copy-id{opacity:.85}}

/* ============ Quick model switch sheet ============ */
.qs-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;
  display:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity var(--t-base);
}
.qs-backdrop.open{display:block;opacity:1}
.qs-sheet{
  position:fixed;
  left:0;right:0;bottom:0;
  margin:0 auto;
  max-width:min(560px,100%);
  z-index:81;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-bottom:0;
  border-top-left-radius:22px;border-top-right-radius:22px;
  height:min(82vh,720px);
  max-height:82vh;
  display:flex;flex-direction:column;
  transform:translateY(110%);
  transition:transform 280ms cubic-bezier(.2,.8,.2,1);
  padding-bottom:var(--safe-b);
  box-shadow:0 -20px 60px rgba(0,0,0,.6);
  overflow:hidden;
}
.qs-sheet.open{transform:translateY(0)}
.qs-sheet-handle{flex:0 0 auto;width:36px;height:4px;border-radius:99px;background:var(--line-strong);margin:8px auto 0}
.qs-sheet-head{
  flex:0 0 auto;position:relative;z-index:3;
  padding:8px 14px 10px;
  background:var(--panel-2);
  border-bottom:1px solid var(--line);
}
.qs-sheet-title{
  font-size:11.5px;font-weight:600;letter-spacing:.09em;
  color:var(--muted);text-transform:uppercase;
  margin:0 0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:8px;
}
.qs-sheet-title .dot{
  width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.qs-search{
  display:flex;align-items:center;gap:8px;
  height:38px;padding:0 12px;margin-bottom:8px;
  background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-md);
}
.qs-search svg{color:var(--dim);flex:0 0 auto;width:14px;height:14px}
.qs-search input{flex:1;background:none;outline:0;min-width:0;font-size:14px}
.qs-sheet-providers{
  flex:0 0 auto;
  display:flex;gap:8px;
  overflow-x:auto;overflow-y:hidden;
  padding:10px 14px 10px;
  scrollbar-width:none;
  position:relative;z-index:2;
  background:var(--panel-2);
  border-bottom:1px solid var(--line);
}
.qs-sheet-providers::-webkit-scrollbar{display:none}
.qs-prov-tile{
  flex:0 0 auto;width:40px;height:40px;border-radius:11px;
  display:grid;place-items:center;
  font-size:12px;font-weight:800;
  background:var(--panel-3);color:var(--muted);
  border:1px solid var(--line);
  transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base),transform var(--t-fast);
  overflow:hidden;
}
.qs-prov-tile img{width:70%;height:70%;object-fit:contain;display:block}
.qs-prov-tile[data-letter] img{display:none}
.qs-prov-tile[data-letter]::before{content:attr(data-letter)}
.qs-prov-tile:active{transform:scale(.94)}
.qs-sheet-body{
  flex:1 1 0;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:6px 8px calc(16px + var(--safe-b));
  position:relative;z-index:1;
}
.qs-row{
  display:flex;align-items:center;gap:12px;
  width:100%;text-align:left;
  padding:11px 10px;
  border-radius:12px;
  background:transparent;border:0;color:var(--text);
  transition:background-color var(--t-base);
}
.qs-row:hover,.qs-row:active{background:var(--panel-3)}
.qs-row-main{flex:1;min-width:0}
.qs-row-main b{
  display:block;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.qs-row-main small{
  display:flex;align-items:center;gap:5px;
  color:var(--dim);font-size:11.5px;margin-top:3px;
  overflow:hidden;white-space:nowrap;
}
.qs-row-main small .prov-dot{
  width:6px;height:6px;border-radius:50%;flex:0 0 auto;
}
.qs-radio{
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--line-strong);
  flex:0 0 auto;display:grid;place-items:center;
  transition:border-color var(--t-base),background-color var(--t-base);
}
.qs-row.is-active .qs-radio{border-color:var(--accent);background:var(--accent-soft)}
.qs-row.is-active .qs-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
