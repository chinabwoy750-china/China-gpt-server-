<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>China-GPT — Universal AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --panel:#0a0a0a; --panel-2:#101010; --panel-3:#161616; --raised:#1b1b1b;
  --line:#232323; --line-strong:#303030; --text:#ededed; --muted:#9a9a9a; --dim:#6b6b6b;
  --accent:#3d7dff; --accent-soft:rgba(61,125,255,.14); --danger:#f26161;
  --ok:#56d364;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --t-fast:150ms cubic-bezier(.2,.6,.2,1); --t-base:180ms cubic-bezier(.2,.6,.2,1);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sidebar-w:236px; --measure:720px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;touch-action:manipulation}
svg{width:16px;height:16px;fill:none;stroke:currentColor}

*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box;border:3px solid transparent}

/* ============ Shell ============ */
.shell{position:relative;height:100vh;height:100dvh;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
.scrim{position:fixed;inset:0;background:#0000;pointer-events:none;transition:background var(--t-base);z-index:39}
.shell.nav-open .scrim{background:rgba(0,0,0,.55);pointer-events:auto}

.sidebar{
  position:relative;z-index:40;display:flex;flex-direction:column;background:var(--panel);
  border-right:1px solid var(--line);min-height:0;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);
}
.side-brand{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;font-weight:600}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:26px;height:26px;flex:0 0 auto;display:grid;place-items:center}
.logo svg{width:100%;height:100%;display:block}
.logo-sm{width:18px;height:18px}
.logo-sm svg{width:100%;height:100%;display:block}
.drawer-close{display:none;width:30px;height:30px;border-radius:var(--r-sm);color:var(--dim)}
.drawer-close:hover{background:var(--panel-3);color:var(--text)}

.side-nav{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.side-nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 11px;color:var(--muted);border:1px solid transparent;border-radius:var(--r-sm);transition:background-color var(--t-base),color var(--t-base)}
.side-nav button:hover{background:var(--panel-3);color:var(--text)}
.side-nav button.is-active{background:var(--panel-3);color:var(--text);border-color:var(--line)}
.side-new{margin-bottom:8px;background:var(--panel-3)!important;color:var(--text)!important;border-color:var(--line)!important}
.side-new:hover{background:var(--raised)!important;border-color:var(--line-strong)!important}

.side-recent{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.side-label{flex:0 0 auto;padding:6px 16px 4px;color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.side-list{flex:1 1 0;min-height:0;overflow-y:auto;padding:0 10px 8px;overscroll-behavior:contain}
.side-chat-row{display:flex;align-items:center;gap:2px}
.side-chat{flex:1;display:block;min-width:0;padding:7px 8px;color:var(--muted);font-size:13px;text-align:left;border-radius:var(--r-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background-color var(--t-base),color var(--t-base)}
.side-chat:hover{background:var(--panel-3);color:var(--text)}
.side-empty{padding:8px;color:var(--dim);font-size:12px;line-height:1.5}

.side-api-link{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  height:36px;padding:0 10px;margin:0 10px;
  color:var(--dim);font-size:12.5px;border-radius:var(--r-sm);
  font-family:var(--mono);
  transition:background-color var(--t-base),color var(--t-base);
}
.side-api-link:hover{background:var(--panel-3);color:var(--text)}

.side-account{flex:0 0 auto;padding:8px 10px 10px;border-top:1px solid var(--line)}
.account-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:var(--r-md);text-align:left}
.account-btn:hover{background:var(--panel-3)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--text);font-size:12px;font-weight:600;flex:0 0 auto}
.account-id{flex:1;min-width:0;overflow:hidden}
.account-id b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-id small{display:block;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.main-head{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  height:calc(56px + var(--safe-t));
  padding:var(--safe-t) calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l));
  border-bottom:1px solid var(--line);
}
.drawer-open{display:none;width:32px;height:32px;border-radius:var(--r-sm);color:var(--muted)}
.drawer-open:hover{background:var(--panel-3);color:var(--text)}

.model-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 12px;color:var(--text);font-size:13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-3);max-width:60vw;transition:background-color var(--t-base),border-color var(--t-base)}
.model-btn:hover{background:var(--raised);border-color:var(--line-strong)}
.model-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-caret{width:14px;height:14px;color:var(--dim);flex:0 0 auto}

.stage{position:relative;flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.stage-scroll{flex:1 1 auto;min-height:0;overflow:hidden auto;display:flex;flex-direction:column;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.stage-inner{width:min(100%,var(--measure));margin:0 auto;padding:0 20px}
.stage.is-home .stage-inner{margin-top:auto}
.stage.is-home::before{
  content:"";position:absolute;left:50%;top:18%;width:min(560px,86vw);height:340px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(139,92,246,.16),transparent 72%);pointer-events:none;z-index:0;
}
.stage-head{position:relative;overflow:hidden;margin:0 0 20px;max-height:80px;font-size:30px;font-weight:600;letter-spacing:-.03em;text-align:center;transition:opacity var(--t-base),transform var(--t-base),max-height var(--t-base)}
.stage:not(.is-home) .stage-head{max-height:0;margin-bottom:0;opacity:0;transform:translateY(-10px)}
.stage-sub{position:relative;margin:-10px 0 24px;text-align:center;color:var(--muted);font-size:13.5px}
.stage:not(.is-home) .stage-sub{display:none}

.thread{display:flex;flex-direction:column;gap:18px;padding:22px 0 16px}
.thread:empty{display:none}
.msg{display:flex;flex-direction:column;gap:5px}
.msg-user{align-items:flex-end}
.msg-user .bubble{max-width:min(100%,540px);padding:10px 14px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-lg);white-space:pre-wrap;overflow-wrap:anywhere}
.msg-assistant .msg-who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.msg-assistant .bubble{max-width:min(100%,620px);padding:0;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}

/* ============ Composer ============ */
.composer-slot{
  flex:0 0 auto;
  width:min(100%,var(--measure));
  margin:0 auto;
  padding:0 calc(20px + var(--safe-r)) calc(16px + var(--safe-b)) calc(20px + var(--safe-l));
}
.composer{
  position:relative;
  display:flex;flex-direction:column;gap:4px;
  padding:10px 12px 8px;
  background-color:var(--panel-2);
  background-image:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 55%);
  border:1px solid var(--line-strong);
  border-radius:28px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.03) inset,
    0 12px 32px -20px rgba(0,0,0,.9);
  transition:border-color var(--t-base),box-shadow var(--t-base);
}
.composer:focus-within{
  border-color:rgba(139,92,246,.5);
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 0 0 4px rgba(139,92,246,.13),
    0 16px 40px -22px rgba(139,92,246,.55);
}
.composer.is-dragging{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

.composer-model-chip{
  display:inline-flex;align-items:center;gap:5px;
  align-self:flex-start;
  max-width:100%;min-width:0;
  height:22px;
  padding:0 6px 0 4px;
  border-radius:6px;
  background:transparent;
  border:1px solid transparent;
  color:var(--dim);
  font-size:11.5px;
  font-weight:500;
  transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base);
}
.composer-model-chip:hover{background:var(--panel-3);color:var(--muted);border-color:var(--line)}
.composer-model-chip .cmc-icon{width:14px;height:14px;display:grid;place-items:center;flex:0 0 auto;font-size:9px;font-weight:800}
.composer-model-chip .cmc-icon img{width:14px;height:14px;object-fit:contain;display:block}
.composer-model-chip .cmc-icon[data-letter] img{display:none}
.composer-model-chip .cmc-icon[data-letter]::before{content:attr(data-letter)}
.composer-model-chip .cmc-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;padding-right:2px}
.composer-model-chip .cmc-caret{width:10px;height:10px;opacity:.55;flex:0 0 auto}

.composer textarea{
  width:100%;
  min-height:28px;max-height:200px;
  padding:2px 10px 4px;
  resize:none;line-height:1.55;
  outline:0;
  font:inherit;font-size:15.5px;
  background:transparent;color:var(--text);
  border-radius:18px;
}
.composer textarea::placeholder{color:var(--dim)}

.composer-bar{display:flex;align-items:center;gap:6px;padding:2px 2px 0;min-height:38px}
.composer-spacer{flex:1;min-width:6px}

.chip-btn{
  display:grid;place-items:center;width:34px;height:34px;padding:0;
  color:var(--muted);font-size:15px;
  border:1px solid var(--line);border-radius:50%;
  flex:0 0 auto;
  transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base),transform var(--t-fast);
}
.chip-btn:hover{background:var(--panel-3);color:var(--text);border-color:var(--line-strong)}
.chip-btn:active{transform:scale(.94)}
.chip-btn.is-on{color:var(--accent);border-color:rgba(61,125,255,.4);background:var(--accent-soft)}

.send{
  display:grid;place-items:center;
  width:36px;height:36px;flex:0 0 auto;
  background:var(--text);color:#0a0a0a;
  border-radius:50%;
  transition:background-color var(--t-base),transform var(--t-fast),box-shadow var(--t-base);
}
.send:hover{background:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.send:active{transform:scale(.94)}
.stop-btn{background:var(--danger)!important;color:#fff!important}
.stop-btn:hover{background:#ff7a7a!important;box-shadow:0 0 0 4px rgba(242,97,97,.18)}

/* ============ Provider tiles (CSS masks) ============
   The tile itself is a rounded coloured chip. When a brand icon
   is available, it renders as a mask filled with currentColor —
   so the icon picks up the brand colour instead of the SVG's own
   black fill. When no icon resolves, we fall back to a letter. */
.tile{
  width:26px;height:26px;border-radius:7px;
  display:grid;place-items:center;
  flex:0 0 auto;
  font-size:10px;font-weight:800;
  overflow:hidden;
  line-height:1;
}
.tile-icon{
  display:block;
  width:66%;height:66%;
  background-color:currentColor;
  -webkit-mask-image:var(--icon-url);
          mask-image:var(--icon-url);
  -webkit-mask-size:contain;
          mask-size:contain;
  -webkit-mask-repeat:no-repeat;
          mask-repeat:no-repeat;
  -webkit-mask-position:center;
          mask-position:center;
}
.tile.tile-sm{width:18px;height:18px;border-radius:6px}
.tile.tile-sm .tile-icon{width:72%;height:72%}
.tile.tile-xs{width:16px;height:16px;border-radius:4px;font-size:9px}
.tile.tile-xs .tile-icon{width:76%;height:76%}
.tile.tile-lg{width:34px;height:34px;border-radius:10px;font-size:13px}
.tile.tile-lg .tile-icon{width:66%;height:66%}

/* Loading spinner shown on a tile while its icon URL is being
   probed. Collapses the moment the icon resolves or fails. */
.tile[data-loading]::after{
  content:"";
  width:38%;height:38%;
  border-radius:50%;
  border:1.5px solid currentColor;
  border-right-color:transparent;
  animation:think-spin .9s linear infinite;
  opacity:.6;
}

/* ============ Admin: Provider Icons ============ */
.provider-grid{
  display:flex;flex-direction:column;gap:8px;
}
.provider-row{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) auto;
  align-items:center;gap:12px;
  padding:12px;
  border:1px solid var(--line);border-radius:12px;
  background:var(--panel-2);
}
.provider-row-main{min-width:0}
.provider-row-main b{display:block;font-size:13.5px;font-weight:500}
.provider-row-main small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.provider-row-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.provider-row-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim)}
.provider-row-status.ok{color:var(--ok)}
.provider-row-status.ok::before{background:var(--ok)}
.provider-row-status.override{color:var(--accent)}
.provider-row-status.override::before{background:var(--accent)}
.provider-row-status.missing{color:var(--danger)}
.provider-row-status.missing::before{background:var(--danger)}
.provider-row-input{
  display:flex;gap:6px;align-items:center;
  grid-column:1 / -1;
  margin-top:4px;
}
.provider-row-input input{
  flex:1;min-width:0;
  padding:10px 12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--text);
  outline:0;
}
.provider-row-input input:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px var(--accent-soft)}
.provider-row-input button{
  padding:10px 14px;
  font-size:12.5px;
  border-radius:8px;
  flex:0 0 auto;
}
@media (max-width:520px){
  .provider-row{grid-template-columns:36px minmax(0,1fr)}
  .provider-row-status{grid-column:1 / -1;margin-top:4px}
}

/* ============ Model health ============ */
.mh-summary{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px;
}
@media(max-width:640px){.mh-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

.mh-toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;
}
.mh-toolbar .spacer{flex:1}

/* Test scope dropdown + button group */
.mh-test-scope{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mh-test-scope select{
  background:var(--panel-3);
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 12px;
  color:var(--text);
  outline:0;
  font-size:12.5px;
  min-width:170px;
  cursor:pointer;
  transition:border-color var(--t-base),box-shadow var(--t-base);
}
.mh-test-scope select:focus{
  border-color:var(--line-strong);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.mh-test-scope select:disabled{opacity:.5;cursor:not-allowed}
.mh-test-scope select option:disabled{color:var(--dim)}
.mh-progress{
  font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;
}
.mh-progress-bar{
  display:inline-block;vertical-align:middle;
  width:80px;height:4px;border-radius:99px;background:var(--panel-3);
  overflow:hidden;margin-left:8px;
}
.mh-progress-bar i{
  display:block;height:100%;background:var(--accent);transition:width var(--t-base);
}

.mh-row{
  display:grid;
  grid-template-columns:22px 20px minmax(0,1.6fr) 100px 80px 130px auto;
  align-items:center;gap:10px;
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  transition:background-color var(--t-base);
}

/* Per-row select checkbox */
.mh-select{
  display:grid;
  place-items:center;
  width:22px;height:22px;
  cursor:pointer;
  flex:0 0 auto;
}
.mh-select input{
  all:revert;
  width:16px;height:16px;
  cursor:pointer;
  accent-color:var(--accent);
}
.mh-row:last-child{border-bottom:0}
.mh-row:hover{background:var(--panel-2)}
.mh-row.is-disabled{opacity:.55}
.mh-row .mh-dot{
  width:8px;height:8px;border-radius:50%;background:var(--dim);
}
.mh-row.status-ok .mh-dot{background:var(--ok)}
.mh-row.status-failed .mh-dot{background:var(--danger)}
.mh-row.status-disabled .mh-dot{background:var(--dim)}
.mh-row-main{min-width:0}
.mh-row-main b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh-row-main small{display:block;color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh-row-cell{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mh-row-actions{display:flex;gap:5px;justify-self:end}
.mh-row-actions button{
  padding:6px 9px;font-size:11.5px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel-3);color:var(--muted);
  transition:background-color var(--t-base),color var(--t-base);
}
.mh-row-actions button:hover{background:var(--raised);color:var(--text)}
.mh-row-actions button.primary{color:var(--accent);border-color:rgba(61,125,255,.35)}
.mh-row-actions button.danger{color:var(--danger);border-color:rgba(242,97,97,.3)}
.mh-row-actions button[disabled]{opacity:.35;cursor:not-allowed}

.mh-table{
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
}
.mh-provider-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);
  font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
}
.mh-provider-head button{
  padding:5px 9px;font-size:11px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel-3);color:var(--muted);
}
.mh-provider-head button:hover{color:var(--text)}

.mh-filter-row{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;
}
.mh-filter{
  padding:6px 11px;font-size:12px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel-3);color:var(--muted);
  transition:background-color var(--t-base),color var(--t-base);
}
.mh-filter:hover{color:var(--text)}
.mh-filter.is-active{background:var(--accent-soft);color:var(--text);border-color:rgba(61,125,255,.4)}

@media (max-width: 640px) {
  /* Stack the health row so model name and Test/Disable/Enable
     buttons are visible. The desktop grid uses fixed widths that
     don't fit a 360px viewport. */
  .mh-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 14px 12px;
    align-items: center;
  }
  .mh-select {
    order: -1;
    flex: 0 0 22px;
  }
  .mh-row .mh-dot {
    flex: 0 0 8px;
    align-self: flex-start;
    margin-top: 6px;
  }
  .mh-test-scope {
    flex: 1 1 100%;
  }
  .mh-test-scope select {

  }
  .mh-test-scope button {

  }
  .mh-row-main {

  .mh-row-actions {

  display:flex;align-items:center;gap:8px;

  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:12px;
  min-width:0;
}
.apikey-card-key code{
  flex:1;min-width:0;
  font-family:var(--mono);font-size:12.5px;
  color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:.02em;
}
.apikey-card-key.has-full code{color:var(--text)}
.apikey-copy-icon{
  display:grid;place-items:center;
  width:28px;height:28px;flex:0 0 auto;
  border-radius:8px;
  color:var(--muted);
  transition:background-color var(--t-base),color var(--t-base);
}
.apikey-copy-icon:hover{background:var(--raised);color:var(--text)}
.apikey-copy-icon svg{width:14px;height:14px}
.apikey-copy-icon.is-copied{color:var(--ok)}

.apikey-card-meta{
  display:flex;flex-wrap:wrap;gap:6px 14px;
  font-size:11.5px;
  color:var(--dim);
  margin-bottom:12px;
}
.apikey-card-meta b{color:var(--muted);font-weight:500}

.apikey-card-actions{
  display:flex;gap:8px;
  flex-wrap:wrap;
}
.apikey-card-actions button{
  padding:8px 12px;
  font-size:12.5px;
  border-radius:8px;
  background:var(--panel-3);
  border:1px solid var(--line);
  color:var(--muted);
  transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base);
}
.apikey-card-actions button:hover{background:var(--raised);color:var(--text);border-color:var(--line-strong)}
.apikey-card-actions button.danger{color:var(--danger);border-color:rgba(242,97,97,.25)}
.apikey-card-actions button.danger:hover{background:rgba(242,97,97,.1);color:var(--danger);border-color:rgba(242,97,97,.4)}

.apikey-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;
  padding:48px 20px;
  text-align:center;
  border:1px dashed var(--line-strong);
  border-radius:16px;
  background:var(--panel-2);
}
.apikey-empty-icon{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
}
.apikey-empty-icon svg{width:24px;height:24px}
.apikey-empty h4{margin:0;font-size:15px;font-weight:600}
.apikey-empty p{margin:0;color:var(--dim);font-size:12.5px;max-width:320px;line-height:1.55}
.apikey-empty .btn-primary{padding:12px 20px;font-size:13.5px;border-radius:10px;margin-top:4px}

.apikey-created-value{
  padding:16px;
  background:var(--panel);
  border:1px solid var(--line-strong);
  border-radius:12px;
  font-family:var(--mono);
  font-size:13px;
  word-break:break-all;
  line-height:1.6;
  margin:12px 0;
  color:var(--text);
  user-select:all;
  -webkit-user-select:all;
}
.apikey-created-warning{
  padding:12px 14px;
  background:rgba(242,97,97,.08);
  border:1px solid rgba(242,97,97,.25);
  border-radius:10px;
  color:var(--danger);
  font-size:12.5px;
  line-height:1.55;
  margin-bottom:12px;
}

/* ============ API DOCS PAGE (modern) ============ */
.docs-hero{
  padding:20px;
  border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  margin-bottom:22px;
}
.docs-hero h3{margin:0 0 6px;font-size:17px;font-weight:600}
.docs-hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;max-width:560px}

.docs-baseurl{
  display:flex;align-items:center;gap:8px;
  padding:12px 14px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:12px;
  margin:20px 0 26px;
  min-width:0;
}
.docs-baseurl-label{
  font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--dim);text-transform:uppercase;
  flex:0 0 auto;
}
.docs-baseurl-code{
  flex:1;min-width:0;
  font-family:var(--mono);font-size:12.5px;
  color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.docs-baseurl-actions{
  display:flex;gap:4px;flex:0 0 auto;
}
.docs-icon-btn{
  display:grid;place-items:center;
  width:30px;height:30px;
  border-radius:8px;
  color:var(--muted);
  transition:background-color var(--t-base),color var(--t-base);
}
.docs-icon-btn:hover{background:var(--raised);color:var(--text)}
.docs-icon-btn svg{width:14px;height:14px}
.docs-icon-btn.is-copied{color:var(--ok)}

.docs-edit-row{
  display:flex;gap:6px;align-items:center;
  width:100%;min-width:0;
}
.docs-edit-row input{
  flex:1;min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
  font-size:12.5px;
  font-family:var(--mono);
  color:var(--text);
  outline:0;
}
.docs-edit-row input:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px var(--accent-soft)}
.docs-edit-row button{
  padding:8px 12px;font-size:12px;border-radius:8px;
  flex:0 0 auto;
}
.docs-edit-row .btn-save{background:var(--accent);color:#fff;font-weight:500}
.docs-edit-row .btn-cancel{background:var(--panel-3);border:1px solid var(--line);color:var(--muted)}

.docs-section-title{
  font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--dim);
  margin:26px 0 10px;
}

.docs-endpoint{
  margin:0 0 16px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel-2);
  position:relative;
  overflow:hidden;
}
.docs-endpoint::before{
  content:"";position:absolute;
  left:0;top:0;bottom:0;width:3px;
  background:var(--line-strong);
}
.docs-endpoint.method-get::before{background:#22c55e}
.docs-endpoint.method-post::before{background:#3d7dff}

.docs-endpoint-head{
  display:flex;align-items:center;gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.docs-method{
  display:inline-flex;align-items:center;
  height:20px;padding:0 8px;
  border-radius:5px;
  font-family:var(--mono);
  font-size:10.5px;font-weight:600;
  letter-spacing:.04em;
}
.docs-method.get{background:rgba(34,197,94,.14);color:#4ade80}
.docs-method.post{background:rgba(61,125,255,.14);color:#7aa9ff}
.docs-path{
  font-family:var(--mono);
  font-size:13px;
  color:var(--text);
  font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-width:0;
}
.docs-endpoint p{
  margin:0 0 12px;
  color:var(--muted);
  font-size:12.5px;
  line-height:1.55;
}

.docs-code{
  position:relative;
  background:#0d0d0d;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}
:root[data-theme="light"] .docs-code{background:#f4f4f5}
.docs-code pre{
  margin:0;
  padding:12px 14px;
  overflow-x:auto;
  font-family:var(--mono);
  font-size:12px;
  line-height:1.6;
  color:var(--text);
  -webkit-overflow-scrolling:touch;
}
.docs-code-copy{
  position:absolute;top:8px;right:8px;
  display:grid;place-items:center;
  width:28px;height:28px;
  border-radius:8px;
  background:var(--panel-3);
  border:1px solid var(--line);
  color:var(--muted);
  transition:background-color var(--t-base),color var(--t-base);
}
.docs-code-copy:hover{background:var(--raised);color:var(--text)}
.docs-code-copy.is-copied{color:var(--ok);background:rgba(86,211,100,.12);border-color:rgba(86,211,100,.3)}
.docs-code-copy svg{width:13px;height:13px}

.docs-note{
  padding:14px 16px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--muted);
  font-size:12.5px;
  line-height:1.6;
}

/* ============ Models catalogue ============ */
.page-view{position:fixed;inset:0;background:var(--bg);z-index:55;display:none;flex-direction:column}
.page-view.open{display:flex}
.page{flex:1;display:flex;flex-direction:column;min-height:0;max-width:960px;width:100%;margin:0 auto}
.page-head{flex:0 0 auto;padding:calc(18px + var(--safe-t)) 20px 0}
.page-head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.page-head h2{margin:0;font-size:20px}
.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:640px}
.page-close{width:34px;height:34px;border-radius:var(--r-sm);color:var(--muted);flex:0 0 auto;display:grid;place-items:center}
.page-close:hover{background:var(--panel-3);color:var(--text)}
.toolbar{flex:0 0 auto;padding:14px 20px 0}
.search-field{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-md)}
.search-field:focus-within{border-color:var(--line-strong)}
.search-field svg{color:var(--dim);flex:0 0 auto}
.search-field input{flex:1;background:none;outline:0;min-width:0}
.filters{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px}
.filter{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 6px;color:var(--muted);font-size:12.5px;background:var(--panel-3);border:1px solid var(--line);border-radius:99px;transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base)}
.filter:hover{color:var(--text);border-color:var(--line-strong)}
.filter.is-active{color:var(--text);background:var(--accent-soft);border-color:rgba(61,125,255,.4)}
.filter .tile{width:16px;height:16px;border-radius:4px}
.page-body{flex:1;min-height:0;overflow-y:auto;padding:6px 20px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.model-table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}

.model-head,.model-row{
  display:grid;
  grid-template-columns:minmax(0,2.2fr) 84px 96px 88px 34px 34px;
  align-items:center;gap:12px;padding:0 14px;
}
.model-head{height:36px;background:var(--panel-2);border-bottom:1px solid var(--line);color:var(--dim);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase}
.model-row{border-bottom:1px solid var(--line);transition:background-color var(--t-base)}
.model-row:last-child{border-bottom:0}
.model-row:hover{background:var(--panel-2)}
.model-row.is-active{background:var(--accent-soft)}
.model-main{
  grid-column:1 / 5;
  display:grid;
  grid-template-columns:minmax(0,2.2fr) 84px 96px 88px;
  align-items:center;gap:12px;
  min-height:58px;
  background:none;border:0;color:inherit;padding:0;
  text-align:left;cursor:pointer;
}
.model-id{display:flex;align-items:center;gap:10px;min-width:0}
.model-id-text{display:grid;min-width:0;line-height:1.32}
.model-id-text b{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-id-text small{color:var(--dim);font-size:11.5px}
.model-cell{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:0}
.model-cell.price{color:var(--dim);font-size:11.5px}
.selected-flag{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:11.5px}
.model-fav{grid-column:6;justify-self:end;width:30px;height:30px;border-radius:var(--r-sm);color:var(--dim);display:grid;place-items:center;transition:color var(--t-base),background-color var(--t-base)}
.model-fav:hover,.model-fav.is-on{color:#ffd45c;background:var(--panel-3)}
.model-copy-id{grid-column:5;justify-self:end;width:30px;height:30px;border-radius:var(--r-sm);color:var(--dim);display:grid;place-items:center;opacity:.5;transition:color var(--t-base),background-color var(--t-base),opacity var(--t-base)}
.model-copy-id:hover{color:var(--text);background:var(--panel-3);opacity:1}
.model-copy-id.is-copied{color:var(--ok);opacity:1}
.model-copy-id svg{width:13px;height:13px}

@media (max-width:640px){
  .model-head{display:none}
  .model-row{grid-template-columns:minmax(0,1fr) 34px 34px;gap:8px;padding:12px}
  .model-main{grid-column:1;grid-template-columns:minmax(0,1fr);gap:5px;min-height:0}
  .model-copy-id{grid-column:2;align-self:start}
  .model-fav{grid-column:3;align-self:start}
  .model-cell{display:flex;align-items:baseline;gap:8px;font-size:12px}
  .model-cell::before{content:attr(data-label);color:var(--dim);font-size:11px;min-width:82px;flex:0 0 auto}
}

/* ============ Admin dashboard ============ */
.admin-page{position:fixed;inset:0;background:var(--bg);z-index:58;display:none;flex-direction:column}
.admin-page.open{display:flex}
.admin-shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:0;flex:1}
.admin-nav{border-right:1px solid var(--line);padding:14px 10px;background:var(--panel);display:flex;flex-direction:column;gap:3px;min-height:0}
.admin-nav-title{padding:7px 10px 13px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.admin-nav button{height:36px;padding:0 11px;text-align:left;border-radius:var(--r-sm);color:var(--muted);border:1px solid transparent}
.admin-nav button:hover,.admin-nav button.is-active{background:var(--panel-3);color:var(--text);border-color:var(--line)}
.admin-back{margin-top:auto!important}
.admin-main{min-width:0;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.admin-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:calc(58px + var(--safe-t));
  padding:var(--safe-t) calc(20px + var(--safe-r)) 0 calc(20px + var(--safe-l));
  border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);z-index:2;
}
.admin-head h2{margin:0;font-size:18px}
.admin-head-actions{display:flex;gap:7px}
.admin-content{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
.admin-kicker{color:var(--dim);font-size:12px;margin:0 0 18px}
.admin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.admin-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);padding:15px}
.admin-card-label{color:var(--muted);font-size:12px}
.admin-card-value{font-size:24px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.admin-card-sub{color:var(--dim);font-size:11px;margin-top:4px}
.admin-section{margin-top:22px}
.admin-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.admin-section-head h3{margin:0;font-size:14px}
.admin-section-head span{color:var(--dim);font-size:11.5px}
.admin-status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.admin-status{display:flex;align-items:center;gap:9px;padding:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md)}
.admin-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.admin-dot.ok{background:#56d364}.admin-dot.bad{background:var(--danger)}
.admin-status b{display:block;font-size:12.5px;font-weight:500}
.admin-status small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.admin-actions{display:flex;flex-wrap:wrap;gap:8px}
.admin-note{padding:13px 14px;background:var(--panel-2);border:1px dashed var(--line-strong);border-radius:var(--r-md);color:var(--muted);font-size:12.5px;line-height:1.6}
.admin-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);-webkit-overflow-scrolling:touch}
.admin-table{width:100%;border-collapse:collapse;min-width:680px}
.admin-table th,.admin-table td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}
.admin-table th{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--panel-2)}
.admin-table tr:last-child td{border-bottom:0}
.admin-code{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
.admin-empty{padding:20px;color:var(--dim);font-size:12px;text-align:center}
.admin-mobile-close{display:none}

@media(max-width:800px){
  .admin-shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .admin-nav{
    flex-direction:row;align-items:center;
    overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--line);
    padding:8px;gap:6px;
    scrollbar-width:none;
  }
  .admin-nav::-webkit-scrollbar{display:none}
  .admin-nav-title{display:none}
  .admin-nav button{flex:0 0 auto;white-space:nowrap;height:34px;padding:0 12px;border:1px solid var(--line)}
  .admin-back{display:none}
  .admin-mobile-close{display:inline-flex!important}
  .admin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .admin-status-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .admin-content{padding:16px 12px calc(30px + var(--safe-b))}
  .admin-card{padding:12px}
  .admin-card-value{font-size:20px}
}

/* ============ Overlay ============ */
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:stretch;justify-content:flex-end;z-index:60}
.overlay.open{display:flex}
.dialog{
  width:min(420px,92vw);height:100%;background:var(--panel);border-left:1px solid var(--line);
  padding:calc(18px + var(--safe-t)) 18px calc(18px + var(--safe-b));
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.dialog h2{margin:0 0 16px;font-size:17px}
.field{display:grid;gap:7px;margin:14px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea{background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);padding:11px;outline:0;min-width:0}
.field input:focus,.field textarea:focus{border-color:var(--line-strong)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.btn-primary{background:var(--accent);color:#fff;padding:11px 12px;border-radius:var(--r-sm);font-weight:600;transition:filter var(--t-base),transform var(--t-fast)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:scale(.985)}
.btn-ghost{background:var(--panel-3);padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);transition:background-color var(--t-base),border-color var(--t-base)}
.btn-ghost:hover{background:var(--raised);border-color:var(--line-strong)}
.hint-text{color:var(--dim);font-size:12px;line-height:1.6}

.toast{
  position:fixed;top:calc(66px + var(--safe-t));right:calc(18px + var(--safe-r));
  background:var(--panel-3);border:1px solid var(--line);
  padding:11px 14px;border-radius:var(--r-sm);font-size:13px;
  display:none;z-index:70;max-width:min(360px,86vw);box-shadow:0 12px 40px #000a;
}
.toast.show{display:block}

/* ============ Mobile responsive ============ */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;width:min(84vw,290px);
    transform:translateX(-100%);transition:transform var(--t-base);
    box-shadow:0 0 0 1px var(--line),24px 0 60px rgba(0,0,0,.45);
    padding-bottom:calc(10px + var(--safe-b));
  }
  .shell.nav-open .sidebar{transform:none}
  .drawer-close,.drawer-open{display:inline-flex;align-items:center;justify-content:center}
  .main-head{padding-left:calc(10px + var(--safe-l));padding-right:calc(10px + var(--safe-r))}
  .side-chat{padding:10px;font-size:13.5px}
}

@media (max-width:640px){
  .stage-inner{padding:0 14px}
  .composer-slot{
    padding-left:calc(12px + var(--safe-l));
    padding-right:calc(12px + var(--safe-r));
    padding-bottom:calc(12px + var(--safe-b));
  }
  .composer{padding:8px 10px 6px;border-radius:24px}
  .composer textarea{min-height:26px;padding:2px 8px 4px;font-size:16px}
  .composer-model-chip{height:20px;font-size:11px}
  .msg-user .bubble{max-width:100%}
  .stage-head{font-size:23px}
  .msg-action{width:32px;height:32px}
  .page-head{padding:calc(14px + var(--safe-t)) 14px 0}
  .toolbar{padding:12px 14px 0}
  .filters{padding:10px 14px}
  .page-body{padding:6px 14px calc(20px + var(--safe-b))}
}

@media (max-width:420px){
  .chip-btn{width:32px;height:32px}
  .send{width:34px;height:34px}
}

@media (max-width:900px){
  input,textarea,select{font-size:16px}
}

/* ============ Chat manager ============ */
.chat-search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-md)}
.chat-search input{width:100%;outline:0;background:none}
.chat-tools{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chat-tool{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:12.5px;background:var(--panel-2)}
.chat-tool:hover,.chat-tool.is-on{background:var(--panel-3);color:var(--text)}
.chat-item{display:grid;grid-template-columns:1fr auto;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel-2)}
.chat-item:hover{background:var(--panel-3)}
.chat-item-main{min-width:0;text-align:left}
.chat-item-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:500}
.chat-item-meta{display:block;color:var(--dim);font-size:11.5px;margin-top:4px}
.chat-item-actions{display:flex;gap:3px;align-items:center}
.chat-item-actions button{color:var(--dim);font-size:14px;padding:6px 8px;border-radius:6px}
.chat-item-actions button:hover{color:var(--text);background:var(--raised)}
@media(max-width:640px){.chat-item{grid-template-columns:1fr}.chat-item-actions{justify-content:flex-end}}

.attachment-strip{display:flex;gap:6px;flex-wrap:wrap;padding:2px 2px 0}
.attachment-chip{position:relative;display:flex;align-items:center;gap:5px;max-width:100%;padding:5px 7px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-sm);font-size:11.5px;color:var(--muted)}
.attachment-chip span{max-width:min(180px,50vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attachment-chip button{color:var(--dim);padding:0 3px}
.attachment-chip button:hover{color:var(--text)}
.attachment-kind{font-size:9px;color:var(--dim);text-transform:uppercase}

.model-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:3px}
.cap-badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--line);border-radius:99px;color:var(--dim);font-size:9.5px;background:var(--panel-3);white-space:nowrap}
.model-tools{display:flex;gap:7px;flex-wrap:wrap;padding:0 20px 4px}
.model-tool{height:32px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-3);color:var(--muted);font-size:11.5px;transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base)}
.model-tool:hover,.model-tool.is-on{color:var(--text);border-color:var(--line-strong);background:var(--raised)}

/* ============ Themes ============ */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#fff; --panel:#f7f7f8; --panel-2:#f0f0f1; --panel-3:#e8e8ea; --raised:#e0e0e2;
  --line:#e2e2e4; --line-strong:#cfcfd2; --text:#1a1a1a; --muted:#5c5c60; --dim:#8b8b8f;
  --accent-soft:rgba(61,125,255,.12);
}
:root[data-theme="light"] .admin-head{background:rgba(255,255,255,.92)}
:root[data-theme="light"] .composer{
  background-image:linear-gradient(180deg,rgba(0,0,0,.01),rgba(0,0,0,0) 55%);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 12px 32px -22px rgba(0,0,0,.18);
}
:root[data-theme="light"] .send{color:#fff}
:root[data-theme="light"] .send:hover{background:#000}
:root[data-theme="light"] .toast{color:var(--text)}
:root[data-theme="light"] .auth-primary{background:#111;color:#fff}
:root[data-theme="amoled"]{
  color-scheme:dark;
  --bg:#000; --panel:#000; --panel-2:#050505; --panel-3:#0c0c0c; --raised:#131313;
  --line:#1a1a1a; --line-strong:#242424; --text:#f0f0f0; --muted:#8f8f8f; --dim:#5c5c5c;
}
:root[data-theme="amoled"] .composer{background-color:#050505}

/* ============ Density / font ============ */
:root[data-fontsize="small"] .bubble, :root[data-fontsize="small"] .composer textarea{font-size:12.5px}
:root[data-fontsize="large"] .bubble, :root[data-fontsize="large"] .composer textarea{font-size:15.5px}
:root[data-density="compact"] .thread{gap:10px}
:root[data-density="compact"] .msg-user .bubble{padding:7px 10px}
:root[data-density="spacious"] .thread{gap:28px}
:root[data-density="spacious"] .msg-user .bubble{padding:14px 18px}

/* ============ Thinking / reasoning ============ */
/* thinking styles replaced below */30%{opacity:1;transform:scale(1)}}
.thinking-spark{display:inline-block;animation:think-spin 1.6s linear infinite}
@keyframes think-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
.reasoning-block{margin:0 0 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);max-width:min(100%,640px)}
.reasoning-toggle{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:9px 12px;color:var(--muted);font-size:12.5px;font-weight:500}
.reasoning-toggle:hover{color:var(--text)}
.reasoning-body{display:none;padding:9px 12px 12px;color:var(--dim);font-size:12.5px;white-space:pre-wrap;line-height:1.55;border-top:1px solid var(--line);margin-top:2px}
.reasoning-block.open .reasoning-body{display:block}
 
.reasoning-caret{transition:transform var(--t-fast);display:inline-block}
.msg-error .bubble{color:var(--danger)}

/* ============ Markdown ============ */
.md{line-height:1.65;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{line-height:1.3;margin:18px 0 8px;font-weight:600}
.md h1{font-size:1.4em}.md h2{font-size:1.22em}.md h3{font-size:1.08em}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li{margin:3px 0}
.md blockquote{margin:0 0 12px;padding:2px 14px;border-left:3px solid var(--line-strong);color:var(--muted)}
.md a{color:var(--accent);text-decoration:underline}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md code{font-family:var(--mono);font-size:.9em;background:var(--panel-3);padding:2px 5px;border-radius:4px}
.md pre{
  margin:0 0 12px;
  background:#0d0d0d;
  border:1px solid var(--line);
  border-radius:var(--r-md);
  overflow:hidden;
}
:root[data-theme="light"] .md pre{background:#f4f4f5}
.md pre code{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  padding:0;
  background:none;
  border-radius:0;
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.55;
  color:var(--text);
}
.md pre code .code-gutter{
  padding:12px 10px 12px 14px;
  text-align:right;
  color:var(--dim);
  user-select:none;
  -webkit-user-select:none;
  background:rgba(255,255,255,.02);
  border-right:1px solid var(--line);
  white-space:pre;
  font:inherit;
  min-width:2.5em;
}
:root[data-theme="light"] .md pre code .code-gutter{background:rgba(0,0,0,.03)}
.md pre code .code-text{
  display:block;
  padding:12px 14px;
  white-space:pre;
  min-width:0;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.md pre code.code-wrapped{
  grid-template-columns:minmax(0,1fr);
}
.md pre code.code-wrapped .code-gutter{display:none}
.md pre code.code-wrapped .code-text{
  white-space:pre-wrap;
  overflow-x:visible;
  word-break:break-word;
}
@media (max-width:640px){
  .md pre code .code-gutter{display:none}
  .md pre code{grid-template-columns:minmax(0,1fr)}
}

/* Refined hljs overrides — matches app palette */
.hljs{color:var(--text);background:transparent}
.hljs-comment,.hljs-quote{color:#6b7280;font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-name{color:#c4b5fd}
.hljs-string,.hljs-attr,.hljs-addition{color:#a5d6a7}
.hljs-number,.hljs-literal,.hljs-symbol,.hljs-bullet{color:#f0b378}
.hljs-title,.hljs-title.class_,.hljs-title.function_,.hljs-section{color:#7ab8ff}
.hljs-variable,.hljs-template-variable,.hljs-params{color:#e5e7eb}
.hljs-type,.hljs-class .hljs-title{color:#f7c948}
.hljs-meta,.hljs-doctag{color:#9a9a9a}
.hljs-tag{color:#8b8b8f}
.hljs-tag .hljs-name{color:#c4b5fd}
.hljs-tag .hljs-attr{color:#f0b378}
.hljs-deletion{color:#f26161}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:600}
:root[data-theme="light"] .hljs-comment,
:root[data-theme="light"] .hljs-quote{color:#8b8b92}
:root[data-theme="light"] .hljs-keyword,
:root[data-theme="light"] .hljs-selector-tag{color:#7c3aed}
:root[data-theme="light"] .hljs-string,
:root[data-theme="light"] .hljs-attr{color:#059669}
:root[data-theme="light"] .hljs-number,
:root[data-theme="light"] .hljs-literal{color:#d97706}
:root[data-theme="light"] .hljs-title,
:root[data-theme="light"] .hljs-section{color:#2563eb}
.code-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--panel-3);border-bottom:1px solid var(--line);font-size:11px;color:var(--dim)}
.code-toolbar-actions{display:flex;gap:4px}
.code-toolbar button{padding:4px 8px;border-radius:5px;color:var(--muted);font-size:11px}
.code-toolbar button:hover{background:var(--raised);color:var(--text)}
.md table{border-collapse:collapse;margin:0 0 12px;font-size:13px;min-width:100%}
.md-table-wrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:var(--r-md);-webkit-overflow-scrolling:touch}
.md-table-wrap table{margin:0}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap}
.md th{background:var(--panel-3);color:var(--muted);font-weight:600}
.md tr:nth-child(even) td{background:var(--panel-2)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}

/* ============ Avatars / prompts ============ */
.msg-user .msg-who{display:flex;align-items:center;justify-content:flex-end;gap:6px;color:var(--muted);font-size:12px;margin-bottom:2px}
.avatar-emoji{display:inline-grid;place-items:center;width:18px;height:18px;font-size:12px;border-radius:5px;background:var(--panel-3)}

.saved-prompt-row{display:flex;align-items:flex-start;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;background:var(--panel-2)}
.saved-prompt-main{flex:1;min-width:0}
.saved-prompt-main b{display:block;font-size:13.5px;font-weight:500;margin-bottom:3px}
.saved-prompt-main span{display:block;color:var(--dim);font-size:12px;line-height:1.4;max-height:2.8em;overflow:hidden}
.saved-prompt-actions{display:flex;flex-direction:column;gap:4px}
.saved-prompt-actions button{font-size:11.5px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:transparent}
.saved-prompt-actions button:hover{color:var(--text);border-color:var(--line-strong);background:var(--panel-3)}

.swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:transform var(--t-fast)}
.swatch:active{transform:scale(.94)}
.swatch.is-active{border-color:var(--text);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-option-row{display:flex;gap:8px;flex-wrap:wrap}
.theme-option{flex:1;min-width:84px;padding:12px 8px;border:1px solid var(--line);border-radius:var(--r-md);text-align:center;font-size:12.5px;color:var(--muted);background:var(--panel-2);transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base)}
.theme-option.is-active{border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.12);color:var(--text);font-weight:500}

.avatar-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:8px 0}
@media(max-width:420px){.avatar-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.avatar-opt{
  aspect-ratio:1;border-radius:10px;
  display:grid;place-items:center;
  font-size:20px;
  background:var(--panel-2);border:1px solid var(--line);
  transition:background-color var(--t-base),border-color var(--t-base),transform var(--t-fast);
}
.avatar-opt:hover{background:var(--panel-3);border-color:var(--line-strong)}
.avatar-opt:active{transform:scale(.94)}
.avatar-opt.is-active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}

/* ============ Full-screen editor ============ */
.editor-body{display:flex;flex-direction:column;gap:18px;min-height:100%}
.editor-section{}
.editor-section > label{
  display:block;
  font-size:12px;font-weight:500;color:var(--muted);
  margin-bottom:8px;letter-spacing:.01em;
}
.editor-textarea{
  width:100%;
  min-height:180px;
  padding:14px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  font-size:14.5px;
  line-height:1.6;
  resize:vertical;
  outline:0;
  transition:border-color var(--t-base),box-shadow var(--t-base);
  font-family:inherit;
}
.editor-textarea:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px var(--accent-soft)}
.editor-input{
  width:100%;
  padding:14px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  font-size:14.5px;
  outline:0;
  transition:border-color var(--t-base),box-shadow var(--t-base);
  font-family:inherit;
}
.editor-input:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px var(--accent-soft)}
.editor-hint{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.editor-actions{
  display:flex;gap:10px;
  margin-top:auto;
  padding-top:16px;
}
.editor-actions .btn-primary,.editor-actions .btn-ghost{
  flex:1;
  padding:14px;
  font-size:14px;
  border-radius:10px;
}

/* ============ Tool activity pills (visible during generation) ============ */
.tool-pill-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:0 0 10px;
  max-width:min(100%,640px);
}
.tool-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 10px;
  border-radius:99px;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:11.5px;
  font-weight:500;
  line-height:1.2;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.tool-pill.running{ color:var(--muted); border-color:var(--line-strong); }
.tool-pill.running .spark{ display:inline-block; animation:think-pulse 1.2s ease-in-out infinite; }
.tool-pill.done{ color:var(--ok); border-color:rgba(86,211,100,.3); background:rgba(86,211,100,.06); }
.tool-pill.failed{ color:var(--danger); border-color:rgba(242,97,97,.3); background:rgba(242,97,97,.06); }

/* ============ Three-dots tool log button ============ */
.msg-action-tools{
  display:grid;place-items:center;width:28px;height:28px;
  border-radius:var(--r-sm);color:var(--muted);background:transparent;border:0;
  cursor:pointer;transition:color var(--t-base),background-color var(--t-base);
}
.msg-action-tools:hover{ color:var(--text); background:var(--panel-3); }
.msg-action-tools svg{ width:15px; height:15px; }

/* ============ Tool log dialog ============ */
.dialog-wide{ width:min(560px,96vw); }
.tl-section{ margin:0 0 20px; }
.tl-section:last-child{ margin-bottom:0; }
.tl-section h4{
  margin:0 0 8px;font-size:11.5px;color:var(--muted);font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
}
.tl-sources{ list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px; }
.tl-sources li{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;font-size:12.5px;
}
.tl-sources li .tl-idx{ color:var(--dim);font-family:var(--mono);font-size:11px;flex:0 0 auto; }
.tl-sources li a{
  flex:1;color:var(--accent);text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.tl-sources li a:hover{ text-decoration:underline; }
.tl-answer{
  padding:12px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  color:var(--muted);font-size:12.5px;line-height:1.6;white-space:pre-wrap;
  overflow-wrap:anywhere;max-height:9em;overflow:hidden;position:relative;
}
.tl-answer.expanded{ max-height:none; }
.tl-answer:not(.expanded)::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2.6em;
  background:linear-gradient(transparent,var(--panel-2));pointer-events:none;
}
.tl-expand{
  display:block;margin-top:6px;padding:0;background:none;border:0;
  color:var(--accent);font-size:11.5px;cursor:pointer;
}
.tl-expand:hover{ text-decoration:underline; }
.tl-file-row{
  display:flex;align-items:center;gap:10px;padding:9px 11px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  font-size:12.5px;margin-bottom:6px;
}
.tl-file-row:last-child{ margin-bottom:0; }
.tl-file-row .tl-name{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tl-file-row .tl-size{ color:var(--dim);font-family:var(--mono);font-size:11px;flex:0 0 auto; }


/* ============ Capability badges ============ */
.composer-model-chip .cmc-caps{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-left:2px;
  flex:0 0 auto;
}
.composer-model-chip .cmc-cap{
  display:inline-flex;
  align-items:center;
  height:14px;
  padding:0 5px;
  border-radius:4px;
  background:var(--panel-3);
  border:1px solid var(--line);
  color:var(--dim);
  font-size:9px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.03em;
  white-space:nowrap;
}
@media (max-width:520px){
  .composer-model-chip .cmc-caps{ display:none; }
}

.qs-row-caps{
  display:inline-flex;
  flex-wrap:wrap;
  gap:3px;
  margin-top:3px;
}
.qs-cap{
  display:inline-flex;
  align-items:center;
  height:15px;
  padding:0 5px;
  border-radius:4px;
  background:var(--panel-3);
  border:1px solid var(--line);
  color:var(--dim);
  font-size:9px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.03em;
}

/* ============ Vision routing note (admin only) ============ */
.vision-route-note{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
  padding:4px 9px;
  border-radius:6px;
  background:var(--panel-3);
  border:1px solid var(--line);
  color:var(--dim);
  font-family:var(--mono);
  font-size:10.5px;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.vision-route-note b{
  color:var(--muted);
  font-weight:500;
}


/* ============ Tool file download chip (PR 3 minimal version) ============ */
.tool-file-chip{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  text-decoration:none;
  font-size:12.5px;
  max-width:min(100%,340px);
  margin-top:8px;
  cursor:pointer;
  transition:background-color var(--t-base),border-color var(--t-base);
}
.tool-file-chip:hover{ background:var(--panel-3); border-color:var(--line-strong); }
.tool-file-chip .tfc-icon{ font-size:16px; flex:0 0 auto; }
.tool-file-chip .tfc-main{
  flex:1; min-width:0;
  display:flex; flex-direction:column; gap:1px;
}
.tool-file-chip .tfc-name{
  font-size:12.5px;
  font-weight:500;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tool-file-chip .tfc-size{
  font-size:10.5px;
  color:var(--dim);
}
.tool-file-chip .tfc-arrow{
  color:var(--dim);
  font-size:15px;
  flex:0 0 auto;
}


/* ============ File preview ============ */
.tool-file-chip-btn{ border:1px solid var(--line); background:var(--panel-2); cursor:pointer; text-align:left; font:inherit; }
.file-preview-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 0 14px;margin-bottom:12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:2;
}
.file-preview-meta{min-width:0;flex:1}
.file-preview-meta b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-preview-meta span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.file-preview-body{min-height:120px}
.file-preview-iframe{
  width:100%;height:min(70vh,560px);border:1px solid var(--line);border-radius:10px;background:#fff;
}
.file-preview-svg{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);overflow:auto}
.file-preview-code{
  margin:0;padding:14px;background:#0d0d0d;border:1px solid var(--line);border-radius:10px;
  overflow:auto;max-height:min(70vh,560px);font-family:var(--mono);font-size:12.5px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
}
:root[data-theme="light"] .file-preview-code{background:#f4f4f5}

/* ============ Site Lock — takeover screen ============ */
body.is-locked .shell,
body.is-locked .admin-page,
body.is-locked .page-view,
body.is-locked .qs-sheet,
body.is-locked .qs-backdrop,
body.is-locked .auth-page{ display:none !important; }

.lock-takeover{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 20%,rgba(242,97,97,.10),transparent 60%),var(--bg);
  padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));
  overflow-y:auto;
}
.lock-card{
  width:min(440px,100%);
  background:var(--panel);
  border:1px solid var(--line-strong);
  border-radius:18px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.8);
  animation:authIn 220ms cubic-bezier(.2,.8,.2,1);
}
.lock-icon{font-size:42px;line-height:1;margin-bottom:14px}
.lock-title{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.lock-message{
  margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.55;
  max-width:340px;margin-left:auto;margin-right:auto;
}
.lock-timer{
  display:inline-block;
  font-family:var(--mono);font-size:20px;font-weight:500;
  letter-spacing:.02em;
  padding:10px 18px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);
  color:var(--text);
  margin:0 0 20px;
  min-width:140px;
}
.lock-card .auth-primary{margin-top:0}
.lock-foot{
  margin-top:16px;padding-top:14px;
  border-top:1px solid var(--line);
  color:var(--dim);font-size:11.5px;line-height:1.5;
}

/* ============ Site Lock — admin banner ============ */
.admin-lock-banner{
  position:fixed;top:calc(8px + var(--safe-t));left:50%;transform:translateX(-50%);
  z-index:76;
  display:flex;align-items:center;gap:12px;
  padding:10px 12px 10px 16px;
  background:rgba(242,97,97,.14);
  border:1px solid rgba(242,97,97,.45);
  color:var(--danger);
  border-radius:99px;
  font-size:12.5px;font-weight:500;
  box-shadow:0 12px 32px -12px rgba(0,0,0,.6);
  max-width:calc(100vw - 24px);
}
.admin-lock-banner button{
  padding:6px 12px;border-radius:99px;
  background:var(--danger);color:#fff;
  font-size:11.5px;font-weight:600;
  flex:0 0 auto;
}
.admin-lock-banner button:hover{filter:brightness(1.08)}
@media(max-width:520px){
  .admin-lock-banner{font-size:11.5px;padding:8px 10px 8px 12px;gap:8px}
  .admin-lock-banner button{padding:5px 10px;font-size:11px}
}

/* ============ Site Lock — admin page ============ */
.admin-nav button.admin-nav-danger{ color:#ff8f8f; }
.admin-nav button.admin-nav-danger.is-active,
.admin-nav button.admin-nav-danger:hover{ color:var(--danger); border-color:rgba(242,97,97,.4); background:rgba(242,97,97,.08); }

.site-lock-status{
  display:flex;align-items:center;gap:16px;
  padding:18px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:14px;
}
.site-lock-status.is-locked{
  border-color:rgba(242,97,97,.4);
  background:linear-gradient(180deg,rgba(242,97,97,.08),transparent 70%),var(--panel-2);
}
.site-lock-status-icon{
  font-size:32px;line-height:1;
  width:56px;height:56px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:14px;
  background:var(--panel-3);border:1px solid var(--line);
}
.site-lock-status.is-locked .site-lock-status-icon{
  background:rgba(242,97,97,.12);border-color:rgba(242,97,97,.3);
}
.site-lock-status-body{flex:1;min-width:0}
.site-lock-status-body b{display:block;font-size:15px;font-weight:600;margin-bottom:3px}
.site-lock-status-body small{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:8px;overflow-wrap:anywhere}
.site-lock-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11.5px;color:var(--dim)}
.site-lock-meta b{display:inline;font-size:11.5px;color:var(--text);margin:0}
.site-lock-meta span{display:inline-flex;align-items:baseline;gap:5px}
.site-lock-unlock{background:var(--danger)!important}
.site-lock-lock{background:#d4a72c!important}
.site-lock-indefinite{color:var(--danger)!important;border-color:rgba(242,97,97,.3)!important}
.site-lock-indefinite:hover{background:rgba(242,97,97,.1)!important;border-color:rgba(242,97,97,.5)!important}

@media(max-width:520px){
  .site-lock-status{flex-direction:column;align-items:flex-start;gap:12px;padding:16px}
  .site-lock-status-icon{width:48px;height:48px;font-size:26px}
  .admin-actions > button{flex:1 1 100%}
}


/* ============ Model groups + variant sheet ============ */
.group-variants-chip{
  display:inline-flex;align-items:center;gap:4px;
  height:18px;padding:0 7px;border-radius:99px;
  background:var(--panel-3);border:1px solid var(--line);
  color:var(--muted);font-size:10.5px;font-weight:600;
  cursor:pointer;vertical-align:middle;
}
.group-variants-chip:hover{color:var(--text);border-color:var(--line-strong)}
.group-variants-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.group-variants-chip.is-cooling .dot{background:var(--warn,#f0b378)}
.group-variants-chip.is-failing .dot{background:var(--danger)}

.variant-sheet-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.variant-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  cursor:pointer;text-align:left;width:100%;font:inherit;color:var(--text);
}
.variant-row:hover{background:var(--panel-3);border-color:var(--line-strong)}
.variant-row.is-active{border-color:rgba(61,125,255,.5);background:var(--accent-soft)}
.variant-row-main{flex:1;min-width:0}
.variant-row-main b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.variant-row-main small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.variant-badge{
  display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:4px;
  background:var(--panel-3);border:1px solid var(--line);color:var(--dim);
  font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-right:4px;
}
.variant-badge.primary{color:var(--accent);border-color:rgba(61,125,255,.35)}
.variant-badge.ok{color:var(--ok);border-color:rgba(86,211,100,.3)}
.variant-badge.failing{color:var(--danger);border-color:rgba(242,97,97,.3)}
.variant-badge.cooling{color:#f0b378;border-color:rgba(240,179,120,.35)}

.mg-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.mg-toolbar input{flex:1 1 180px;min-width:0;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);outline:0}
.mg-list{display:flex;flex-direction:column;gap:8px}
.mg-group{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);overflow:hidden}
.mg-head{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;
  background:transparent;border:0;color:var(--text);font:inherit;cursor:pointer;text-align:left;
}
.mg-head:hover{background:var(--panel-3)}
.mg-caret{flex:0 0 auto;transition:transform .15s;color:var(--dim)}
.mg-group.is-open .mg-caret{transform:rotate(90deg)}
.mg-head-main{flex:1;min-width:0}
.mg-head-main b{display:block;font-size:13.5px;font-weight:500}
.mg-head-main small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-head-meta{display:flex;flex-wrap:wrap;gap:4px;flex:0 0 auto}
.mg-variants{display:none;padding:0 10px 12px;flex-direction:column;gap:6px}
.mg-group.is-open .mg-variants{display:flex}
.mg-variant{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--panel-3);border:1px solid var(--line)}
.mg-variant-radio{
  width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);
  background:transparent;flex:0 0 auto;cursor:pointer;padding:0;
}
.mg-variant-radio.is-on{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--panel-3)}
.mg-variant-main{flex:1;min-width:0}
.mg-variant-main b{display:block;font-size:12px;font-weight:500;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-variant-main small{display:block;margin-top:3px}
.mg-variant-actions{display:flex;gap:4px;flex:0 0 auto}
.mg-variant-actions button{font-size:11px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.mg-variant-actions button:hover{color:var(--text);border-color:var(--line-strong)}
.mg-variant-actions button.danger{color:var(--danger);border-color:rgba(242,97,97,.3)}
@media(max-width:640px){
  .mg-head{flex-wrap:wrap}
  .mg-head-meta{width:100%}
  .mg-variant{flex-wrap:wrap}
  .mg-variant-actions{width:100%;margin-top:6px}
  .mg-variant-actions button{flex:1}
}


/* Auto-decorated text in responses */
.md .auto-link{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px dashed rgba(61,125,255,.35);
  padding-bottom:1px;
  word-break:break-all;
  transition:border-color var(--t-base),color var(--t-base);
}
.md .auto-link:hover{border-bottom-style:solid;border-bottom-color:var(--accent);color:#7aa9ff}
:root[data-theme="light"] .md .auto-link{color:#2563eb}

.md .cmd-token{
  display:inline-block;
  padding:1px 6px;
  border-radius:5px;
  background:var(--panel-3);
  border:1px solid var(--line);
  font-family:var(--mono);
  font-size:.88em;
  color:var(--text);
}

.md .http-method{
  display:inline-block;
  padding:1px 6px;
  border-radius:5px;
  font-family:var(--mono);
  font-size:.82em;
  font-weight:700;
  letter-spacing:.03em;
  background:rgba(61,125,255,.14);
  color:#7aa9ff;

}
:root[data-theme="light"] .md .http-method{color:#2563eb;background:rgba(37,99,235,.1)}

.md .file-path{
  display:inline-block;

/* ============ Composer attachment chips ============ */
.attachment-strip{display:flex;gap:8px;flex-wrap:wrap;padding:4px 2px 0}
.attach-chip{
  position:relative;
  display:flex;align-items:center;gap:8px;
  max-width:min(240px,60vw);
  padding:6px 30px 6px 6px;
  background:var(--panel-3);
  border:1px solid var(--line);
  border-radius:12px;
  transition:border-color var(--t-base),background-color var(--t-base);
}
.attach-chip:hover{border-color:var(--line-strong);background:var(--raised)}
.attach-thumb{
  width:34px;height:34px;flex:0 0 auto;
  border-radius:8px;
  overflow:hidden;
  background:var(--panel);
  display:grid;place-items:center;
}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-thumb-icon{font-size:18px;line-height:1}
.attach-meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.attach-name{
  font-size:12px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:140px;
}
.attach-sub{font-size:10.5px;color:var(--dim)}
.attach-remove{
  position:absolute;top:2px;right:2px;
  width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);
  color:var(--muted);font-size:14px;line-height:1;
  cursor:pointer;
  transition:background-color var(--t-base),color var(--t-base),border-color var(--t-base);
}
.attach-remove:hover{color:var(--danger);border-color:rgba(242,97,97,.4);background:rgba(242,97,97,.1)}
@media (max-width:520px){
  .attach-chip{max-width:100%}
  .attach-name{max-width:110px}
}

.msg-action.is-copied{color:var(--ok)}

/* ============ Thinking indicator (modern) ============ */
.thinking-row{
  display:flex;align-items:center;gap:10px;
  color:var(--muted);font-size:13.5px;
  padding:4px 0;
  user-select:none;
}
.thinking-orb{
  position:relative;
  width:18px;height:18px;
  flex:0 0 auto;
  display:grid;place-items:center;
}
.thinking-orb::before,
.thinking-orb::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #c4b5fd, #7c3aed 70%, transparent 75%);
  opacity:.75;
  animation:orbPulse 1.8s cubic-bezier(.5,0,.5,1) infinite;
}
.thinking-orb::after{
  inset:3px;
  background:radial-gradient(circle at 60% 40%, #e9d5ff, #a855f7 60%, transparent 75%);
  animation-delay:.9s;
  opacity:.55;
}
@keyframes orbPulse{
  0%,100%{transform:scale(.7);opacity:.35}
  50%{transform:scale(1.05);opacity:.95}
}
.thinking-shimmer{
  font-weight:500;
  background:linear-gradient(90deg,
    var(--muted) 0%,
    var(--muted) 35%,
    var(--text) 50%,
    var(--muted) 65%,
    var(--muted) 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  animation:shimmerText 2.4s linear infinite;
  letter-spacing:.01em;
}
@keyframes shimmerText{
  0%{background-position:180% 0}
  100%{background-position:-80% 0}
}
.thinking-trail{
  display:inline-flex;gap:4px;align-items:center;
  margin-left:2px;
}
.thinking-trail span{
  width:4px;height:4px;border-radius:50%;
  background:var(--muted);
  animation:trailFade 1.4s ease-in-out infinite;
}
.thinking-trail span:nth-child(2){animation-delay:.16s}
.thinking-trail span:nth-child(3){animation-delay:.32s}
@keyframes trailFade{
  0%,80%,100%{opacity:.15;transform:translateY(0)}
  40%{opacity:1;transform:translateY(-1.5px)}
}

.searching-indicator{
  display:flex;align-items:center;gap:8px;
  color:var(--muted);
  font-size:13px;
  padding:2px 0;
}
.searching-indicator .spin{
  display:inline-block;
  animation:think-spin 1.6s linear infinite;
  font-size:14px;
}
.searching-indicator .label{
  background:linear-gradient(90deg,
    var(--muted) 0%, var(--muted) 35%,
    var(--accent) 50%,
    var(--muted) 65%, var(--muted) 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  animation:shimmerText 2.6s linear infinite;
}

/* ============ Telegram admin ============ */
.tg-status{
  display:flex;align-items:center;gap:12px;
  padding:16px;margin-bottom:18px;
  border:1px solid var(--line);border-radius:12px;

.tg-status-dot{

.tg-status.is-on{border-color:rgba(86,211,100,.35);background:rgba(86,211,100,.06)}
.tg-status.is-on .tg-status-dot{background:var(--ok);box-shadow:0 0 0 4px rgba(86,211,100,.14)}
.tg-status.is-off{border-color:rgba(242,97,97,.25)}
.tg-status.is-off .tg-status-dot{background:var(--danger);box-shadow:0 0 0 4px rgba(242,97,97,.14)}
.tg-status-main{flex:1;min-width:0}
.tg-status-main b{display:block;font-size:14px;font-weight:600}
.tg-status-main small{display:block;color:var(--dim);font-size:12px;margin-top:3px;font-family:var(--mono);overflow-wrap:anywhere}


/* ============================================================
   MOTION SYSTEM — iOS spring + subtle material
   ============================================================ */
:root{
  --spring: cubic-bezier(.32,.72,0,1);
  --spring-fast: cubic-bezier(.32,.72,0,1);
  --ease-material: cubic-bezier(.2,.6,.2,1);
  --t-spring: 420ms var(--spring);
  --t-spring-fast: 260ms var(--spring);
  --t-mobile: 280ms var(--spring);
}
@media (prefers-reduced-motion:reduce){
  :root{
    --t-spring: 1ms linear;
    --t-spring-fast: 1ms linear;
    --t-mobile: 1ms linear;
  }
}
.screen-page.open{ animation: pageIn 320ms var(--spring) }
@keyframes pageIn{
  from{ opacity: 0; transform: translateY(10px) scale(.995) }
  to{ opacity: 1; transform: none }
}
.msg{ animation: msgIn 260ms var(--spring) }
@keyframes msgIn{
  from{ opacity: 0; transform: translateY(6px) }
  to{ opacity: 1; transform: none }
}
.provider-row, .admin-card, .acct-hero, .apikeys-hero, .docs-hero,
.persona-card, .chat-item, .variant-row, .file-card, .tl-sources li,
.pm-row, .saved-prompt-row, .admin-status{
  transition: transform var(--t-spring-fast),
              background-color var(--t-base),
              border-color var(--t-base),
              box-shadow var(--t-spring-fast);
}
.provider-row:hover, .admin-card:hover, .persona-card:hover,
.chat-item:hover, .variant-row:hover, .file-card:hover{
  transform: translateY(-1px);
}
.admin-card{ border-radius: 14px; }
.acct-hero, .apikeys-hero, .docs-hero{ border-radius: 18px; }
.apikey-card, .provider-row, .variant-row{ border-radius: 14px; }
.dialog{ border-top-left-radius: 20px; border-bottom-left-radius: 20px; }
.screen-page-body{ padding-top: 18px; }
.qs-sheet{ transition: transform var(--t-mobile) }
.qs-backdrop{ transition: opacity var(--t-base) }
.chip-btn, .send, .head-action-btn, .qs-prov-tile, .avatar-opt, .swatch{
  transition: background-color var(--t-base),
              color var(--t-base),
              border-color var(--t-base),
              transform 140ms var(--spring-fast),
              box-shadow var(--t-base);
}
@media (max-width:900px){
  .sidebar{ transition: transform var(--t-mobile) }
}
.toast{ animation: toastIn 260ms var(--spring) }
@keyframes toastIn{
  from{ opacity: 0; transform: translateY(-6px) scale(.97) }
  to{ opacity: 1; transform: none }
}

/* HEAD ACTION — new chat button */
.head-action-btn{
  display:grid;place-items:center;
  width:36px;height:36px;flex:0 0 auto;
  border-radius:50%;
  background:var(--panel-3);
  border:1px solid var(--line);
  color:var(--muted);
  transition:background-color var(--t-base),
             color var(--t-base),
             border-color var(--t-base),
             transform 140ms var(--spring-fast);
}
.head-action-btn:hover{ background:var(--raised); color:var(--text); border-color:var(--line-strong) }
.head-action-btn:active{ transform: scale(.94) }
.head-action-btn svg{ width:16px; height:16px }

/* SIDEBAR ONLINE COUNTER */
.side-online{
  flex:0 0 auto;
  display:flex; align-items:center; gap:8px;
  padding:0 16px 10px;
  color:var(--muted); font-size:12px;
  font-variant-numeric:tabular-nums;
}
.side-online .online-dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 3px rgba(86,211,100,.18);
  flex:0 0 auto;
}
.side-online .online-label{ color:var(--dim); margin-left:2px }

/* ICONS */
.icon{
  display:inline-block;
  width:16px; height:16px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  vertical-align:middle;
  flex:0 0 auto;
}
.icon-sm{ width:14px; height:14px }
