    p.style.textAlign = "center";
    goBtn.parentNode.insertBefore(p, goBtn.nextSibling);
    return p;
  })();
  errBox.textContent = "";

  const validate = () => {
    const v = nameInput.value.trim();
    goBtn.disabled = v.length < 2;
    if (v.length >= 2) errBox.textContent = "";
  };
  nameInput.addEventListener("input", validate);
  setTimeout(() => nameInput.focus(), 80);

  goBtn.onclick = async () => {
    const username = nameInput.value.trim();
    if (username.length < 2) {
      errBox.textContent = "Username must be at least 2 characters.";
      return;
    }
    if (username.length > 40) {
      errBox.textContent = "Username must be 40 characters or less.";
      return;
    }
    goBtn.disabled = true;
    goBtn.textContent = "Creating…";
    errBox.textContent = "";

    try {
      const r = await apiFetch(WORKER_BASE + "/auth/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Could not create account");

      if (j.firstAccount) {

            <b>Administrator keys — save these securely.</b>
            <div style="margin-top:6px;color:var(--dim);font-size:12px">
              Username: <b style="color:var(--text)">${escapeHtml(j.username || username)}</b>
            </div>
            ${(j.keys || []).map(k => `

                <button class="btn-ghost copy-key" data-key="${escapeHtml(k)}" type="button">Copy</button>
              </div>`).join("")}
            <div style="margin-top:10px;color:var(--dim)">
              These three initial administrator keys will not be shown again by this screen.
            </div>
          </div>`;
        document.querySelectorAll(".copy-key").forEach(b => b.onclick = () => copyText(b.dataset.key));
      } else {
        const k = j.key;
        $("#generatedArea").innerHTML = `
          <div class="auth-note">
            <b>Your access key</b>
            <div style="margin-top:6px;color:var(--dim);font-size:12px">
              Username: <b style="color:var(--text)">${escapeHtml(j.username || username)}</b>
            </div>
            <div class="row" style="margin-top:8px">
              <input value="${escapeHtml(k)}" readonly style="flex:1;background:var(--panel-3);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px">
              <button class="btn-ghost" id="copyUserKey" type="button">Copy</button>
            </div>
            <div style="margin-top:10px;color:var(--dim)">Save this key. You need it to log in.</div>
          </div>`;
        $("#copyUserKey").onclick = () => copyText(k);
      }

      goBtn.textContent = "Account created";
      goBtn.disabled = true;
      nameInput.disabled = true;
    } catch (e) {
      errBox.textContent = e.message || "Could not create account";
      goBtn.disabled = false;
      goBtn.textContent = "Create account";
    }
  };
}

async function copyText(text){
  try{await navigator.clipboard.writeText(text)}
  catch{
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch{}ta.remove();
  }
  toast("Copied");
}

async function loadAdminAccounts(options={}){
  if(!isAuthenticated()||state.role!=="admin") throw new Error("Administrator access required");
  if(options.reset!==false) adminAccountsCursor=null;
  const params=new URLSearchParams();
  params.set("limit","100");
  if(adminAccountsCursor) params.set("cursor",adminAccountsCursor);
  if(adminAccountsSearch.trim()) params.set("search",adminAccountsSearch.trim());
  if(adminAccountsRole!=="all") params.set("role",adminAccountsRole);
  if(adminAccountsStatus!=="all") params.set("status",adminAccountsStatus);
  const r=await apiFetch(WORKER_BASE+"/admin/accounts?"+params.toString(),{headers:authHeaders(false)});
  let j={}; try{j=await r.json()}catch{}
  if(!r.ok||!j.ok) throw new Error(j.error?.message||j.error||"Could not load accounts");
  if(options.append) adminAccountsData=adminAccountsData.concat(j.accounts||[]);
  else adminAccountsData=j.accounts||[];
  adminAccountsSummary=j.summary||{};
  adminAccountsCursor=j.nextCursor||null;
  return j;
}

async function renderProviderIconsPage(){

  if (!state.models.length && isAuthenticated()) {

  }
  // Pull the current overrides from the backend.
  try {
    const r = await apiFetch(WORKER_BASE + "/admin/provider-icons", { headers: authHeaders(false) });
    if (r.ok) {
      const j = await r.json();
      adminIconOverrides = (j && j.icons) || {};
    }

  const providers = [...new Set(state.models.map(m => makerOf(m.id).key))].sort((a,b)=>providerLabel(a).localeCompare(providerLabel(b)));

      : `<span class="tile tile-lg" style="background:${tint};color:${color};border:1px solid ${border}">${safeLetter(k)}</span>`;
    return `
      <div class="provider-row" data-provider="${escapeHtml(k)}">
        ${preview}
        <div class="provider-row-main">
          <b>${escapeHtml(providerLabel(k))}</b>
          <small>${escapeHtml(k)}</small>

        ${status}
        <div class="provider-row-input">

    <div class="provider-grid">${rows}</div>
  `;

  c.querySelectorAll("[data-save-icon]").forEach(btn => btn.onclick = async () => {
    const provider = btn.dataset.saveIcon;
    const input = c.querySelector(`[data-provider-input="${CSS.escape(provider)}"]`);
    const url = (input?.value || "").trim();
    try {
      const r = await apiFetch(WORKER_BASE + "/admin/provider-icons", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ provider, url })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Save failed");
      adminIconOverrides = j.icons || {};
      // Invalidate the cache for this provider so the preview refreshes.
      iconCache.delete(provider);
      // Resolve fresh, then re-render.
      const slug = slugFor(provider);

let mhState = {
  disabledModels: [],
  disabledProviders: [],
  results: {},
  autoDisableThreshold: 3,
  filter: "all",
  running: false,
  stopped: false,
  progress: { done: 0, total: 0 },
  testScope: "all",
  selectedForTest: new Set()
};

/* Computes the list of model IDs to test based on the current scope. */
function computeTestTargets() {
  const all = mhAllModels.map(m => m.id);
  const STALE_MS = 24 * 60 * 60 * 1000;
  const now = Date.now();
  switch (mhState.testScope) {
    case "untested":
      return all.filter(id =>
        !mhState.results[id] && !mhState.disabledModels.includes(id)
      );
    case "failed":
      return all.filter(id => mhState.results[id]?.status === "failed");
    case "passed":
      return all.filter(id => mhState.results[id]?.status === "ok");
    case "stale":
      return all.filter(id => {
        const r = mhState.results[id];
        if (!r || !r.lastTested) return false;
        const t = Date.parse(r.lastTested);
        return Number.isFinite(t) && (now - t) > STALE_MS;
      });
    case "selected":
      return [...mhState.selectedForTest];
    case "all":
    default:
      return all;
  }
}

let tgState = { config: null, loading: false, botInfo: null };

async function renderTelegramPage(){
  const c = $("#adminContent");
  c.innerHTML = `<p class="admin-kicker">Loading…</p>`;

  try {
    const r = await apiFetch(WORKER_BASE + "/admin/telegram", { headers: authHeaders(false) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || "Could not load config");
    tgState.config = j.config;
  } catch (e) {
    c.innerHTML = `<p class="admin-kicker">Could not load: ${escapeHtml(e.message)}</p>`;
    return;
  }

  const cfg = tgState.config;

  c.innerHTML = `
    <p class="admin-kicker">Connect a Telegram bot so your account can chat with China-GPT models remotely. Files, photos, and search all work — the bot routes through the same upstream gateway as the web app.</p>

    <div class="tg-status ${cfg.enabled && cfg.hasToken ? "is-on" : "is-off"}">
      <span class="tg-status-dot"></span>
      <div class="tg-status-main">
        <b>${cfg.enabled && cfg.hasToken ? "Bot enabled" : "Bot disabled"}</b>
        <small>${cfg.hasToken ? "Token: " + escapeHtml(cfg.tokenMasked) : "No token configured"}</small>
      </div>
      ${tgState.botInfo ? `<span class="variant-badge ok">@${escapeHtml(tgState.botInfo.username)}</span>` : ``}
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h3>1. Bot token</h3><span>From @BotFather</span></div>
      <div class="admin-note" style="margin-bottom:12px">
        Talk to <b style="color:var(--text)">@BotFather</b> on Telegram → <code style="font-family:var(--mono)">/newbot</code> → copy the token.
      </div>
      <div class="field" style="max-width:520px">
        <label for="tgToken">Bot token</label>
        <input id="tgToken" placeholder="${cfg.hasToken ? "Leave blank to keep current" : "123456789:AAH…"}" autocomplete="off" spellcheck="false">
      </div>
      <div class="admin-actions" style="margin-top:8px">
        <button class="btn-ghost" id="tgVerify">Verify token</button>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h3>2. Public URL</h3><span>Webhook base</span></div>
      <div class="field" style="max-width:520px">
        <label for="tgUrl">Public URL (e.g. https://gpt-china.onrender.com)</label>
        <input id="tgUrl" value="${escapeHtml(cfg.publicUrl || "")}" placeholder="https://your-service.onrender.com" autocomplete="off">
        <div class="editor-hint">Webhook: <code style="font-family:var(--mono)">${escapeHtml((cfg.publicUrl||"…").replace(/\/+$/,""))}/telegram/webhook</code></div>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h3>3. Access control</h3><span>Who can talk to the bot</span></div>
      <div class="field" style="max-width:520px">
        <label for="tgUsers">Allowed Telegram user IDs (one per line)</label>
        <textarea id="tgUsers" class="editor-textarea" style="min-height:110px" placeholder="123456789" spellcheck="false">${escapeHtml((cfg.allowedUserIds||[]).join("\n"))}</textarea>
        <div class="editor-hint">Use <code style="font-family:var(--mono)">/me</code> in the bot to learn your ID.</div>
      </div>
      <div class="field" style="max-width:520px">
        <label for="tgAdmins">Admin user IDs (optional, one per line)</label>
        <textarea id="tgAdmins" class="editor-textarea" style="min-height:80px" placeholder="123456789" spellcheck="false">${escapeHtml((cfg.adminUserIds||[]).join("\n"))}</textarea>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h3>4. Behaviour</h3></div>
      <div class="field" style="max-width:520px">
        <label for="tgDefault">Default model ID</label>
        <input id="tgDefault" value="${escapeHtml(cfg.defaultModel||"")}" placeholder="openai/gpt-5" spellcheck="false">
      </div>
      <div class="field" style="max-width:520px">
        <label for="tgSysPrompt">System prompt (optional)</label>
        <textarea id="tgSysPrompt" class="editor-textarea" style="min-height:80px" placeholder="You are a helpful assistant." spellcheck="false">${escapeHtml(cfg.systemPrompt||"")}</textarea>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h3>5. Webhook</h3><span>Register with Telegram</span></div>
      <div class="admin-actions">
        <button class="btn-primary" id="tgSave">Save config</button>
        <button class="btn-ghost" id="tgSetWebhook">Register webhook</button>
        <button class="btn-ghost" id="tgDeleteWebhook">Remove webhook</button>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h3>Enable / disable</h3></div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)">
        <input type="checkbox" id="tgEnabled" ${cfg.enabled?"checked":""} style="all:revert;width:18px;height:18px">
        <span style="font-size:13.5px;font-weight:500">Bot is enabled</span>
      </label>
    </div>
  `;

  const $f = (id) => c.querySelector("#" + id);

  $f("tgVerify").onclick = async () => {
    const tok = $f("tgToken").value.trim();
    try {
      const save = await apiFetch(WORKER_BASE + "/admin/telegram", {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ botToken: tok || undefined })
      });
      if (!save.ok) throw new Error((await save.json().catch(()=>({}))).error || "Invalid token");
      const r = await apiFetch(WORKER_BASE + "/admin/telegram/get-me", { headers: authHeaders(false) });
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.error || "Could not verify");
      tgState.botInfo = j.bot;
      toast(`Verified: @${j.bot.username}`);
      renderTelegramPage();
    } catch (e) {
      toast(e.message || "Verification failed");
    }
  };

  $f("tgSave").onclick = async () => {
    const payload = {
      botToken: $f("tgToken").value.trim() || undefined,
      publicUrl: $f("tgUrl").value.trim(),
      defaultModel: $f("tgDefault").value.trim(),
      systemPrompt: $f("tgSysPrompt").value.trim(),
      enabled: $f("tgEnabled").checked,
      allowedUserIds: $f("tgUsers").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean),
      adminUserIds: $f("tgAdmins").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean)
    };
    try {
      const r = await apiFetch(WORKER_BASE + "/admin/telegram", {
        method: "POST", headers: authHeaders(), body: JSON.stringify(payload)
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Save failed");
      toast("Config saved");
      renderTelegramPage();
    } catch (e) {
      toast(e.message || "Could not save");
    }
  };

  $f("tgSetWebhook").onclick = async () => {
    await $f("tgSave").onclick();
    try {
      const r = await apiFetch(WORKER_BASE + "/admin/telegram/set-webhook", {
        method: "POST", headers: authHeaders()
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Set webhook failed");
      toast("Webhook registered");
    } catch (e) {
      toast(e.message || "Could not set webhook");
    }
  };

  $f("tgDeleteWebhook").onclick = async () => {
    if (!confirm("Remove the Telegram webhook? Messages will stop arriving.")) return;
    try {
      const r = await apiFetch(WORKER_BASE + "/admin/telegram/delete-webhook", {
        method: "POST", headers: authHeaders()
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Delete failed");
      toast("Webhook removed");
    } catch (e) {
      toast(e.message || "Could not remove");
    }
  };
}

async function renderModelGroupsPage(){
  const c = $("#adminContent");
  c.innerHTML = `<p class="admin-kicker">Loading model groups…</p>`;

  try {
    const r = await apiFetch(WORKER_BASE + "/admin/model-groups", { headers: authHeaders(false) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || "Could not load groups");
    mgState.groups = Array.isArray(j.groups) ? j.groups : [];
  } catch (e) {
    c.innerHTML = `<p class="admin-kicker">Could not load: ${escapeHtml(e.message || "unknown error")}</p>`;
    return;
  }

  renderModelGroupsList();
}

function renderModelGroupsList(){
  const c = $("#adminContent");
  const q = mgState.query.trim().toLowerCase();

  let rows = mgState.groups.filter(g => {
    if (mgState.onlyMulti && g.variantCount <= 1) return false;
    if (!q) return true;
    if (g.canonical.includes(q)) return true;
    return g.variants.some(v => v.id.toLowerCase().includes(q));
  });

  const totalMulti = mgState.groups.filter(g => g.variantCount > 1).length;
  const pinnedCount = mgState.groups.filter(g => g.pinned).length;

  c.innerHTML = `
    <p class="admin-kicker">Multiple routers expose the same underlying model. Grouping collapses them into one row in the picker and lets the app fail over automatically when a variant is down. Pin a variant to make it the default for a group.</p>

    <div class="mg-toolbar">
      <input id="mgSearch" placeholder="Search groups or variant IDs" value="${escapeHtml(mgState.query)}">
      <label class="chat-tool${mgState.onlyMulti ? " is-on" : ""}" id="mgOnlyMulti" style="cursor:pointer">
        <input type="checkbox" ${mgState.onlyMulti ? "checked" : ""} style="margin-right:6px;vertical-align:middle">
        Only multi-variant (${totalMulti})
      </label>
      <button class="btn-ghost" id="mgRefresh">Refresh</button>
    </div>

    <div class="admin-grid">
      ${adminStat("Total groups", mgState.groups.length, "In catalogue")}
      ${adminStat("Multi-variant", totalMulti, "Have failover siblings")}
      ${adminStat("Pinned", pinnedCount, "Manual primaries")}
      ${adminStat("Showing", rows.length, "Matching current filter")}
    </div>

    <div class="mg-list" id="mgList"></div>
  `;

  const search = c.querySelector("#mgSearch");
  search.addEventListener("input", () => { mgState.query = search.value; renderModelGroupsList(); });

  const multi = c.querySelector("#mgOnlyMulti");
  multi.addEventListener("click", (e) => {
    if (e.target.tagName !== "INPUT") {
      e.preventDefault();
      mgState.onlyMulti = !mgState.onlyMulti;
      renderModelGroupsList();
    } else {
      mgState.onlyMulti = e.target.checked;
    }
  });

  c.querySelector("#mgRefresh").onclick = () => {
    mgState.openCanonical = null;
    renderModelGroupsPage();
  };

  const list = c.querySelector("#mgList");
  if (!rows.length) {
    list.innerHTML = `<div class="admin-note">No groups match. Try relaxing the filter.</div>`;
    return;
  }

  list.innerHTML = rows.map(g => renderMgGroup(g)).join("");

  list.querySelectorAll(".mg-head").forEach(head => {
    head.onclick = () => {
      const canonical = head.dataset.canonical;
      const group = list.querySelector(`.mg-group[data-canonical="${CSS.escape(canonical)}"]`);
      const isOpen = group.classList.toggle("is-open");
      mgState.openCanonical = isOpen ? canonical : null;
    };
  });

  list.querySelectorAll("[data-pin-variant]").forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); pinVariant(btn.dataset.canonical, btn.dataset.pinVariant); };
  });

  list.querySelectorAll("[data-unpin]").forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); pinVariant(btn.dataset.unpin, ""); };
  });

  list.querySelectorAll("[data-clear-cd]").forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); clearCooldown(btn.dataset.clearCd); };
  });

  if (mgState.openCanonical) {
    const grp = list.querySelector(`.mg-group[data-canonical="${CSS.escape(mgState.openCanonical)}"]`);
    if (grp) grp.classList.add("is-open");
  }
}

function renderMgGroup(g){
  const pinned = g.pinned;
  const headMeta = [];
  headMeta.push(`<span class="variant-badge">${g.variantCount} variant${g.variantCount === 1 ? "" : "s"}</span>`);
  if (pinned) headMeta.push(`<span class="variant-badge primary">Pinned</span>`);
  if (g.hasFree) headMeta.push(`<span class="variant-badge">Has free</span>`);

  const variantRows = g.variants.map(v => {
    const badges = [];
    if (v.status === "ok") badges.push(`<span class="variant-badge ok">OK${v.latency ? " · " + v.latency + "ms" : ""}</span>`);
    if (v.status === "failed") badges.push(`<span class="variant-badge failing">Failing</span>`);
    if (v.status === "untested") badges.push(`<span class="variant-badge">Untested</span>`);
    if (v.cooling) badges.push(`<span class="variant-badge cooling">Cooling · ${escapeHtml(v.cooldownReason || "")}</span>`);
    if (pinned === v.id) badges.push(`<span class="variant-badge primary">Pinned</span>`);
    const isPinned = pinned === v.id;
    return `
      <div class="mg-variant" data-variant-id="${escapeHtml(v.id)}">
        <button type="button" class="mg-variant-radio${isPinned ? " is-on" : ""}"
                data-pin-variant="${escapeHtml(v.id)}" data-canonical="${escapeHtml(g.canonical)}"
                aria-label="${isPinned ? "Unpin" : "Pin as primary"}"></button>
        <span class="mg-variant-main">
          <b>${escapeHtml(v.id)}</b>
          <small>${badges.join("")}</small>
        </span>
        <span class="mg-variant-actions">
          ${isPinned ? `<button type="button" data-unpin="${escapeHtml(g.canonical)}">Unpin</button>` : ""}
          ${v.cooling ? `<button type="button" class="danger" data-clear-cd="${escapeHtml(v.id)}">Clear cooldown</button>` : ""}
        </span>
      </div>`;
  }).join("");

  return `
    <div class="mg-group" data-canonical="${escapeHtml(g.canonical)}">
      <button type="button" class="mg-head" data-canonical="${escapeHtml(g.canonical)}">
        <span class="mg-caret">▸</span>
        <span class="mg-head-main">
          <b>${escapeHtml(cleanModelName(g.primary))}</b>
          <small>${escapeHtml(g.canonical)} · ${escapeHtml(g.providers.join(", "))}</small>
        </span>
        <span class="mg-head-meta">${headMeta.join("")}</span>
      </button>
      <div class="mg-variants">${variantRows}</div>
    </div>
  `;
}

async function pinVariant(canonical, variant){
  const g = mgState.groups.find(x => x.canonical === canonical);
  const prev = g ? g.pinned : null;
  if (g) g.pinned = variant || null;

  try {
    const r = await apiFetch(WORKER_BASE + "/admin/model-groups/pin", {
      method: "POST", headers: authHeaders(),
      body: JSON.stringify({ canonical, variant })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || "Pin failed");
    toast(variant ? "Pinned " + variant : "Pin cleared");
    renderModelGroupsList();
  } catch (e) {
    if (g) g.pinned = prev;
    toast(e.message || "Could not save pin");
    renderModelGroupsList();
  }
}

async function clearCooldown(variant){
  try {
    const r = await apiFetch(WORKER_BASE + "/admin/model-groups/clear-cooldown", {
      method: "POST", headers: authHeaders(),
      body: JSON.stringify({ variant })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || "Failed");
    toast("Cooldown cleared");
    renderModelGroupsPage();
  } catch (e) {
    toast(e.message || "Could not clear cooldown");
  }
}

async function renderModelHealthPage(){
  const c = $("#adminContent");
  c.innerHTML = `<p class="admin-kicker">Loading…</p>`;

  try {
    const [stateRes, modelsRes] = await Promise.all([
      apiFetch(WORKER_BASE + "/admin/model-health", { headers: authHeaders(false) }),
      apiFetch(WORKER_BASE + "/admin/model-health/all-models", { headers: authHeaders(false) })
    ]);
    if (stateRes.ok) {
      const j = await stateRes.json();
      mhState.disabledModels = j.disabledModels || [];
      mhState.disabledProviders = j.disabledProviders || [];
      mhState.results = j.results || {};
      mhState.autoDisableThreshold = j.autoDisableThreshold || 3;
    }
    if (modelsRes.ok) {
      const j = await modelsRes.json();
      mhAllModels = j.data || [];
    }
  } catch (e) {
    c.innerHTML = `<p class="admin-kicker">Could not reach backend: ${escapeHtml(e.message)}</p>`;
    return;
  }

  renderModelHealthTable();
}

function renderModelHealthTable(){
  const c = $("#adminContent");
  const disabledSet = new Set(mhState.disabledModels);
  const disabledProvSet = new Set(mhState.disabledProviders);

  const byProvider = {};
  for (const m of mhAllModels) {
    const maker = makerOf(m.id);
    if (!byProvider[maker.key]) byProvider[maker.key] = { label: maker.label, models: [] };
    byProvider[maker.key].models.push(m);
  }

  const total = mhAllModels.length;
  const okCount = Object.values(mhState.results).filter(r => r.status === "ok").length;
  const failCount = Object.values(mhState.results).filter(r => r.status === "failed").length;
  const disabledCount = mhState.disabledModels.length;
  const untestedCount = total - okCount - failCount;

  const f = mhState.filter;
  const STALE_MS = 24 * 60 * 60 * 1000;
  const now = Date.now();
  const matchesFilter = (id) => {
    if (f === "all") return true;
    if (f === "failing") return mhState.results[id]?.status === "failed" && !disabledSet.has(id);
    if (f === "disabled") return disabledSet.has(id);
    if (f === "untested") return !mhState.results[id] && !disabledSet.has(id);
    if (f === "ok") return mhState.results[id]?.status === "ok";
    if (f === "stale") {
      const r = mhState.results[id];
      if (!r || !r.lastTested) return false;
      const t = Date.parse(r.lastTested);
      return Number.isFinite(t) && (now - t) > STALE_MS;
    }
    return true;
  };

  const progressPct = mhState.progress.total > 0
    ? Math.round((mhState.progress.done / mhState.progress.total) * 100)
    : 0;

  c.innerHTML = `
    <p class="admin-kicker">Test models directly against 9Router. Failures auto-disable after ${mhState.autoDisableThreshold} consecutive attempts. Disabled models are hidden from everyone, including API callers.</p>

    <div class="mh-summary">
      ${adminStat("Total", total, "In catalogue")}
      ${adminStat("Passing", okCount, "Last test OK")}
      ${adminStat("Failing", failCount, "Last test failed")}
      ${adminStat("Disabled", disabledCount, "Hidden from users")}
    </div>

    <div class="mh-toolbar">
      <div class="mh-test-scope">
        <select id="mhTestScope" ${mhState.running ? "disabled" : ""}>
          <option value="all" ${mhState.testScope === "all" ? "selected" : ""}>All models</option>
          <option value="untested" ${mhState.testScope === "untested" ? "selected" : ""}>Untested only</option>
          <option value="failed" ${mhState.testScope === "failed" ? "selected" : ""}>Failed only</option>
          <option value="passed" ${mhState.testScope === "passed" ? "selected" : ""}>Passed only</option>
          <option value="stale" ${mhState.testScope === "stale" ? "selected" : ""}>Stale only (24h+)</option>
          <option value="selected" ${mhState.testScope === "selected" ? "selected" : ""} ${mhState.selectedForTest.size === 0 ? "disabled" : ""}>
            Selected only (${mhState.selectedForTest.size})
          </option>
        </select>
        <button class="btn-primary" id="mhTestAll" ${mhState.running ? "disabled" : ""}>${mhState.running ? "Testing…" : "▶ Run tests"}</button>
      </div>
      ${mhState.running ? `<button class="btn-ghost" id="mhStop">Stop</button>` : ``}
      <button class="btn-ghost" id="mhRefresh">Refresh</button>
      <div class="mh-bulk-actions">
        <button class="btn-ghost mh-danger" id="mhDisableAllFailing" ${failCount === 0 || mhState.running ? "disabled" : ""}>⊘ Disable all failing (${failCount})</button>
        <button class="btn-ghost mh-accent" id="mhEnableAll" ${disabledCount === 0 ? "disabled" : ""}>✓ Enable all disabled (${disabledCount})</button>
      </div>
      <span class="spacer"></span>
      ${mhState.running ? `
        <span class="mh-progress">${mhState.progress.done} / ${mhState.progress.total}
          <span class="mh-progress-bar"><i style="width:${progressPct}%"></i></span>
        </span>` : ``}
      <span class="mh-progress">Untested: ${untestedCount}</span>
    </div>

    <div class="mh-filter-row">
      ${[["all","All"],["ok","Passing"],["failing","Failing"],["disabled","Disabled"],["untested","Untested"],["stale","Stale (24h+)"]].map(([id,label]) =>
        `<button type="button" class="mh-filter${mhState.filter === id ? " is-active" : ""}" data-mh-filter="${id}">${label}</button>`
      ).join("")}
    </div>

    ${Object.entries(byProvider).sort((a,b)=>a[1].label.localeCompare(b[1].label)).map(([key, data]) => {
      const models = data.models.filter(m => matchesFilter(m.id));
      if (!models.length) return "";
      const providerDisabled = disabledProvSet.has(key);
      return `
        <div class="mh-table" style="margin-bottom:14px">
          <div class="mh-provider-head">
            <span>${escapeHtml(data.label)} · ${models.length} model${models.length === 1 ? "" : "s"}</span>
            ${providerDisabled
              ? `<button type="button" data-mh-enable-provider="${escapeHtml(key)}">Enable whole provider</button>`
              : `<button type="button" data-mh-disable-provider="${escapeHtml(key)}">Disable whole provider (${data.models.length})</button>`}
          </div>
          ${models.map(m => renderMhRow(m, disabledSet, disabledProvSet)).join("")}
        </div>
      `;
    }).join("")}

    ${total === 0 ? `<div class="admin-note">No models returned from upstream.</div>` : ``}
  `;

  // Wire filter buttons
  c.querySelectorAll("[data-mh-filter]").forEach(b => b.onclick = () => {
    mhState.filter = b.dataset.mhFilter;
    renderModelHealthTable();
  });

  // ---- Test scope dropdown ----
  const scopeSel = c.querySelector("#mhTestScope");
  if (scopeSel) {
    scopeSel.onchange = () => {
      mhState.testScope = scopeSel.value;
      if (mhState.testScope === "selected" && mhState.selectedForTest.size === 0) {
        toast("Tick checkboxes on rows to select models first");
      }
      updateMhTestButtonLabel();
    };
  }

  // ---- Per-row checkboxes ----
  c.querySelectorAll("[data-mh-select]").forEach(cb => {
    cb.onchange = () => {
      const id = cb.dataset.mhSelect;
      if (cb.checked) mhState.selectedForTest.add(id);
      else mhState.selectedForTest.delete(id);

      const selOpt = c.querySelector('#mhTestScope option[value="selected"]');
      if (selOpt) {
        selOpt.disabled = mhState.selectedForTest.size === 0;
        selOpt.textContent = `Selected only (${mhState.selectedForTest.size})`;
      }

      updateMhTestButtonLabel();
    };
  });

  function updateMhTestButtonLabel() {
    const btn = c.querySelector("#mhTestAll");
    if (!btn || mhState.running) return;
    const n = computeTestTargets().length;
    const label = mhState.testScope === "all"
      ? `▶ Run tests (all ${n})`
      : `▶ Run tests (${n})`;
    btn.textContent = label;
    btn.disabled = n === 0;
  }
  updateMhTestButtonLabel();

  // Refresh
  const refBtn = c.querySelector("#mhRefresh");
  if (refBtn) refBtn.onclick = () => renderModelHealthPage();

  // Test all
  const testAllBtn = c.querySelector("#mhTestAll");
  if (testAllBtn) testAllBtn.onclick = () => startMhTestAll();

  // Disable all failing
  const disableAllBtn = c.querySelector("#mhDisableAllFailing");
  if (disableAllBtn) disableAllBtn.onclick = () => mhDisableAllFailing();

  // Enable all disabled
  const enableAllBtn = c.querySelector("#mhEnableAll");
  if (enableAllBtn) enableAllBtn.onclick = () => mhEnableAll();

  // Stop
  const stopBtn = c.querySelector("#mhStop");
  if (stopBtn) stopBtn.onclick = () => { mhState.stopped = true; toast("Stopping after current tests…") };

  // Per-row actions
  c.querySelectorAll("[data-mh-test]").forEach(b => b.onclick = () => mhTestOne(b.dataset.mhTest));
  c.querySelectorAll("[data-mh-disable]").forEach(b => b.onclick = () => mhDisableModel(b.dataset.mhDisable));
  c.querySelectorAll("[data-mh-enable]").forEach(b => b.onclick = () => mhEnableModel(b.dataset.mhEnable));

  // Provider actions
  c.querySelectorAll("[data-mh-disable-provider]").forEach(b => b.onclick = () => mhDisableProvider(b.dataset.mhDisableProvider));
  c.querySelectorAll("[data-mh-enable-provider]").forEach(b => b.onclick = () => mhEnableProvider(b.dataset.mhEnableProvider));
}

function renderMhRow(m, disabledSet, disabledProvSet) {
  const id = m.id;
  const maker = makerOf(id);
  const result = mhState.results[id];
  const isDisabled = disabledSet.has(id) || disabledProvSet.has(maker.key);
  const statusClass = isDisabled ? "status-disabled"
                    : result?.status === "ok" ? "status-ok"
                    : result?.status === "failed" ? "status-failed"
                    : "status-untested";
  const statusText = isDisabled ? "Disabled"
                    : result?.status === "ok" ? "OK"
                    : result?.status === "failed" ? "Failed"
                    : "Untested";
  const latency = result?.latency != null ? `${result.latency} ms` : "—";
  const lastTested = result?.lastTested
    ? new Date(result.lastTested).toLocaleTimeString()
    : "—";
  const failures = result?.consecutiveFailures || 0;
  const isSelected = mhState.selectedForTest.has(id);

  return `
    <div class="mh-row ${statusClass}${isDisabled ? " is-disabled" : ""}" data-mh-id="${escapeHtml(id)}">
      <label class="mh-select">
        <input type="checkbox"
               data-mh-select="${escapeHtml(id)}"
               ${isSelected ? "checked" : ""}
               aria-label="Select for testing">
      </label>
      <span class="mh-dot"></span>
      <span class="mh-row-main">
        <b>${escapeHtml(cleanModelName(id))}</b>
        <small>${escapeHtml(id)}</small>
        ${result?.errorMessage && !isDisabled ? `<small style="color:var(--danger);font-family:inherit;font-size:11px;margin-top:3px">${escapeHtml(result.errorMessage.slice(0, 140))}</small>` : ""}
      </span>
      <span class="mh-row-cell">${escapeHtml(statusText)}${failures > 0 && !isDisabled ? ` (${failures}/${mhState.autoDisableThreshold})` : ""}</span>
      <span class="mh-row-cell">${escapeHtml(latency)}</span>
      <span class="mh-row-cell">${escapeHtml(lastTested)}</span>
      <span class="mh-row-actions">
        <button class="primary" data-mh-test="${escapeHtml(id)}" ${mhState.running ? "disabled" : ""}>Test</button>
        ${isDisabled
          ? `<button data-mh-enable="${escapeHtml(id)}">Enable</button>`
          : `<button class="danger" data-mh-disable="${escapeHtml(id)}">Disable</button>`}
      </span>
    </div>
  `;
}

async function mhTestOne(modelId) {
  const row = document.querySelector(`.mh-row[data-mh-id="${CSS.escape(modelId)}"]`);
  const btn = row?.querySelector("[data-mh-test]");
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  try {
    const r = await apiFetch(WORKER_BASE + "/admin/model-health/test", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ modelId })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || "Test failed");
    mhState.results[modelId] = j.result;
    if (j.autoDisabled && !mhState.disabledModels.includes(modelId)) {
      mhState.disabledModels.push(modelId);
      toast(`${cleanModelName(modelId)} auto-disabled after ${mhState.autoDisableThreshold} failures`);
    }
    renderModelHealthTable();
  } catch (e) {
    toast(e.message || "Could not test model");
    if (btn) { btn.disabled = false; btn.textContent = "Test"; }
  }
}

async function startMhTestAll() {
  const ids = computeTestTargets();
  if (!ids.length) {
    toast("No models match the current scope");
    return;
  }
  mhState.running = true;
  mhState.stopped = false;
  mhState.progress = { done: 0, total: ids.length };
  renderModelHealthTable();

  const queue = [...ids];
  const CONCURRENCY = 4;
  const worker = async () => {
    while (queue.length > 0 && !mhState.stopped) {
      const id = queue.shift();
      if (!id) break;
      try {
        const r = await apiFetch(WORKER_BASE + "/admin/model-health/test", {
          method: "POST", headers: authHeaders(), body: JSON.stringify({ modelId: id })
        });
        if (r.ok) {
          const j = await r.json();
          mhState.results[id] = j.result;
          if (j.autoDisabled && !mhState.disabledModels.includes(id)) {
            mhState.disabledModels.push(id);
          }
        }
      } catch { /* skip */ }
      mhState.progress.done++;
      if (mhState.progress.done % 4 === 0) renderModelHealthTable();
    }
  };

  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, ids.length) }, worker));
  mhState.running = false;
  renderModelHealthTable();
  toast(mhState.stopped
    ? "Test run stopped"
    : `Tested ${mhState.progress.done} of ${ids.length} models`);
}

/* Bulk disable every model whose last test was "failed". Sends one
   request instead of N — the backend merges the list in a single
   KV write. */
async function mhDisableAllFailing() {
  const failing = mhAllModels
    .map(m => m.id)
    .filter(id => mhState.results[id]?.status === "failed" && !mhState.disabledModels.includes(id));

  if (!failing.length) {
    toast("No failing models to disable");
    return;
  }
  if (!confirm(`Disable ${failing.length} failing model${failing.length === 1 ? "" : "s"}? Users will stop seeing them.`)) return;

  try {
    const r = await apiFetch(WORKER_BASE + "/admin/model-health/disable-batch", {
      method: "POST", headers: authHeaders(),
      body: JSON.stringify({ modelIds: failing })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || "Bulk disable failed");
    mhState.disabledModels = j.disabledModels || [];
    renderModelHealthTable();
    toast(`Disabled ${j.added || failing.length} model${(j.added || failing.length) === 1 ? "" : "s"}`);
  } catch (e) {
    toast(e.message || "Could not disable");
  }
}

/* Clear the whole disabled list and reset failure counters. */
async function mhEnableAll() {
  const count = mhState.disabledModels.length;
  if (!count) { toast("Nothing to enable"); return; }
  if (!confirm(`Enable all ${count} disabled model${count === 1 ? "" : "s"}? They'll appear for users again on the next test.`)) return;

  try {
    const r = await apiFetch(WORKER_BASE + "/admin/model-health/enable-all", {
      method: "POST", headers: authHeaders()
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || "Bulk enable failed");
    mhState.disabledModels = [];
    // Clear consecutive failures so nothing auto-trips right away
    for (const id of Object.keys(mhState.results || {})) {
      if (mhState.results[id]) mhState.results[id].consecutiveFailures = 0;
    }
    renderModelHealthTable();
    toast(`Enabled ${count} model${count === 1 ? "" : "s"}`);
  } catch (e) {
    toast(e.message || "Could not enable");
  }
}

  $f("pfSave").onclick = async () => {

      apiKey: $f("pfApiKey").value.trim(),

      },
      models: {
        chat: $f("pfChat").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean),

      },
      enabled: $f("pfEnabled").checked
    };
    try {
      const r = await apiFetch(WORKER_BASE + "/admin/providers/upsert", {

function saveModelPrefs(){
  localStorage.setItem("chinaGPTFavoriteModels",JSON.stringify(state.favorites));
  localStorage.setItem("chinaGPTRecentModels",JSON.stringify(state.recentModels.slice(0,20)));
}
function isFavorite(id){return state.favorites.includes(id)}
function toggleFavorite(id){
  state.favorites=isFavorite(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];
  saveModelPrefs();renderCatalog();
}
function markModelUsed(id){state.recentModels=[id,...state.recentModels.filter(x=>x!==id)].slice(0,20);saveModelPrefs()}

function groupForModelId(id){
  if (!id || !Array.isArray(state.modelGroups)) return null;
  return state.modelGroups.find(g => g.variants.some(v => v.id === id)) || null;
}
function groupDisplayName(g){
  if (!g) return "";
  const primary = g.primary || (g.variants[0] && g.variants[0].id);
  return cleanModelName(primary || g.canonical);
}
function groupCoolingState(g){
  // frontend doesn't have live cooldowns unless admin loaded them; neutral default
  return "";
}
function renderCaps(caps, cls, max){
  const vis = (caps || []).slice(0, max || 3);
  let html = vis.map(x => `<span class="${cls}">${escapeHtml(x)}</span>`).join("");
  if ((caps || []).length > (max || 3)) html += `<span class="${cls}">…</span>`;
  return html;
}
function openVariantSheet(group){
  if (!group) return;
  pushPage(groupDisplayName(group), (body) => {
    body.innerHTML = `
      <p class="admin-kicker" style="margin-bottom:10px">${escapeHtml(group.canonical)} · ${group.variants.length} variant${group.variants.length===1?"":"s"}</p>
      <div class="variant-sheet-list">
        ${applyFreeFilter(group.variants.map(v => typeof v === "string" ? { id: v } : v)).map(v => {
          const id = typeof v === "string" ? v : v.id;
          const isActive = id === state.model;
          const isPrimary = id === group.primary;
          return `<button type="button" class="variant-row${isActive?" is-active":""}" data-pick-variant="${escapeHtml(id)}">
            <span class="variant-row-main">
              <b>${escapeHtml(id)}</b>
              <small>${isPrimary ? '<span class="variant-badge primary">Primary</span>' : ""}${isActive ? '<span class="variant-badge ok">Active</span>' : ""}</small>
            </span>
          </button>`;
        }).join("")}
      </div>
    `;
    body.querySelectorAll("[data-pick-variant]").forEach(b => {
      b.onclick = () => {
        selectModel(b.dataset.pickVariant);
        popPage();
      };
    });
  });
}

function modelCaps(m){
  const caps=[];
  const c=m.capabilities||{};
  if(c.vision) caps.push("Vision");
  if(c.tools) caps.push("Tools");
  if(c.reasoning) caps.push("Reasoning");
  if(c.audioInput) caps.push("Audio");
  const ctx = Number(c.contextWindow || m.contextWindow || m.context_length || 0);
  if (ctx >= 200000) caps.push("Long ctx");
  if(!caps.length){
    const text=JSON.stringify(m).toLowerCase();
    if(/vision|image|multimodal/.test(text))caps.push("Vision");
    if(/tool|function/.test(text))caps.push("Tools");
    if(/reason/.test(text))caps.push("Reasoning");
  }
  return caps;
}
function capsHtml(m, cls){
  const all = modelCaps(m);
  const vis = all.slice(0, 3);
  let html = vis.map(x=>`<span class="${cls}">${escapeHtml(x)}</span>`).join("");
  if (all.length > 3) html += `<span class="${cls}">…</span>`;
  return html;
}
function modelSortKey(m,mode){
  const maker=makerOf(m.id);
  return mode==="provider"
    ? (maker.label+" "+cleanModelName(m.id)).toLowerCase()
    : cleanModelName(m.id).toLowerCase();
}
function selectModel(id){
  if(!isAuthenticated()){openLogin("model");return}
  state.model=id;localStorage.setItem("chinaGPTModel",id);
  markModelUsed(id);persistCurrentConversation();updateBadge();closeModelsPage();
}
function fmtContext(n){
  if(!n) return "—";
  if(n>=1000000) return (n/1000000).toFixed(n%1000000===0?0:2)+"M";
  if(n>=1000) return Math.round(n/1000)+"K";
  return String(n);
}
function fmtPrice(p){
  if(p===undefined||p===null||p==="") return "—";
  const n=Number(p); if(Number.isNaN(n)) return "—";
  if(n===0) return "Free";
  if(n<0.01) return "$"+n.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");
  return "$"+n.toFixed(2);
}
let catalogFilter="all", catalogQuery="", catalogSort="name";
function buildFilters(){
  const base = applyFreeFilter(state.models);
  const makers = [...new Set(base.map(m => makerOf(m.id).key))]
    .sort((a, b) => providerLabel(a).localeCompare(providerLabel(b)));

  if (catalogFilter !== "all" && !makers.includes(catalogFilter)) {
    catalogFilter = "all";
  }

  const box = $("#modelFilters");
  box.innerHTML =
    `<button type="button" class="filter${catalogFilter === "all" ? " is-active" : ""}" data-filter="all">All providers</button>` +
    makers.map(k =>
      `<button type="button" class="filter${catalogFilter === k ? " is-active" : ""}" data-filter="${escapeHtml(k)}">${renderTile(k, "tile-xs")}${escapeHtml(providerLabel(k))}</button>`
    ).join("");
  box.querySelectorAll(".filter").forEach(b => b.onclick = () => {
    catalogFilter = b.dataset.filter; buildFilters(); renderCatalog();
  });

  const fav = $("#favoritesOnlyBtn");
  if (fav) {
    fav.classList.toggle("is-on", state.favoritesOnly);
    fav.textContent = state.favoritesOnly ? "★ Favorites" : "☆ Favorites";
  }
  const recent = $("#recentOnlyBtn");
  if (recent) recent.classList.toggle("is-on", state.recentOnly);
  const sort = $("#modelSort");
  if (sort) sort.value = catalogSort;
}



async function loadCategorizedModels(){

    if(!r.ok) return;
    const j = await r.json();
    state.modelsByCategory = {
      chat: Array.isArray(j.chat) ? j.chat : [],
      image: Array.isArray(j.image) ? j.image : [],
      video: Array.isArray(j.video) ? j.video : [],
      audio: Array.isArray(j.audio) ? j.audio : []
    };
    updateCatalogTabCounts();
  }catch{}
}
function updateCatalogTabCounts(){
  document.querySelectorAll("#catalogTabs [data-count]").forEach(el=>{
    const k = el.dataset.count;
    el.textContent = String((state.modelsByCategory[k] || []).length);
  });
}

function renderCategoryList(category){
  const list = applyFreeFilter(state.modelsByCategory[category] || []);
  const box = $("#modelResults");
  if(!list.length){
    box.innerHTML = `<div class="side-empty" style="padding:20px">No ${category} models configured. An admin can add them under Providers.</div>`;
    $("#catalogCount").textContent = `0 ${category} models`;
    return;
  }
  $("#catalogCount").textContent = `${list.length} ${category} model${list.length === 1 ? "" : "s"}`;
  box.innerHTML = list.map(m => {
    const isCustom = m.source === "custom";
    const providerLabel = isCustom ? (m.providerLabel || m.provider) : "9Router";
    const makerKey = isCustom ? m.provider : makerOf(m.id).key;
    const isActive = m.id === state.model;
    return `<div class="model-row${isActive ? " is-active" : ""}">
      <button type="button" class="model-main" data-model="${escapeHtml(m.id)}">
        <span class="model-id">
          ${renderTile(makerKey)}
          <span class="model-id-text">
            <b>${escapeHtml(cleanModelName(m.id))}</b>
            <span class="model-meta">
              <small>${escapeHtml(providerLabel)}</small>
              ${isCustom ? `<span class="cap-badge">Custom</span>` : ""}
            </span>
          </span>
        </span>
        <span class="model-cell">—</span>
        <span class="model-cell price">—</span>
        <span class="model-cell price">—</span>
      </button>
      <button type="button" class="model-copy-id" data-copy-id="${escapeHtml(m.id)}" aria-label="Copy model ID">${COPY_ICON}</button>
      <span></span>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-model]").forEach(b => b.onclick = () => selectModel(b.dataset.model));
  box.querySelectorAll("[data-copy-id]").forEach(b => b.onclick = e => {
    e.stopPropagation(); copyText(b.dataset.copyId); flashCopyIcon(b);
  });
}

function renderCatalog(){
  const q = catalogQuery.trim().toLowerCase();
  const usingGroups = Array.isArray(state.modelGroups) && state.modelGroups.length > 0;

  if (usingGroups) {
    const rows = state.modelGroups.filter(g => {
      // free filter: keep group if any variant is free when freeOnly
      if (state.freeOnly) {
        const anyFree = g.variants.some(v => isFreeModel(typeof v === "string" ? { id: v } : v) || isFreeModel({ id: v.id || v, pricing: (state.models.find(m => m.id === (v.id || v)) || {}).pricing }));
        if (!anyFree) return false;
      }

      const maker = makerOf(g.primary);
      if (catalogFilter !== "all" && maker.key !== catalogFilter) return false;
      if (state.favoritesOnly && !g.variants.some(v => isFavorite(v.id || v))) return false;
      if (state.recentOnly && !g.variants.some(v => state.recentModels.includes(v.id || v))) return false;
      if (q) {
        const hit = g.variants.some(v => {
          const id = v.id || v;
          return String(id).toLowerCase().includes(q) || cleanModelName(id).toLowerCase().includes(q);
        }) || g.canonical.includes(q) || maker.label.toLowerCase().includes(q);
        if (!hit) return false;
      }
      return true;
    });

    rows.sort((a, b) => {
      if (catalogSort === "provider") {
        return (makerOf(a.primary).label + " " + groupDisplayName(a)).toLowerCase()
          .localeCompare((makerOf(b.primary).label + " " + groupDisplayName(b)).toLowerCase());
      }
      return groupDisplayName(a).toLowerCase().localeCompare(groupDisplayName(b).toLowerCase());
    });

    $("#catalogCount").textContent =
      `${rows.length} model${rows.length === 1 ? "" : "s"} · ${state.models.length} variants`;

    const box = $("#modelResults");
    box.innerHTML = rows.length ? rows.map(g => {
      const primary = state.models.find(m => m.id === g.primary);
      const maker = makerOf(g.primary);
      const ctx = primary ? fmtContext(primary.context_length || primary.contextWindow) : "—";
      const pin = primary ? fmtPrice(primary.pricing?.prompt ?? primary.pricing?.input) : "—";
      const pout = primary ? fmtPrice(primary.pricing?.completion ?? primary.pricing?.output) : "—";
      const isActive = g.variants.some(v => (v.id || v) === state.model);
      const multi = g.variants.length > 1;
      const isFav = g.variants.some(v => isFavorite(v.id || v));
      const c = providerColor(maker.key);
      const lastCell = isActive ? '<span class="selected-flag">✓ Selected</span>' : pout;
      const lastLabel = isActive ? "Status" : "Output / 1M";
      const pinnedBadge = g.pinned ? ' <span class="variant-badge primary">PIN</span>' : "";

      return `<div class="model-row${isActive ? " is-active" : ""}">
        <button type="button" class="model-main" data-group-primary="${escapeHtml(g.primary)}">
          <span class="model-id">
            ${renderTile(maker.key)}
            <span class="model-id-text">
              <b>${escapeHtml(groupDisplayName(g))}${pinnedBadge}</b>
              <span class="model-meta">
                <small style="color:${c}">${escapeHtml(maker.label)}</small>
                ${primary ? capsHtml(primary, "cap-badge") : ""}
                ${multi ? `<span role="button" class="group-variants-chip" data-open-variants="${escapeHtml(g.canonical)}" title="${g.variants.length} variants">+${g.variants.length - 1}</span>` : ""}
              </span>
            </span>
          </span>
          <span class="model-cell" data-label="Context">${ctx}</span>
          <span class="model-cell price" data-label="Input / 1M">${pin}</span>
          <span class="model-cell price" data-label="${lastLabel}">${lastCell}</span>
        </button>
        <button type="button" class="model-copy-id" data-copy-id="${escapeHtml(g.primary)}" aria-label="Copy model ID">${COPY_ICON}</button>
        <button type="button" class="model-fav${isFav ? " is-on" : ""}" data-fav-group="${escapeHtml(g.canonical)}" aria-label="Favorite">${isFav ? "★" : "☆"}</button>
      </div>`;
    }).join("") : `<div class="side-empty" style="padding:20px">No models match the selected filters.</div>`;

    box.querySelectorAll("[data-group-primary]").forEach(b => b.onclick = e => {
      if (e.target.closest("[data-open-variants]")) return;
      selectModel(b.dataset.groupPrimary);
    });
    box.querySelectorAll("[data-open-variants]").forEach(chip => {
      chip.onclick = e => {
        e.stopPropagation();
        const g = state.modelGroups.find(x => x.canonical === chip.dataset.openVariants);
        if (g) openVariantSheet(g);
      };
    });
    box.querySelectorAll("[data-copy-id]").forEach(b => b.onclick = e => {
      e.stopPropagation(); copyText(b.dataset.copyId); flashCopyIcon(b);
    });
    box.querySelectorAll("[data-fav-group]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const g = state.modelGroups.find(x => x.canonical === b.dataset.favGroup);
      if (!g) return;
      const allFav = g.variants.every(v => isFavorite(v.id || v));
      for (const v of g.variants) {
        const id = v.id || v;
        if (allFav) state.favorites = state.favorites.filter(x => x !== id);
        else if (!isFavorite(id)) state.favorites = [...state.favorites, id];
      }
      saveModelPrefs(); renderCatalog();
    });
    return;
  }

  // ---- Flat fallback (unchanged behaviour) ----
  let rows=applyFreeFilter(state.models).filter(m=>{
    const maker=makerOf(m.id);
    if(catalogFilter!=="all"&&maker.key!==catalogFilter)return false;
    if(state.favoritesOnly&&!isFavorite(m.id))return false;
    if(state.recentOnly&&!state.recentModels.includes(m.id))return false;
    if(q&&!m.id.toLowerCase().includes(q)&&!cleanModelName(m.id).toLowerCase().includes(q)&&!maker.label.toLowerCase().includes(q))return false;
    return true;
  });
  rows.sort((a,b)=>modelSortKey(a,catalogSort).localeCompare(modelSortKey(b,catalogSort)));
  $("#catalogCount").textContent=`${rows.length} model${rows.length===1?"":"s"} in the catalog`;
  const box=$("#modelResults");
  box.innerHTML=rows.length?rows.map(m=>{
    const maker=makerOf(m.id),isActive=m.id===state.model;
    const ctx=fmtContext(m.context_length||m.contextWindow);
    const pin=fmtPrice(m.pricing?.prompt??m.pricing?.input);
    const pout=fmtPrice(m.pricing?.completion??m.pricing?.output);
    const lastCell=isActive?'<span class="selected-flag">✓ Selected</span>':pout;
    const lastLabel=isActive?"Status":"Output / 1M";
    const c=providerColor(maker.key);
    return `<div class="model-row${isActive?" is-active":""}">
      <button type="button" class="model-main" data-model="${escapeHtml(m.id)}">
        <span class="model-id">
          ${renderTile(maker.key)}
          <span class="model-id-text">
            <b>${escapeHtml(cleanModelName(m.id))}</b>
            <span class="model-meta">
              <small style="color:${c}">${escapeHtml(maker.label)}</small>
              ${capsHtml(m, "cap-badge")}
            </span>
          </span>
        </span>
        <span class="model-cell" data-label="Context">${ctx}</span>
        <span class="model-cell price" data-label="Input / 1M">${pin}</span>
        <span class="model-cell price" data-label="${lastLabel}">${lastCell}</span>
      </button>
      <button type="button" class="model-copy-id" data-copy-id="${escapeHtml(m.id)}" aria-label="Copy model ID" title="Copy model ID">${COPY_ICON}</button>
      <button type="button" class="model-fav${isFavorite(m.id)?" is-on":""}" data-fav-model="${escapeHtml(m.id)}" aria-label="Favorite model" title="Favorite">${isFavorite(m.id)?"★":"☆"}</button>
    </div>`;
  }).join(""):`<div class="side-empty" style="padding:20px">No models match the selected filters.</div>`;
  box.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>selectModel(b.dataset.model));
  box.querySelectorAll("[data-copy-id]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    copyText(b.dataset.copyId);

function renderQuickSwitch(){
  const sheet=$("#qsSheet");if(!sheet)return;
  const makers=[...new Set(state.models.map(m=>makerOf(m.id).key))].sort((a,b)=>providerLabel(a).localeCompare(providerLabel(b)));
  const provRow=sheet.querySelector("#qsProviders");
  const titleText=sheet.querySelector("#qsSheetTitleText");
  const titleDot=sheet.querySelector("#qsSheetTitle .dot");
  if(!provRow||!titleText)return;

  if(quickSwitchMaker==="all"){
    titleText.textContent="All providers";
    if(titleDot)titleDot.style.background="var(--accent)";
  }else{
    titleText.textContent=providerLabel(quickSwitchMaker);
    if(titleDot)titleDot.style.background=providerColor(quickSwitchMaker);
  }

  provRow.innerHTML=`<button type="button" class="qs-prov-tile${quickSwitchMaker==="all"?" is-active":""}" data-qs-maker="all" title="All providers" ${quickSwitchMaker==="all"?'style="background:var(--accent);color:#fff;border-color:transparent"':''}>All</button>`+
    makers.map(k=>{
      const c=providerColor(k);
      const active=quickSwitchMaker===k;
      const st=active
        ? `background:${c};color:#fff;border-color:transparent`
        : `background:${hexToRgba(c,.14)};color:${c};border-color:${hexToRgba(c,.3)}`;
      const url=providerIconUrl(k);
      const letter=safeLetter(k);
      const inner = url
        ? `<span class="tile-icon" style="--icon-url:url('${url}')"></span>`
        : letter;
      return `<button type="button" class="qs-prov-tile${active?" is-active":""}" data-qs-maker="${escapeHtml(k)}" title="${escapeHtml(providerLabel(k))}" style="${st}">${inner}</button>`;
    }).join("");
  provRow.querySelectorAll("[data-qs-maker]").forEach(b=>b.onclick=()=>{quickSwitchMaker=b.dataset.qsMaker;renderQuickSwitch()});
  renderQuickSwitchList();
}
function renderQuickSwitchList(){
  const sheet=$("#qsSheet");if(!sheet)return;
  const list=sheet.querySelector("#qsList");if(!list)return;
  const q=(quickSwitchQuery||"").trim().toLowerCase();
  const usingGroups = Array.isArray(state.modelGroups) && state.modelGroups.length > 0;
  let rows;
  if (usingGroups) {
    rows = state.modelGroups
      .map(g => state.models.find(m => m.id === g.primary) || { id: g.primary })
      .filter(m => {
        const maker = makerOf(m.id);
        if (quickSwitchMaker !== "all" && maker.key !== quickSwitchMaker) return false;
        if (q) {
          const g = groupForModelId(m.id);
          if (g) {
            const hit = g.variants.some(v => {
              const id = v.id || v;
              return String(id).toLowerCase().includes(q) || cleanModelName(id).toLowerCase().includes(q);
            }) || g.canonical.includes(q);
            if (!hit) return false;
          } else if (!m.id.toLowerCase().includes(q) && !cleanModelName(m.id).toLowerCase().includes(q)) return false;
        }
        return true;
      })
      .sort((a,b)=>cleanModelName(a.id).localeCompare(cleanModelName(b.id)));
  } else {
    rows=state.models.filter(m=>{
      const maker=makerOf(m.id);
      if(quickSwitchMaker!=="all" && maker.key!==quickSwitchMaker) return false;
      if(q && !m.id.toLowerCase().includes(q) && !cleanModelName(m.id).toLowerCase().includes(q) && !maker.label.toLowerCase().includes(q)) return false;
      return true;
    });
    rows.sort((a,b)=>cleanModelName(a.id).localeCompare(cleanModelName(b.id)));
  }
  
  rows = applyFreeFilter(Array.isArray(rows) ? rows.map(r => {
    if (!r) return null;
    if (r.id) return r;
    if (r.primary) { const m = state.models.find(x => x.id === r.primary); return m || { id: r.primary }; }
    return r;
  }).filter(Boolean) : []);
  list.innerHTML=rows.length?rows.map(m=>{
    const maker=makerOf(m.id),isActive=m.id===state.model;
    const ctx=fmtContext(m.context_length||m.contextWindow);
    const c=providerColor(maker.key);
    return `<div class="qs-row${isActive?" is-active":""}" data-qs-model="${escapeHtml(m.id)}" role="button" tabindex="0">
      ${renderTile(maker.key,"tile-sm")}
      <span class="qs-row-main">
        <b>${escapeHtml(cleanModelName(m.id))}</b>
        ${(() => { const h = capsHtml(m, "qs-cap"); return h ? `<span class="qs-row-caps">${h}</span>` : ""; })()}
        <small><span class="prov-dot" style="background:${c}"></span>${escapeHtml(maker.label)} · ${ctx} ctx</small>
        ${(() => {
          const g = groupForModelId(m.id);
          if (!g || g.variants.length <= 1) return "";
          return `<button type="button" class="group-variants-chip" data-qs-open="${escapeHtml(g.canonical)}" style="margin-top:4px">+${g.variants.length - 1}</button>`;
        })()}
      </span>
      <button type="button" class="qs-copy-id" data-copy-id="${escapeHtml(m.id)}" title="Copy model ID">${COPY_ICON}</button>
      <span class="qs-radio"></span>
    </div>`;
  }).join(""):`<div class="qs-empty">No models match.</div>`;
  list.querySelectorAll("[data-qs-open]").forEach(chip => {
    chip.onclick = (e) => {
      e.stopPropagation();
      const g = state.modelGroups.find(x => x.canonical === chip.dataset.qsOpen);
      if (!g) return;
      closeQuickModelSwitch();
      openVariantSheet(g);
    };
  });
  list.querySelectorAll("[data-qs-model]").forEach(b=>{
    b.onclick=(e)=>{
      if(e.target.closest("[data-copy-id]"))return;
      if(e.target.closest("[data-qs-open]"))return;
      selectModel(b.dataset.qsModel);
      closeQuickModelSwitch();
    };
    b.onkeydown=(e)=>{
      if(e.key==="Enter"||e.key===" "){
        if(e.target.closest("[data-copy-id]"))return;
        if(e.target.closest("[data-qs-open]"))return;
        e.preventDefault();
        selectModel(b.dataset.qsModel);
        closeQuickModelSwitch();
      }
    };
  });
  list.querySelectorAll("[data-copy-id]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    copyText(b.dataset.copyId);
    flashCopyIcon(b);
  });
}

/* ============================================================
   SITE LOCK — takeover screen + boot check
   ============================================================ */
let _lockCountdownTimer = null;

async function checkSiteLock(){
  try{
    const r = await apiFetch(WORKER_BASE + "/site-lock", { headers: authHeaders(false) });
    if(!r.ok) return false;
    const j = await r.json();
    if(!j.locked) return false;

    // Admin: let the app boot, but show the red banner.
    if(j.isAdmin){
      showAdminLockBanner(j);
      return false;
    }
    showLockTakeover(j);
    return true;
  }catch{
    // Network error on the check itself — fail open. The middleware
    // will still 423 any real API call if the site is actually locked.
    return false;
  }
}

function showLockTakeover(j){
  const existing = document.getElementById("lockTakeover");
  if(existing) existing.remove();

  const el = document.createElement("div");
  el.id = "lockTakeover";
  el.className = "lock-takeover";
  el.innerHTML = `
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2 class="lock-title">Site temporarily locked</h2>
      <p class="lock-message">${escapeHtml(j.message || "The site is locked for maintenance.")}</p>
      <div class="lock-timer" id="lockTimer"></div>
      <button class="auth-primary" id="lockRetry" type="button">Try again</button>
      <div class="lock-foot">Admins can sign in with their access key to bypass the lock.</div>
    </div>
  `;
  document.body.appendChild(el);
  document.body.classList.add("is-locked");

  document.getElementById("lockRetry").onclick = () => window.location.reload();

  const startMs = Date.now();
  const startedRemaining = j.remainingSeconds;
  const tick = () => {
    const elT = document.getElementById("lockTimer");
    if(!elT) return;
    if(j.remainingSeconds === null || j.remainingSeconds === undefined){
      elT.textContent = "Until further notice";
      return;
    }
    const elapsed = Math.floor((Date.now() - startMs) / 1000);
    const left = Math.max(0, startedRemaining - elapsed);
    if(left === 0){
      elT.textContent = "Unlocking…";
      clearInterval(_lockCountdownTimer);
      setTimeout(() => window.location.reload(), 1200);
      return;
    }
    elT.textContent = formatCountdown(left);
  };
  tick();
  _lockCountdownTimer = setInterval(tick, 1000);
}

function formatCountdown(totalSeconds){
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if(h > 0) return `${h}h ${m}m ${sec}s`;
  if(m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function showAdminLockBanner(j){
  if(document.getElementById("adminLockBanner")) return;
  const bar = document.createElement("div");
  bar.id = "adminLockBanner";
  bar.className = "admin-lock-banner";
  bar.innerHTML = `<span>🔒 Site is locked — users see the takeover.</span><button type="button" id="adminLockBannerGo">Manage</button>`;
  document.body.appendChild(bar);
  bar.querySelector("#adminLockBannerGo").onclick = () => {
    openAdmin();
    setTimeout(() => {
      const btn = document.querySelector('.admin-nav button[data-admin-section="site-lock"]');
      if(btn) btn.click();
    }, 60);
  };
}

async function refreshAdminLockBanner(){
  try{
    const r = await apiFetch(WORKER_BASE + "/site-lock", { headers: authHeaders(false) });
    const j = await r.json();
    const existing = document.getElementById("adminLockBanner");
    if(j.locked && state.role === "admin"){
      if(!existing) showAdminLockBanner(j);
    } else if(existing){
      existing.remove();
    }
  }catch{}
}

async function renderSiteLockAdminPage(){
  const c = $("#adminContent");
  c.innerHTML = `<p class="admin-kicker">Loading lock status…</p>`;

  let lock = null;
  try{
    const r = await apiFetch(WORKER_BASE + "/admin/site-lock", { headers: authHeaders(false) });
    if(r.ok){ const j = await r.json(); if(j.locked) lock = j; }
  }catch{}

  const paint = (lockData) => {
    if(lockData){
      const until = lockData.until
        ? new Date(lockData.until).toLocaleString()
        : "Indefinite";
      const remaining = lockData.remainingSeconds != null
        ? formatCountdown(lockData.remainingSeconds)
        : "—";
      c.innerHTML = `
        <p class="admin-kicker">Site Lock blocks every authenticated user except admins. Public routes (<code>/health</code>, <code>/auth/login</code>, <code>/site-lock</code>) stay open.</p>
        <div class="admin-section">
          <div class="admin-section-head"><h3>Status</h3><span>Locked</span></div>
          <div class="site-lock-status is-locked">
            <div class="site-lock-status-icon">🔒</div>
            <div class="site-lock-status-body">
              <b>Site is locked</b>
              <small>${escapeHtml(lockData.message || "")}</small>
              <div class="site-lock-meta">
                <span>Unlocks <b>${escapeHtml(until)}</b></span>
                <span>Remaining <b id="slaTimer">${escapeHtml(remaining)}</b></span>
              </div>
            </div>
          </div>
          <div class="admin-actions" style="margin-top:14px">
            <button class="btn-primary site-lock-unlock" id="slaUnlock" type="button">Unlock now</button>
            <button class="btn-ghost" id="slaRefresh" type="button">Refresh</button>
          </div>
        </div>
      `;
      const start = Date.now();
      const startRemaining = lockData.remainingSeconds;
      if(startRemaining != null){
        const tmr = setInterval(() => {
          const el = document.getElementById("slaTimer");
          if(!el){ clearInterval(tmr); return; }
          const elapsed = Math.floor((Date.now() - start)/1000);
          const left = Math.max(0, startRemaining - elapsed);
          if(left === 0){ clearInterval(tmr); el.textContent = "Unlocked"; return; }
          el.textContent = formatCountdown(left);
        }, 1000);
      }
      document.getElementById("slaUnlock").onclick = async () => {
        if(!confirm("Unlock the site now?")) return;
        try{
          const r = await apiFetch(WORKER_BASE + "/admin/site-lock/unlock", { method:"POST", headers:authHeaders() });
          const j = await r.json().catch(()=>({}));
          if(!r.ok || !j.ok) throw new Error(j.error?.message || "Unlock failed");
          toast("Site unlocked");
          refreshAdminLockBanner();
          renderSiteLockAdminPage();
        }catch(e){ toast(e.message || "Could not unlock"); }
      };
      document.getElementById("slaRefresh").onclick = () => renderSiteLockAdminPage();
    } else {
      c.innerHTML = `
        <p class="admin-kicker">Site Lock blocks every authenticated user except admins. Public routes (<code>/health</code>, <code>/auth/login</code>, <code>/site-lock</code>) stay open.</p>
        <div class="admin-section">
          <div class="admin-section-head"><h3>Status</h3><span>Unlocked</span></div>
          <div class="site-lock-status">
            <div class="site-lock-status-icon">🔓</div>
            <div class="site-lock-status-body">
              <b>Site is live</b>
              <small>Users can sign in and make requests.</small>
            </div>
          </div>
        </div>
        <div class="admin-section">
          <div class="admin-section-head"><h3>Lock the site</h3><span>Restricts access to admins only</span></div>
          <div class="field" style="max-width:400px">
            <label for="slaMinutes">Duration (minutes)</label>
            <input id="slaMinutes" type="number" min="1" max="10080" value="20">
            <div class="editor-hint">1 min – 7 days. Default 20 minutes.</div>
          </div>
          <div class="field" style="max-width:520px">
            <label for="slaMessage">Message shown to users (optional)</label>
            <input id="slaMessage" type="text" maxlength="200" placeholder="e.g. Deploying an update — back in 20 minutes.">
          </div>
          <div class="admin-actions">
            <button class="btn-primary site-lock-lock" id="slaLock" type="button">Lock for N minutes</button>
            <button class="btn-ghost site-lock-indefinite" id="slaLockIndef" type="button">Lock indefinitely</button>
          </div>
        </div>
      `;
      const doLock = async (indefinite) => {
        const minutes = Math.max(1, Math.min(10080, Number(document.getElementById("slaMinutes").value) || 20));
        const message = document.getElementById("slaMessage").value.trim();
        const confirmMsg = indefinite
          ? "Lock the site indefinitely? Non-admin users will be blocked until you unlock."
          : `Lock the site for ${minutes} minute${minutes===1?"":"s"}? Non-admin users will be blocked.`;
        if(!confirm(confirmMsg)) return;
        try{
          const r = await apiFetch(WORKER_BASE + "/admin/site-lock/lock", {
            method:"POST", headers:authHeaders(),
            body: JSON.stringify({ durationMinutes: minutes, message, indefinite })
          });
          const j = await r.json().catch(()=>({}));
          if(!r.ok || !j.ok) throw new Error(j.error?.message || "Lock failed");
          toast(indefinite ? "Site locked indefinitely" : `Site locked for ${minutes} min`);
          refreshAdminLockBanner();
          renderSiteLockAdminPage();
        }catch(e){ toast(e.message || "Could not lock"); }
      };
      document.getElementById("slaLock").onclick = () => doLock(false);
      document.getElementById("slaLockIndef").onclick = () => doLock(true);
    }
  };

  paint(lock);
  refreshAdminLockBanner();
}

    const t = e.touches[0];
    if (t.clientX < EDGE && !shell.classList.contains("nav-open")) {
      startX = t.clientX; startY = t.clientY; tracking = true;
    }
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
    if (dx > 60) { shell.classList.add("nav-open"); tracking = false; }
  }, { passive: true });
  document.addEventListener("touchend", () => { tracking = false }, { passive: true });
})();
(function sheetDrag() {
  const sheet = $("#qsSheet");
  if (!sheet) return;
  const handle = sheet.querySelector(".qs-sheet-handle");
  const head = sheet.querySelector(".qs-sheet-head");
  const target = handle || head;
  if (!target) return;
  let startY = 0, currentY = 0, dragging = false;
  target.addEventListener("touchstart", (e) => {
    startY = e.touches[0].clientY; currentY = startY; dragging = true;
    sheet.classList.add("dragging");
  }, { passive: true });
  target.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    currentY = e.touches[0].clientY;
    const dy = Math.max(0, currentY - startY);
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  target.addEventListener("touchend", () => {
    if (!dragging) return;
    dragging = false; sheet.classList.remove("dragging");
    const dy = Math.max(0, currentY - startY);
    sheet.style.transform = "";
    if (dy > 90 && typeof closeQuickModelSwitch === "function") closeQuickModelSwitch();
  });
})();
function attachChatRowSwipe(rowEl) {
  let startX = 0, startY = 0, dragging = false;
  rowEl.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; dragging = true;
  }, { passive: true });
  rowEl.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > Math.abs(dx)) { dragging = false; return }
    if (dx < -30) rowEl.classList.add("is-swiping");
    else rowEl.classList.remove("is-swiping");
  }, { passive: true });
  rowEl.addEventListener("touchend", () => { dragging = false });
}


document.addEventListener("change", async (e) => {
  const fileInput = e.target.closest("[data-provider-file]");
  if (!fileInput) return;
  const f = fileInput.files?.[0];
  fileInput.value = "";
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { toast("Icon must be under 2 MB"); return }
  const provider = fileInput.dataset.providerFile;
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = String(reader.result || "");
    try {
      const r = await apiFetch(WORKER_BASE + "/admin/provider-icons", {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ provider, url: dataUrl })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Upload failed");
      if (typeof adminIconOverrides !== "undefined") adminIconOverrides = j.icons || {};
      if (typeof iconCache !== "undefined") { iconCache.delete(provider); iconCache.set(provider, dataUrl); }
      toast("Icon uploaded");
      if (typeof renderProviderIconsPage === "function") renderProviderIconsPage();
      if (typeof updateBadge === "function") updateBadge();
      if ($("#modelsPage")?.classList.contains("open") && typeof renderCatalog === "function") renderCatalog();
    } catch (err) {
      toast(err.message || "Upload failed");
    }
  };
  reader.readAsDataURL(f);
});

</script>
