/* ============================================================
   TAGGED REASONING PARSER
   ============================================================
   Some upstreams (Cloudflare Workers AI in particular) emit
   reasoning inside <think>…</think> (or similar) tags mixed into
   the content stream instead of a dedicated reasoning field.
   This parser extracts those tags so the UI can show them in the
   collapsible Thinking panel. */
function newStreamState(){
  return { pending: "", inReasoning: false };
}
function parseReasoningStream(st, chunk){
  const out = { content: "", reasoning: "" };
  if (!chunk) return out;
  st.pending += chunk;
  // Process complete tags; leave a possible partial tag in pending.
  while (true) {
    if (st.inReasoning) {
      const end = st.pending.search(/<\/(?:think|reasoning|thought)>/i);
      if (end === -1) {
        // Keep last few chars in case a close tag is split across chunks.
        if (st.pending.length > 32) {
          out.reasoning += st.pending.slice(0, -16);
          st.pending = st.pending.slice(-16);
        }
        break;
      }
      out.reasoning += st.pending.slice(0, end);
      st.pending = st.pending.slice(end).replace(/^<\/(?:think|reasoning|thought)>/i, "");
      st.inReasoning = false;
      continue;
    }
    const start = st.pending.search(/<(?:think|reasoning|thought)(?:\s[^>]*)?>/i);
    if (start === -1) {
      if (st.pending.length > 32) {
        out.content += st.pending.slice(0, -16);
        st.pending = st.pending.slice(-16);
      }
      break;
    }
    out.content += st.pending.slice(0, start);
    st.pending = st.pending.slice(start).replace(/^<(?:think|reasoning|thought)(?:\s[^>]*)?>/i, "");
    st.inReasoning = true;
  }
  return out;
}
function flushReasoningStream(st){
  const out = { content: "", reasoning: "" };
  if (st.inReasoning) out.reasoning = st.pending;
  else out.content = st.pending;
  st.pending = "";
  return out;
}

/* ============================================================
   UPSTREAM ERROR CLASSIFIER
   ============================================================
   Maps raw upstream errors to short, user-friendly text.
   Admins always see the raw message so they can debug. */
function classifyUpstreamError(raw){
  const s = String(raw || "");
  const low = s.toLowerCase();
  if (
    low.includes("premium model") ||
    low.includes("permission_denied") ||
    low.includes("requires an active paid plan") ||
    low.includes("paid plan") ||
    low.includes("top up") ||
    low.includes("wallet") ||
    low.includes("subscription") ||
    low.includes("model_not_found") ||
    low.includes("model is not available") ||
    low.includes("not available") ||
    low.includes("unavailable") ||
    /\b(402|403|404|503|504)\b/.test(s)
  ) return "unavailable";
  if (/\b401\b/.test(s) || low.includes("authentication_required")) return "auth";
  if (/\b429\b/.test(s) || low.includes("rate limit")) return "rate_limit";
  if (/\b5\d\d\b/.test(s)) return "server";
  return "unknown";
}
function friendlyErrorText(raw){
  const kind = classifyUpstreamError(raw);
  switch (kind) {
    case "unavailable":
      return "This model is currently unavailable. Try another model, or ask an admin to check it.";
    case "auth":
      return "Your session has expired. Please sign in again.";
    case "rate_limit":
      return "Too many requests right now. Please wait a moment and try again.";
    case "server":
      return "The model service is temporarily unavailable. Please try again in a moment.";
    default:
      return "Something went wrong while contacting the model. Please try again.";
  }
}

}

   Three CDNs, tried in order. The first URL that loads wins and
   is cached for the session. Providers without a slug fall back
   to a letter tile. Admins can pin a specific URL via the
   Provider Icons admin panel; overrides always take priority.  */
const PROVIDER_ICON_SLUGS = {
  openai: "openai",
  anthropic: "anthropic",
  google: "gemini",
  deepseek: "deepseek",
  qwen: "qwen",
  moonshot: "kimi",
  zai: "zai",
  xai: "grok",
  meta: "meta",
  mistral: "mistral",
  minimax: "minimax",
  nvidia: "nvidia",
  cohere: "cohere",
  bytedance: "doubao",
  xiaomi: "xiaomi",
  tencent: "hunyuan"
};
const ICON_SOURCES = [
  (slug) => `https://unpkg.com/@lobehub/icons-static-svg@latest/icons/${slug}.svg`,
  (slug) => `https://cdn.simpleicons.org/${slug}`,
  (slug) => `https://models.dev/logos/${slug}.svg`
];
/* key -> url (string) or null (definitively no icon). */
const iconCache = new Map();
/* Custom overrides from the admin panel, keyed by provider. */
let adminIconOverrides = {};

function slugFor(key){
  return PROVIDER_ICON_SLUGS[key] || key;
}
function probeImage(url){
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    let done = false;
    img.onload = () => { if (!done) { done = true; resolve(true); } };
    img.onerror = () => { if (!done) { done = true; resolve(false); } };
    img.src = url;
    setTimeout(() => { if (!done) { done = true; resolve(false); } }, 2500);
  });
}
/* Returns the resolved URL for a provider, or null.
   Synchronous — relies on the cache warmed at startup. */
function providerIconUrl(key){
  if (iconCache.has(key)) return iconCache.get(key);
  // Not yet warmed: fall back to the first source so something shows.
  const override = adminIconOverrides[key];
  if (override) return override;
  return ICON_SOURCES[0](slugFor(key));
}
/* Warm the icon cache for every provider currently in the models
   list. Runs once after models load; re-runs when models change. */
let iconWarmupRunning = false;
async function warmIconCache(){
  if (iconWarmupRunning) return;
  iconWarmupRunning = true;
  try {
    const keys = new Set(state.models.map(m => makerOf(m.id).key));
    await Promise.all([...keys].map(async (k) => {
      if (iconCache.has(k)) return;
      const override = adminIconOverrides[k];
      if (override) { iconCache.set(k, override); return; }
      const slug = slugFor(k);
      // If slug is missing entirely, cache null immediately.
      if (!slug) { iconCache.set(k, null); return; }
      for (const src of ICON_SOURCES) {
        const url = src(slug);
        const ok = await probeImage(url);
        if (ok) { iconCache.set(k, url); return; }
      }
      iconCache.set(k, null);
    }));
    // Re-render surfaces that display icons.
    updateBadge();
    if ($("#modelsPage").classList.contains("open")) renderCatalog();
    if ($("#qsSheet").classList.contains("open")) renderQuickSwitch();
  } finally {
    iconWarmupRunning = false;
  }
}
/* Called once at boot: fetch admin overrides before warming. */
async function loadProviderIconOverrides(){
  try {
    const r = await apiFetch(WORKER_BASE + "/provider-icons", { headers: authHeaders(false) });
    if (r.ok) {
      const j = await r.json();
      adminIconOverrides = (j && j.icons) || {};
    }
  } catch { /* offline or endpoint not deployed — auto-resolution still works */ }
}

function applyOverrideKey(id){
  const ov = state.providerOverrides || {};
  const byId = ov.byModelId || {};
  if (byId[id]) return byId[id];
  const low = String(id).toLowerCase();
  const patterns = ov.byPattern || [];
  let bestLen = -1, bestProvider = null;
  for (const { pattern, provider } of patterns) {

function isFreeModel(m){
  if (!m) return false;
  const id = String(m.id || "").toLowerCase();
  if (/[:._\-]free$/i.test(id)) return true;
  try {
    const key = makerOf(m.id).key;

  const p = m.pricing || {};

function makerOf(modelId){
  const id = String(modelId||"");
  const override = applyOverrideKey(id);
  if (override) return { key: override, label: providerLabel(override) };
  for (const m of MAKERS){ if (m.re.test(id)) return { key:m.key, label:m.label }; }
  const agg = (id.split("/")[0]||"").toLowerCase();
  const label = AGGREGATOR_LABELS[agg] || (agg ? agg[0].toUpperCase()+agg.slice(1) : "Other");
  return { key: agg || "other", label };
}
function providerOf(modelId){ return makerOf(modelId).key; }
function providerLabel(key){
  if (!key) return "Other";
  for (const m of MAKERS) if (m.key === key) return m.label;
  for (const [k,v] of Object.entries(AGGREGATOR_LABELS)) if (k.toLowerCase() === String(key).toLowerCase()) return v;
  return String(key).charAt(0).toUpperCase() + String(key).slice(1);
}
function safeLetter(key){
  const l = String(providerLabel(key) || "?")[0].toUpperCase();
  return /^[A-Z0-9]$/.test(l) ? l : "?";
}
function renderTile(key, sizeClass=""){
  const color = providerColor(key);
  const tint = hexToRgba(color, .16);
  const border = hexToRgba(color, .35);
  const url = providerIconUrl(key);
  const letter = safeLetter(key);
  const inner = url
    ? `<span class="tile-icon" style="--icon-url:url('${url}')"></span>`
    : letter;
  return `<span class="tile ${sizeClass}" style="background:${tint};color:${color};border:1px solid ${border}">${inner}</span>`;
}
function renderChipIcon(key){
  const url = providerIconUrl(key);
  const letter = safeLetter(key);
  if (url) return `<span class="tile-icon" style="--icon-url:url('${url}')"></span>`;
  return letter;
}

const NAME_TOKEN_MAP = { gpt:"GPT", llm:"LLM", ai:"AI", vl:"VL", glm:"GLM", oss:"OSS", api:"API", qwq:"QwQ" };
function cleanModelName(id){
  let raw = String(id||"").split("/").pop() || id || "Unknown";
  raw = raw.replace(/_+/g," ");
  let tokens = raw.split(/-+/).filter(Boolean);
  const merged = [];
  for (let i=0;i<tokens.length;i++){
    const t = tokens[i];
    if (/^\d$/.test(t) && merged.length && /^\d(\.\d+)?$/.test(merged[merged.length-1])){
      merged[merged.length-1] += "." + t;
    } else {
      merged.push(t);
    }
  }
  return merged.map(tok=>{
    const lower = tok.toLowerCase();
    if (NAME_TOKEN_MAP[lower]) return NAME_TOKEN_MAP[lower];
    if (/^\d/.test(tok)) return tok.replace(/([a-z])$/i, m=>m.toUpperCase());
    return tok[0].toUpperCase() + tok.slice(1);
  }).join(" ");
}

function canonicalKeyOf(modelId) {
  const raw = String(modelId || "");
  const last = raw.includes("/") ? raw.slice(raw.lastIndexOf("/") + 1) : raw;
  return last.toLowerCase()
    .replace(/:free$/i, "")
    .replace(/[._]/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}
function clientGroupModels(models) {
  const map = new Map();
  for (const m of models) {
    if (!m || typeof m.id !== "string") continue;
    const key = canonicalKeyOf(m.id);
    if (!key) continue;
    let g = map.get(key);
    if (!g) { g = { canonical: key, variants: [], hasFree: false, providers: [], primary: m.id, pinned: null }; map.set(key, g) }
    g.variants.push(m);
    if (/:free$/i.test(m.id)) g.hasFree = true;
    const prov = (m.id.split("/")[0] || "").toLowerCase();
    if (prov && !g.providers.includes(prov)) g.providers.push(prov);
  }
  for (const g of map.values()) {
    const sorted = [...g.variants].sort((a, b) => {
      const af = /:free$/i.test(a.id) ? 1 : 0, bf = /:free$/i.test(b.id) ? 1 : 0;
      if (af !== bf) return af - bf;
      if (a.id.length !== b.id.length) return a.id.length - b.id.length;
      return a.id.localeCompare(b.id);
    });
    g.primary = sorted[0].id;
  }
  return [...map.values()];
}

async function loadModels(){
  try{
    const r=await apiFetch(API_BASE+"/models",{headers:authHeaders(false)});
    if(r.status===401||r.status===403){
      const errBody = await r.json().catch(()=>({}));
      console.warn("[loadModels] 401:", errBody);
      // Give the cookie one shot before giving up
      const retry = await apiFetch(API_BASE+"/models",{headers:authHeaders(false)}).catch(()=>null);
      if (retry && retry.ok) {
        const j = await retry.json();
        state.models = Array.isArray(j.data) ? j.data : [];
        if (Array.isArray(j.groups) && j.groups.length) {
          state.modelGroups = j.groups.map(g => ({
            canonical: g.canonical,
            primary: g.primary || (g.variants && g.variants[0] && (g.variants[0].id || g.variants[0])),
            variants: (g.variants || []).map(v => typeof v === "string" ? { id: v } : v),
            hasFree: !!g.hasFree,
            providers: g.providers || [],
            pinned: g.pinned || null
          }));
        } else {
          state.modelGroups = [];
        }
        if (!state.model || !state.models.some(m => m.id === state.model)) {
          state.model = state.models[0]?.id || "";
        }
        localStorage.setItem("chinaGPTModel", state.model);
        updateBadge();
        return;
      }
      clearAuth();
      updateBadge();
      openLogin("models");
      return;
    }
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); state.models=Array.isArray(j.data)?j.data:[];
    if (Array.isArray(j.groups) && j.groups.length) {
      state.modelGroups = j.groups.map(g => ({
        canonical: g.canonical,
        primary: g.primary || (g.variants && g.variants[0] && (g.variants[0].id || g.variants[0])),
        variants: (g.variants || []).map(v => typeof v === "string" ? { id: v } : v),
        hasFree: !!g.hasFree,
        providers: g.providers || [],
        pinned: g.pinned || null
      }));
      console.log("[loadModels] backend groups:", state.modelGroups.length);
    } else {
      console.warn("[loadModels] no groups in response — client-side fallback");
      state.modelGroups = clientGroupModels(state.models);
      console.log("[loadModels] client groups:", state.modelGroups.length);
    }
    if(!state.model || !state.models.some(m=>m.id===state.model)) {
      if (state.modelGroups.length) state.model = state.modelGroups[0].primary;
      else state.model=state.models[0]?.id||"";
    }
    localStorage.setItem("chinaGPTModel",state.model); updateBadge(); refreshCatalogIfOpen();

    const fileFilename = fileMatch ? fileMatch[1] : null;
    if (fileMatch) lang = "";  // don't try to highlight file: blocks

    // Highlight, or auto-detect language if missing
    try {
      if (window.hljs) {
        if (lang && hljs.getLanguage(lang)) {
          hljs.highlightElement(block);
        } else if (!lang && rawText.length > 20) {
          const result = hljs.highlightAuto(rawText);
          block.innerHTML = result.value;
          block.classList.add("hljs");
          lang = result.language || "text";
        }
      }
    } catch (e) {}

    // Line numbers + text split
    const lines = rawText.split("\n");
    const highlightedHtml = block.innerHTML;
    if (lines.length >= 3) {
      const gutter = document.createElement("span");
      gutter.className = "code-gutter";
      gutter.setAttribute("aria-hidden", "true");
      gutter.textContent = lines.map((_, i) => String(i + 1)).join("\n");

      const textSpan = document.createElement("span");
      textSpan.className = "code-text";
      textSpan.innerHTML = highlightedHtml;

      block.innerHTML = "";
      block.appendChild(gutter);
      block.appendChild(textSpan);
    } else {
      const textSpan = document.createElement("span");
      textSpan.className = "code-text";
      textSpan.innerHTML = highlightedHtml;
      block.innerHTML = "";
      block.appendChild(textSpan);
    }

    // Toolbar
    const wrap = document.createElement("div");
    wrap.className = "code-block-wrap";
    const toolbar = document.createElement("div");
    toolbar.className = "code-toolbar";
    toolbar.innerHTML = `<span>${escapeHtml(lang || "code")}</span><span class="code-toolbar-actions">
      <button type="button" data-copy-code>Copy</button>
      <button type="button" data-download-code data-lang="${escapeHtml(lang)}">Download</button>
      <button type="button" data-toggle-wrap>Wrap</button>
    </span>`;
    pre.parentElement.insertBefore(wrap, pre);
    wrap.appendChild(toolbar);
    wrap.appendChild(pre);

    if (fileFilename) {
      wrap.appendChild(buildFileCard(fileFilename, rawText, mimeForExt(extOf(fileFilename))));
    }
  });

  // Table wrappers (unchanged)
  container.querySelectorAll(":scope table").forEach(t=>{
    if(t.parentElement.classList.contains("md-table-wrap"))return;
    const w=document.createElement("div");w.className="md-table-wrap";
    t.parentElement.insertBefore(w,t);w.appendChild(t);
  });

  // Copy
  container.querySelectorAll("[data-copy-code]").forEach(b=>b.onclick=()=>{
    const wrapEl = b.closest(".code-block-wrap");
    const codeEl = wrapEl ? wrapEl.querySelector("code") : null;
    const code = codeEl ? codeEl.innerText : "";
    copyText(code);
    b.textContent = "Copied ✓";
    setTimeout(()=>{b.textContent="Copy"},1500);
  });

  // Download
  container.querySelectorAll("[data-download-code]").forEach(b=>b.onclick=()=>{
    const wrapEl = b.closest(".code-block-wrap");
    const codeEl = wrapEl ? wrapEl.querySelector("code") : null;
    const code = codeEl ? codeEl.innerText : "";
    try{
      const blob = new Blob([code], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "snippet" + extFor(b.dataset.lang);
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }catch(e){toast("Download failed")}
  });

  // Wrap toggle
  container.querySelectorAll("[data-toggle-wrap]").forEach(b=>b.onclick=()=>{
    const wrapEl = b.closest(".code-block-wrap");
    const codeEl = wrapEl ? wrapEl.querySelector("code") : null;
    if (!codeEl) return;
    codeEl.classList.toggle("code-wrapped");
    b.textContent = codeEl.classList.contains("code-wrapped") ? "Unwrap" : "Wrap";
  });

  // Math
  try{if(window.renderMathInElement)renderMathInElement(container,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false})}catch(e){}
  // ---- Auto-link URLs and commands in text nodes ----
  autoDecorateTextNodes(container);

}

/* Walks text nodes, skipping code/pre/a/style/script */
function autoDecorateTextNodes(root){
  const SKIP = new Set(["CODE","PRE","A","STYLE","SCRIPT","TEXTAREA"]);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let p = node.parentNode;
      while (p && p !== root) {
        if (SKIP.has(p.tagName)) return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);

  for (const node of nodes) {
    const text = node.nodeValue;
    const pattern = /(\b(?:curl|wget)\s+\S+)|(https?:\/\/[^\s<>"'`]+)|(\b(?:GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\b(?=\s+[\/\w]))|((?:^|\s)(?:\.{0,2}\/)[\w./\-]+)/g;
    if (!pattern.test(text)) continue;
    pattern.lastIndex = 0;

    const frag = document.createDocumentFragment();
    let last = 0;
    let m;
    while ((m = pattern.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1]) {
        const cmd = m[1];
        const urlMatch = cmd.match(/https?:\/\/\S+/);
        if (urlMatch) {
          const before = cmd.slice(0, cmd.indexOf(urlMatch[0]));
          frag.appendChild(elSpan("cmd-token", before.trim()));
          frag.appendChild(document.createTextNode(" "));
          frag.appendChild(anchorFor(urlMatch[0]));
        } else {
          frag.appendChild(elSpan("cmd-token", cmd));
        }
      } else if (m[2]) {
        frag.appendChild(anchorFor(m[2]));
      } else if (m[3]) {
        frag.appendChild(elSpan("http-method", m[3]));
      } else if (m[4]) {
        frag.appendChild(elSpan("file-path", m[4]));
      }
      last = pattern.lastIndex;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

function elSpan(cls, text){
  const s = document.createElement("span");
  s.className = cls;
  s.textContent = text;
  return s;
}
function anchorFor(url){
  const a = document.createElement("a");
  a.className = "auto-link";
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = url;
  return a;
}

function scrollToBottom(force){
  const el=$("#stageScroll");if(!el)return;
  const distance=el.scrollHeight-el.scrollTop-el.clientHeight;
  if(force||distance<140)el.scrollTop=el.scrollHeight;
}

   MESSAGE RENDERING
   ============================================================ */
function iconForFilename(filename, mime) {
  const name = String(filename || "").toLowerCase();
  const m = String(mime || "").toLowerCase();
  if (m === "application/pdf" || name.endsWith(".pdf")) return ICONS.file;
  if (/\.(csv|xlsx?|numbers|ods)$/.test(name)) return ICONS.file;
  if (/\.(zip|tar|gz|rar|7z)$/.test(name)) return ICONS.file;
  if (/\.(png|jpe?g|gif|webp|svg|bmp|ico)$/.test(name) || m.startsWith("image/")) return ICONS.image;
  if (/\.(js|ts|jsx|tsx|py|java|c|cpp|h|hpp|cs|rs|go|rb|php|sql|sh|json|yaml|yml|xml|toml|html?|css)$/.test(name)) return ICONS.code;
  return ICONS.file;
}

function buildFileCard(filename, content, mime) {
  const ext = extOf(filename);
  const sizeLabel = formatBytes(content.length) || (content.length + " B");
  const card = document.createElement("div");
  card.className = "file-card";
  card.innerHTML = `
    <div class="file-card-icon">${iconForFilename(filename, mime)}</div>
    <div class="file-card-main">
      <div class="file-card-name">${escapeHtml(filename)}</div>
      <div class="file-card-meta">${escapeHtml((ext || "FILE").toUpperCase())} · ${escapeHtml(sizeLabel)}</div>
    </div>
    <div class="file-card-actions">
      <button type="button" class="file-card-action" data-copy title="Copy content" aria-label="Copy content">${ICONS.copy}</button>
      <button type="button" class="file-card-action" data-download title="Download" aria-label="Download">${ICONS.download}</button>
    </div>
  `;
  const open = () => openFilePreview(filename, content, mime);
  card.querySelector(".file-card-main").onclick = open;
  card.querySelector(".file-card-icon").onclick = open;
  card.querySelector("[data-copy]").onclick = (e) => {
    e.stopPropagation();
    copyText(content);
    const btn = e.currentTarget;
    const orig = btn.innerHTML;
    btn.classList.add("is-copied");
    btn.innerHTML = CHECK_ICON;
    setTimeout(() => { btn.classList.remove("is-copied"); btn.innerHTML = orig; }, 1400);
  };
  card.querySelector("[data-download]").onclick = (e) => {
    e.stopPropagation();
    downloadFile(filename, content, mime);
  };
  return card;
}

      };

    if (controls.children.length) row.appendChild(controls);

  });
  scrollToBottom(true);
}


function openToolLogDialog(m){
  const log = Array.isArray(m._toolLog) ? m._toolLog : [];
  if (!log.length) return;

  const searchEvt = log.find(e => (e.kind === "search" || e.kind === "web_search") && e.status === "done");
  const fetches = log.filter(e => (e.kind === "fetch" || e.kind === "web_fetch") && e.status === "done" && e.data);
  const files = log.filter(e => e.kind === "create_file" && e.status === "done");
  const failures = log.filter(e => e.status === "failed");

  pushPage("Search & sources", (body) => {
    const sections = [];

    if (searchEvt) {
      const srcs = (searchEvt.data && Array.isArray(searchEvt.data.sources)) ? searchEvt.data.sources : [];
      const answer = (searchEvt.data && searchEvt.data.answer) ? searchEvt.data.answer : "";
      sections.push(`
        <div class="tl-section">
          <h4>Web search</h4>
          <div class="tl-answer" id="tlAnswer">${escapeHtml(answer || "No summary returned.")}</div>
          ${answer.length > 300 ? `<button type="button" class="tl-expand" id="tlExpand">Show more</button>` : ""}
        </div>
      `);
      if (srcs.length) {
        sections.push(`
          <div class="tl-section">
            <h4>Sources</h4>
            <ul class="tl-sources">
              ${srcs.map((s, i) => `<li><span class="tl-idx">${i + 1}</span><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title || shortHost(s.url))}</a></li>`).join("")}
            </ul>
          </div>
        `);
      }
    }

    if (fetches.length) {
      sections.push(`
        <div class="tl-section">
          <h4>Pages read</h4>
          ${fetches.map(f => `<div class="tl-file-row"><span class="tl-name">${escapeHtml((f.data && f.data.title) || shortHost(f.url))}</span><span class="tl-size">${escapeHtml(f.detail || "")}</span></div>`).join("")}
        </div>
      `);
    }

    if (files.length) {
      sections.push(`
        <div class="tl-section">
          <h4>Files created</h4>
          ${files.map(f => {
            const args = f.args || {};
            return `<div class="tl-file-row"><span class="tl-name">${escapeHtml(args.filename || "file.txt")}</span><span class="tl-size">${escapeHtml(formatBytes((args.content || "").length))}</span></div>`;
          }).join("")}
        </div>
      `);
    }

    if (failures.length) {
      sections.push(`
        <div class="tl-section">
          <h4>Failed</h4>

const CHAT_STORE_KEY="chinaGPTConversationsV2",MAX_CONVERSATIONS=100;
function safeJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||"")??fallback}catch{return fallback}}
function conversations(){const a=safeJson(CHAT_STORE_KEY,[]);return Array.isArray(a)?a:[]}
function makeConversationTitle(messages){
  const firstUser = messages.find(m => m.role === "user" && typeof m.content === "string" && m.content.trim());
  if (!firstUser) {
    const withAtt = messages.find(m => m.role === "user" && Array.isArray(m._attachments) && m._attachments.length);
    if (withAtt) return smartTitle("File: " + withAtt._attachments[0].name);
    return "New conversation";
  }

  const fullText = messages
    .filter(m => m.role === "user" && typeof m.content === "string")
    .slice(0, 3)
    .map(m => m.content)
    .join(" ")
    .replace(/\s+/g, " ")
    .trim();

  return smartTitle(fullText || firstUser.content);
}

function smartTitle(text){
  const t = String(text || "").replace(/\s+/g, " ").trim();
  if (!t) return "New conversation";

  const greetingOnly = /^(hi|hey|hello|yo|sup|howdy|good\s+(morning|afternoon|evening|night)|greetings|hiya|heya|hi there|hello there|hey there)[\s!,.?]*(?:deepseek|gpt|claude|gemini|chatgpt|ai|bot|assistant|buddy|friend)?[\s!,.?]*$/i;
  if (greetingOnly.test(t)) {
    return t.length > 18 ? "Casual greeting" : "Friendly greeting";
  }

  if (!/[a-z0-9]/i.test(t)) return "Casual chat";

  let clean = t
    .replace(/^(hi|hey|hello|yo|sup|howdy|greetings)[\s,!.]*/i, "")
    .replace(/^(please|pls|can you|could you|would you|will you|i want to|i'd like to|i would like to|i need to|i need|help me(?: to)?|i was wondering(?: if)?|do you know(?: how)?(?: to)?)\s+/i, "")
    .replace(/^(tell me about|explain|show me|give me|write me|create|generate|make)\s+/i, "")
    .trim();

  if (!clean || clean.length < 3) clean = t;

  clean = clean.replace(/[.!?]+$/, "").trim();
  clean = clean.charAt(0).toUpperCase() + clean.slice(1);

  const MAX = 46;
  if (clean.length > MAX) {
    const truncated = clean.slice(0, MAX);
    const lastSpace = truncated.lastIndexOf(" ");
    clean = (lastSpace > 20 ? truncated.slice(0, lastSpace) : truncated).trim() + "…";
  }
  return clean;
}

function activeSystemPrompt(){
  if(state.persona&&state.persona.enabled&&state.persona.text&&state.persona.text.trim()) return state.persona.text.trim();
  return "";
}
function chatMessages(uptoIndex){
  const slice = typeof uptoIndex === "number"
    ? state.messages.slice(0, uptoIndex)
    : state.messages;

  let lastUserIdx = -1;
  for (let i = slice.length - 1; i >= 0; i--) {
    if (slice[i].role === "user") { lastUserIdx = i; break; }
  }

  const sys = activeSystemPrompt();
  const out = [];
  if (sys) out.push({ role: "system", content: sys });

  for (let i = 0; i < slice.length; i++) {
    const m = slice[i];
    if (m.role === "user") {
      if (i === lastUserIdx && Array.isArray(m._toolContext) && m._toolContext.length) {
        for (const ctx of m._toolContext) {
          out.push({ role: "system", content: ctx.text });
        }
      }
      out.push({
        role: "user",
        content: m._multimodal || m._modelContent || m.content || ""
      });
    } else if (m.role === "assistant") {
      if (m.content) out.push({ role: "assistant", content: m.content });
    }
  }
  return out;
}

/* Split chain-of-thought text from the final answer when upstream
   dumps both into `content` (common with DeepSeek via some proxies). */
function trySplitReasoningAnswer(text) {
  const s = String(text || "");
  if (s.length < 40) return null;

  // Explicit markers DeepSeek / R1-style models use
  const RE_MARK = /^(.*?)(?:\bNeed final\.?|\bFinal answer:|\bFinal response:|\bHere(?:'s| is) my final answer:|\bFinal:)\s*/is;
  const m = s.match(RE_MARK);
  if (m && m[1].length >= 8) {
    return { reasoning: m[1].trim(), answer: s.slice(m[0].length).trim() };
  }

  // CoT language present?
  const cot = /\b(the user (just )?(said|asked|wants|is)|I should|I need to|I'll |my (response|reply)|keep it (friendly|simple|warm)|no need for|this is a simple|likely wants|encourage further)\b/i;
  if (!cot.test(s)) return null;

  // Last short conversational paragraph after blank line
  const parts = s.split(/\n\n+/);
  if (parts.length >= 2) {
    const last = parts[parts.length - 1].trim();
    if (last.length >= 8 && last.length <= 320) {
      const head = parts.slice(0, -1).join("\n\n").trim();
      if (head.length > 40 && cot.test(head)) {
        return { reasoning: head, answer: last };
      }
    }
  }

  // Answer glued after period: "...needs.Hello! I'm DeepSeek..."
  const glued = s.match(/^([\s\S]{40,}?[.!?])\s*((?:Hello|Hi\b|Hey\b|Sure\b|Of course|Yes[,!]|Got it|Absolutely|Thanks|Thank you|Here(?:'s| is))[\s\S]{0,400})$/i);
  if (glued) {
    return { reasoning: glued[1].trim(), answer: glued[2].trim() };
  }

  // Last sentence if short and head is long CoT
  const lastSent = s.match(/^([\s\S]+[.!?])\s+([A-Z][^.!?\n]{8,240}[.!?]?)\s*$/);
  if (lastSent && lastSent[1].length > 80 && cot.test(lastSent[1])) {
    return { reasoning: lastSent[1].trim(), answer: lastSent[2].trim() };
  }

  return null;
}

async function readCompletionResponse(response, onChunk, onReasoning, onModel, onToolEvent){
  if(!response.ok){let msg="";try{msg=await response.text()}catch{};throw new Error("HTTP "+response.status+(msg?" — "+msg:""))}
  const type=response.headers.get("content-type")||"";
  if(!response.body)return null;

  if(!type.includes("text/event-stream")){
    const j=await response.json();
    const msg=j.choices?.[0]?.message;
    if (j.model && onModel) onModel(j.model);
    const r=msg?.reasoning_content||msg?.reasoning;
    if(r&&onReasoning)onReasoning(r);
    if(msg?.content) onChunk(msg.content);
    return j.usage||null;
  }

  const reader=response.body.getReader(),decoder=new TextDecoder();
  let buf="",usage=null;
  // ---- DeepSeek-through-proxy workaround ----
  // Some proxies put only the first reasoning token in `reasoning_content`
  // and stream the rest of the reasoning + the answer in `content`. Buffer
  // content once reasoning has been seen, split at a marker, and bail out
  // safely if the model never emits one.
  let reasoningSeen = false;
  let reasoningDone = false;
  let pendingContent = "";
  const RE_FINAL = /^(.*?)(?:\bNeed final\.?|\bFinal answer:|\bFinal response:|\bHere(?:'s| is) my final answer:)\s*/is;
  const PENDING_MAX = 4000;

  function flushPending(){
    if (!pendingContent) return;
    if (!reasoningDone) {
      const m = pendingContent.match(RE_FINAL);
      if (m) {
        if (onReasoning) onReasoning(m[1]);
        pendingContent = pendingContent.slice(m[0].length);
        reasoningDone = true;
      } else if (pendingContent.length > PENDING_MAX) {
        // No marker yet — try heuristic split, else hold for end-of-stream.
        const split = trySplitReasoningAnswer(pendingContent);
        if (split) {
          if (split.reasoning && onReasoning) onReasoning(split.reasoning);
          pendingContent = split.answer || "";
          reasoningDone = true;
        }
        // else keep buffering until stream ends (smarter split there)
      }
    }
    if (reasoningDone && pendingContent) {
      if (onChunk) onChunk(pendingContent);
      pendingContent = "";
    }
  }

  while(true){
    const {value,done}=await reader.read();if(done)break;
    buf+=decoder.decode(value,{stream:true});
    const lines=buf.split(/\r?\n/);buf=lines.pop()||"";

    for(const line of lines){
      if(!line.startsWith("data:"))continue;
      const raw=line.slice(5).trim();
      if(!raw||raw==="[DONE]")continue;

      let j;
      try { j=JSON.parse(raw); } catch { continue; }

      // Custom events from our tool loop
      if (j.type === "tool_start" && onToolEvent) {
        onToolEvent({ kind: "start", id: j.id, name: j.name, args: j.args || {} });
        continue;
      }
      if (j.type === "tool_result" && onToolEvent) {
        onToolEvent({ kind: "result", id: j.id, name: j.name, ok: !!j.ok, result: j.result || null, error: j.error || null });
        continue;
      }
      if (j.type === "done" && onToolEvent) {
        if (j.model && onModel) onModel(j.model);
        if (j.usage) usage = j.usage;
        onToolEvent({ kind: "done", usage: j.usage || null });
        continue;
      }
      if (j.type === "error") {
        throw new Error(j.message || ("HTTP " + (j.status || "unknown")));
      }

      // Normal upstream events
      if (j.model && onModel) onModel(j.model);
      const delta = j.choices?.[0]?.delta;

      const rText = delta?.reasoning_content || delta?.reasoning;
      if (rText) { reasoningSeen = true; if (onReasoning) onReasoning(rText); }

      const c = delta?.content;
      if (c) {
        const parts = typeof c === "string" ? [c] : (Array.isArray(c) ? c : []);
        for (const part of parts) {
          const piece = typeof part === "string" ? part
                      : (part && typeof part.text === "string") ? part.text
                      : "";
          if (!piece) continue;
          if (reasoningSeen && !reasoningDone) {
            pendingContent += piece;
            flushPending();
          } else {
            if (onChunk) onChunk(piece);
          }
        }
      }
      if (j.usage) usage = j.usage;
    }
  }

  // Stream ended. Prefer a clean split; never swallow the answer.
  if (pendingContent) {
    const split = trySplitReasoningAnswer(pendingContent);
    if (split) {
      if (split.reasoning && onReasoning) onReasoning(split.reasoning);
      if (split.answer && onChunk) onChunk(split.answer);
    } else {
      if (onChunk) onChunk(pendingContent);
    }
    pendingContent = "";
  }
  return usage;
}

async function requestCompletion(target, messages, model=state.model){
  state.abortController=new AbortController();

  const body = { model, messages, stream: true };

  // Only send tools if the selected model supports them
  const modelMeta = state.models.find(m => m.id === model);
  const supportsTools = !!(modelMeta && modelMeta.capabilities && modelMeta.capabilities.tools);
  if (supportsTools) {
    body.tools = TOOL_DEFS;
    body.tool_choice = "auto";
  }

  const streamState = newStreamState();

  try{
    const r=await apiFetch(API_BASE+"/chat/completions",{
      method:"POST",headers:authHeaders(),body:JSON.stringify(body),signal:state.abortController.signal
    });
    const actualVariant = r.headers.get("X-China-GPT-Variant");
    const routing = r.headers.get("X-China-GPT-Routing") || "passthrough";
    if (actualVariant && actualVariant !== model) {
      target._actualModel = actualVariant;
      target._routingKind = routing;
    } else {
      target._routingKind = "passthrough";
    }
    const result = await readCompletionResponse(r,
      c=>{
        const parsed = parseReasoningStream(streamState, c);
        if(parsed.reasoning){
          if(!target.reasoningStartedAt) target.reasoningStartedAt = Date.now();
          target.reasoning = (target.reasoning||"") + parsed.reasoning;
        }
        if(parsed.content) target.content += parsed.content;
        updateStreamingMessage(target);
      },
      rc=>{
        if(!target.reasoningStartedAt) target.reasoningStartedAt=Date.now();
        target.reasoning=(target.reasoning||"")+rc;
        updateStreamingMessage(target);
      },
      m => { target._actualModel = m; },
      evt => handleToolEvent(target, evt)
    );

    const tail = flushReasoningStream(streamState);
    if(tail.reasoning){
      if(!target.reasoningStartedAt) target.reasoningStartedAt = Date.now();
      target.reasoning = (target.reasoning||"") + tail.reasoning;
    }
    if(tail.content) target.content += tail.content;

    // Final safety net: if the whole reply looks like CoT + answer glued
    // into content (proxy never sent reasoning_content), split it now.
    if ((!target.reasoning || target.reasoning.length < 12) && target.content && target.content.length > 60) {
      const split = trySplitReasoningAnswer(target.content);
      if (split && split.reasoning && split.answer) {
        if (!target.reasoningStartedAt) target.reasoningStartedAt = Date.now();
        target.reasoning = (target.reasoning || "") + split.reasoning;
        target.content = split.answer;
        target.reasoningEndedAt = Date.now();
      }
    }
    updateStreamingMessage(target);
    return result;
  }finally{state.abortController=null;}
}

/* ============================================================
   TOOL EVENT HANDLER
   Fired by readCompletionResponse when the tool loop emits
   tool_start / tool_result / done events.
   ============================================================ */
function handleToolEvent(target, evt){
  if (!target._toolLog) target._toolLog = [];

  if (evt.kind === "start") {
    const entry = {
      kind: evt.name,
      status: "running",
      label: toolLabel(evt.name, evt.args),
      id: evt.id,
      args: evt.args,
      data: null,
      detail: null
    };
    target._toolLog.push(entry);
    renderMessages();
    return;
  }

  if (evt.kind === "result") {
    const entry = target._toolLog.find(e => e.id === evt.id);
    if (!entry) return;
    if (evt.ok) {
      entry.status = "done";
      entry.data = evt.result;
      entry.detail = toolDetail(evt.name, evt.result);
    } else {
      entry.status = "failed";
      entry.detail = evt.error || "Failed";
    }
    renderMessages();
    return;
  }

  if (evt.kind === "done") {
    // Nothing to do — streaming continues until [DONE]
    return;
  }
}
function finalizeAssistantMessage(ai){
  if(ai.reasoningStartedAt && !ai.reasoningEndedAt){
    ai.reasoningEndedAt=Date.now();
  }
  if (ai._thinkTimer) { clearInterval(ai._thinkTimer); ai._thinkTimer = null; }
  ai.streaming=false;
}
function updateGeneratingUI(){
  const stop=$("#stopBtn"),sendBtn=$("#sendBtn");
  if(stop)stop.style.display=state.generating?"inline-flex":"none";
  if(sendBtn)sendBtn.style.display=state.generating?"none":"grid";
}
function stopGeneration(){
  if(!state.generating)return;
  try{state.abortController&&state.abortController.abort()}catch{}
  state.generating=false;
  const last=state.messages[state.messages.length-1];
  if(last&&last.role==="assistant")finalizeAssistantMessage(last);
  updateGeneratingUI();persistCurrentConversation();renderMessages();toast("Generation stopped");
}
async function send(){
  const input = $("#prompt"), text = input.value.trim();
  if (!text && !state.attachments.length) return;
  if (!isAuthenticated()) { openLogin("send"); return; }
  if (!state.model) { toast("No model selected."); return; }
  if (state.generating) { toast("A response is already generating."); return; }

  const attachedSnapshot = state.attachments.map(a => ({
    name: a.name,
    kind: a.kind,
    mime: a.mime || a.type || "",
    size: a.size || 0,
    text: a.text || "",
    dataUrl: a.dataUrl || ""
  }));

  const attachmentText = attachedSnapshot
    .filter(a => a.text)
    .map(a => `\n\n[Attached file: ${a.name}]\n${a.text}`).join("");
  const fullForModel = (text + attachmentText).trim();
  if (!fullForModel) { toast("This file type cannot be sent as text."); return; }

  const imageAttachments = attachedSnapshot.filter(a => a.dataUrl);
  const multimodalContent = imageAttachments.length
    ? [
        { type: "text", text: fullForModel },
        ...imageAttachments.map(a => ({ type: "image_url", image_url: { url: a.dataUrl } }))
      ]
    : null;

  const displayText = text || "";

  const userMsg = {
    role: "user",
    content: displayText,
    _modelContent: fullForModel,
    _attachments: attachedSnapshot,
    _multimodal: multimodalContent,
    _toolContext: []
  };
  const ai = {
    role: "assistant",
    content: "",
    streaming: true,
    reasoningStartedAt: null,
    reasoningEndedAt: null,
    _toolLog: [],
    requestedModel: state.model,
    _actualModel: null,
    _modelSupportsTools: !!(state.models.find(m => m.id === state.model)?.capabilities?.tools)
  };

  ensureConversation();
  input.value = ""; input.style.height = "";
  state.messages.push(userMsg);
  state.messages.push(ai);
  state.attachments = [];
  renderAttachments();
  renderMessages();
  persistCurrentConversation();

  const loneUrl = /^https?:\/\/\S+$/i.test(text.trim()) ? text.trim() : null;

  // A) Auto-fetch lone URL
  if (loneUrl && state.searchConfig.autoFetchUrls !== false) {
    const evt = {
      kind: "fetch",
      status: "running",
      label: `Reading ${shortHost(loneUrl)}`,
      url: loneUrl,
      detail: null,
      data: null
    };
    ai._toolLog.push(evt);
    renderMessages();
    const res = await performWebFetch(loneUrl);
    if (res) {
      evt.status = "done";
      evt.detail = formatBytes(res.length);
      evt.data = { url: res.url, title: res.title, length: res.length };
      userMsg._toolContext.push({ kind: "fetch", text: buildFetchContextMessage(res) });
    } else {
      evt.status = "failed";
      evt.detail = "Failed";
    }
    renderMessages();
  }

  // B) Web search (skipped for lone URLs)
  // Deepseek via chat.deepseek.com proxy: native Search often ends at
  // "I'll use the search tool." — inject our own search results instead.
  const forceOurSearch = isDeepseekWebProxy(state.model) && looksLikeSearchRequest(text);
  if ((state.webSearch || forceOurSearch) && text && !loneUrl) {
    const sEvt = {
      kind: "search",
      status: "running",
      label: "Searching the web",
      query: text,
      detail: null,
      data: null
    };
    ai._toolLog.push(sEvt);
    renderMessages();
    const result = await performWebSearch(text);
    if (result && (result.answer || result.sources.length)) {
      sEvt.status = "done";
      sEvt.detail = `${result.sources.length} source${result.sources.length === 1 ? "" : "s"}`;
      sEvt.data = { answer: result.answer, sources: result.sources };
      userMsg._toolContext.push({
        kind: "search",
        text: buildSearchContextMessage(text, result)
      });

      const topN = Math.min(
        result.sources.length,
        Number(state.searchConfig.fetchTopN) || 0
      );
      if (topN > 0) {
        await Promise.all(result.sources.slice(0, topN).map(async (src) => {
          const host = shortHost(src.url);
          const fEvt = {
            kind: "fetch",
            status: "running",
            label: `Reading ${host}`,
            url: src.url,
            detail: null,
            data: null
          };
          ai._toolLog.push(fEvt);
          renderMessages();
          const res = await performWebFetch(src.url);
          if (res) {
            fEvt.status = "done";
            fEvt.detail = formatBytes(res.length);
            fEvt.data = { url: res.url, title: res.title, length: res.length };
            userMsg._toolContext.push({
              kind: "fetch",
              text: buildFetchContextMessage(res)
            });
          } else {
            fEvt.status = "failed";
            fEvt.detail = "Failed";
          }
          renderMessages();
        }));
      }
    } else {
      sEvt.status = "failed";
      sEvt.detail = "No results";
    }
    renderMessages();
  }

  state.generating = true;
  updateGeneratingUI();
  try {
    await requestCompletion(ai, chatMessages());
  } catch (e) {
    if (e.name !== "AbortError") {
      ai.error = true;
      ai.content = isAdminAccount()
        ? ("Error: " + e.message)
        : friendlyErrorText(e.message);
      toast("Request failed");
    }
  } finally {
    finalizeAssistantMessage(ai);
    state.generating = false;
    updateGeneratingUI();
    persistCurrentConversation();
    renderMessages();
  }
}

/* ============================================================
   WEB SEARCH (via 9Router's /v1/search)
   ============================================================
   Returns { answer, sources, raw } on success, null on failure.
   Never throws — the chat must always be able to proceed without
   web context even if search fails. */
async function performWebSearch(query){
  try{
    const r = await fetch(API_BASE + "/search", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({
        model: resolveSearchProvider(),
        query,
        search_type: "web",
        max_results: 5
      })
    });
    if (!r.ok) return null;
    const j = await r.json();
    const answerText = j && j.answer && typeof j.answer.text === "string" ? j.answer.text : "";
    const results = Array.isArray(j && j.results) ? j.results : [];
    const sources = results
      .map(x => ({
        title: (x.title || "").trim() || "Source",
        url: (x.url || "").trim()
      }))
      .filter(x => x.url);
    return {
      answer: answerText,
      sources,
      raw: j
    };
  } catch (e) {
    return null;
  }
}

/* Build the system-message context we prepend before the user's
   actual message, so the picked model answers with fresh context. */
function buildSearchContextMessage(query, searchResult){
  const lines = [];
  lines.push(`[Web search results]`);
  lines.push(`Query: ${query}`);
  if (searchResult.answer) {
    lines.push("");
    lines.push("Summary:");
    lines.push(searchResult.answer.trim());
  }
  if (searchResult.sources.length) {
    lines.push("");
    lines.push("Sources:");
    searchResult.sources.forEach((s, i) => {
      lines.push(`${i + 1}. ${s.title} — ${s.url}`);
    });
  }
  lines.push(`[End web search results]`);
  lines.push("");
  lines.push("Use the above context to answer the user's question. Cite source numbers when relevant.");
  return lines.join("\n");
}

/* ============================================================
   URL READER (via 9Router's /v1/web/fetch)
   ============================================================ */
async function performWebFetch(url){
  try {
    const r = await fetch(API_BASE + "/web/fetch", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({
        model: state.searchConfig.fetchModel || "jina-reader",
        url,
        format: "markdown",
        max_characters: 0
      })
    });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || !j.content || typeof j.content.text !== "string") return null;
    return {
      url: j.url || url,
      title: j.title || url,
      content: j.content.text,
      length: j.content.length || j.content.text.length
    };
  } catch {
    return null;
  }
}

function buildFetchContextMessage(result){
  const lines = [];
  lines.push(`[Fetched page]`);
  lines.push(`URL: ${result.url}`);
  if (result.title && result.title !== result.url) lines.push(`Title: ${result.title}`);
  lines.push("");
  lines.push("Content:");
  const text = result.content.slice(0, 15000);
  lines.push(text);
  if (result.content.length > 15000) lines.push("…[content truncated]");
  lines.push(`[End fetched page]`);
  return lines.join("\n");
}

function shortHost(url){
  try { return new URL(url).hostname.replace(/^www\./, ""); }
  catch { return url.slice(0, 40); }
}

function formatBytes(n){
  if (!n) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return Math.round(n / 102.4) / 10 + " KB";
  return Math.round(n / 104857.6) / 10 + " MB";
}

/* ============================================================
   FILE TYPE HELPERS + PREVIEW + BINARY DOWNLOAD
   ============================================================ */

const TEXT_EXTS = new Set([
  "txt","md","markdown","html","htm","css","js","mjs","cjs","ts","tsx","jsx",
  "py","java","c","cpp","h","hpp","cs","go","rs","rb","php","swift","kt",
  "sql","sh","bash","zsh","json","csv","xml","yaml","yml","svg","log",
  "ini","env","tex","r","lua","pl","toml","conf","gitignore","dockerfile"
]);
const BINARY_EXTS = new Set(["pdf","docx","xlsx","xls","zip"]);

function extOf(name){ return String(name||"").split(".").pop().toLowerCase(); }
function mimeForExt(ext){
  const map = {
    txt:"text/plain", md:"text/markdown", html:"text/html", htm:"text/html",
    css:"text/css", js:"text/javascript", mjs:"text/javascript", cjs:"text/javascript",
    ts:"text/typescript", tsx:"text/typescript", jsx:"text/javascript",
    json:"application/json", csv:"text/csv", xml:"application/xml",
    yaml:"text/yaml", yml:"text/yaml", svg:"image/svg+xml",
    py:"text/x-python", java:"text/x-java", go:"text/x-go", rs:"text/x-rust",
    sh:"text/x-sh", sql:"text/x-sql", tex:"text/x-tex",
    pdf:"application/pdf",
    docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    zip:"application/zip"
  };
  return map[ext] || "text/plain";
}

const _loadedLibs = new Map();
function loadScript(url){
  if (_loadedLibs.has(url)) return _loadedLibs.get(url);
  const p = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = url;
    s.async = true;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error("Could not load " + url));
    document.head.appendChild(s);
  });
  _loadedLibs.set(url, p);
  return p;
}
async function ensureLib(name){
  if (name === "jspdf"){
    if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    return window.jspdf.jsPDF;
  }
  if (name === "docx"){
    if (window.docx && window.docx.Document) return window.docx;
    await loadScript("https://unpkg.com/docx@8.5.0/build/index.js");
    return window.docx;
  }
  if (name === "xlsx"){
    if (window.XLSX) return window.XLSX;
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    return window.XLSX;
  }
  if (name === "jszip"){
    if (window.JSZip) return window.JSZip;
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    return window.JSZip;
  }
  throw new Error("Unknown lib: " + name);
}

function downloadBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function buildBinaryBlob(filename, content){
  const ext = extOf(filename);
  if (ext === "pdf") {
    const jsPDF = await ensureLib("jspdf");
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const lines = doc.splitTextToSize(String(content || ""), 500);
    let y = 48;
    for (const line of lines) {
      if (y > 780) { doc.addPage(); y = 48; }
      doc.text(line, 48, y);
      y += 14;
    }
    return doc.output("blob");
  }
  if (ext === "docx") {
    const docx = await ensureLib("docx");
    const { Document, Packer, Paragraph, TextRun } = docx;
    const paragraphs = String(content || "").split(/\n/).map(line =>
      new Paragraph({ children: [new TextRun(line || " ")] })
    );
    const doc = new Document({ sections: [{ children: paragraphs }] });
    return await Packer.toBlob(doc);
  }
  if (ext === "xlsx" || ext === "xls") {
    const XLSX = await ensureLib("xlsx");
    const rows = String(content || "").split(/\n/).map(r => r.split(/\t|,/));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    return new Blob([out], { type: mimeForExt("xlsx") });
  }
  if (ext === "zip") {
    const JSZip = await ensureLib("jszip");
    const zip = new JSZip();
    zip.file("content.txt", String(content || ""));
    return await zip.generateAsync({ type: "blob" });
  }
  return new Blob([String(content || "")], { type: mimeForExt(ext) });
}

async function downloadFile(filename, content, mime){
  try {
    const ext = extOf(filename);
    let blob;
    if (BINARY_EXTS.has(ext)) {
      toast("Building " + filename + "…");
      blob = await buildBinaryBlob(filename, content);
    } else {
      blob = new Blob([String(content || "")], { type: mime || mimeForExt(ext) });
    }
    downloadBlob(filename, blob);
    toast("Downloading " + filename);
  } catch (e) {
    toast(e.message || "Download failed");
  }
}

function openFilePreview(filename, content, mime){
  const ext = extOf(filename);
  const text = String(content || "");
  const sizeLabel = formatBytes(text.length) || (text.length + " B");

  pushPage(filename, (body) => {
    body.innerHTML = `
      <div class="file-preview-bar">
        <div class="file-preview-meta">
          <b>${escapeHtml(filename)}</b>
          <span>${escapeHtml(sizeLabel)} · ${escapeHtml(ext || "file")}</span>
        </div>
        <button type="button" class="btn-primary" id="fpDownload">Download</button>
      </div>
      <div class="file-preview-body" id="fpBody"></div>
    `;
    const box = body.querySelector("#fpBody");
    if (ext === "html" || ext === "htm") {
      const iframe = document.createElement("iframe");
      iframe.className = "file-preview-iframe";
      iframe.sandbox = "";
      iframe.srcdoc = text;
      box.appendChild(iframe);
    } else if (ext === "svg") {
      box.innerHTML = `<div class="file-preview-svg">${text}</div>`;
    } else if (TEXT_EXTS.has(ext) || !BINARY_EXTS.has(ext)) {
      const pre = document.createElement("pre");
      pre.className = "file-preview-code";
      const code = document.createElement("code");
      code.textContent = text;
      pre.appendChild(code);
      box.appendChild(pre);
      try {
        if (window.hljs) {
          const lang = (ext === "md" || ext === "markdown") ? "markdown" : ext;
          if (hljs.getLanguage(lang)) {
            code.className = "language-" + lang;
            hljs.highlightElement(code);
          } else if (text.length > 20) {
            const result = hljs.highlightAuto(text);
            code.innerHTML = result.value;
            code.classList.add("hljs");
          }
        }
      } catch {}
    } else {
      box.innerHTML = `<div class="admin-note">Binary format (<code>${escapeHtml(ext)}</code>). Use Download to generate the file.</div>`;
    }
    body.querySelector("#fpDownload").onclick = () => downloadFile(filename, text, mime || mimeForExt(ext));
  });
}


async function regenerate(index){
  if(state.generating||!isAuthenticated()||state.messages[index]?.role!=="assistant")return;
  const prior=state.messages.slice(0,index).filter(m=>m.role==="user"||m.role==="assistant");
  if(!prior.length)return;
  state.messages=state.messages.slice(0,index);
  const ai={role:"assistant",content:"",streaming:true,reasoningStartedAt:null,reasoningEndedAt:null,_toolLog:[],requestedModel:state.model,_actualModel:null,_modelSupportsTools:!!(state.models.find(m=>m.id===state.model)?.capabilities?.tools)};state.messages.push(ai);renderMessages();
  state.generating=true;updateGeneratingUI();
  try{await requestCompletion(ai,chatMessages())}
  catch(e){
    if(e.name!=="AbortError"){
      ai.error = true;
      ai.content = isAdminAccount() ? ("Error: " + e.message) : friendlyErrorText(e.message);
      toast("Regeneration failed");
    }
  }
  finally{finalizeAssistantMessage(ai);state.generating=false;updateGeneratingUI();persistCurrentConversation();renderMessages()}
}
function editAndResend(index){
  if(state.generating||!isAuthenticated()||state.messages[index]?.role!=="user")return;
  const old=state.messages[index].content;
  pushPage("Edit message",(body)=>{
    body.innerHTML=`
      <div class="editor-body">
        <div class="editor-section">
          <label for="editPrompt">Message</label>
          <textarea id="editPrompt" class="editor-textarea" placeholder="Type your message…">${escapeHtml(old)}</textarea>
          <div class="editor-hint">Editing this message will remove everything after it in the conversation, then resend.</div>
        </div>
        <div class="editor-actions">
          <button class="btn-ghost" id="editCancel" type="button">Cancel</button>
          <button class="btn-primary" id="editSend" type="button">Resend</button>
        </div>
      </div>
    `;
    body.querySelector("#editCancel").onclick=popPage;
    body.querySelector("#editSend").onclick=async()=>{
      const text=body.querySelector("#editPrompt").value.trim();if(!text)return;
      popPage();
      const oldMsg = state.messages[index];
      state.messages = state.messages.slice(0, index);
      state.messages.push({
        role: "user",
        content: text,
        _modelContent: oldMsg._attachments && oldMsg._attachments.some(a => a.text)
          ? (text + oldMsg._attachments.filter(a => a.text)
              .map(a => `\n\n[Attached file: ${a.name}]\n${a.text}`).join("")).trim()
          : text,
        _attachments: oldMsg._attachments || [],
        _multimodal: oldMsg._multimodal || null,
        _toolContext: oldMsg._toolContext || []
      });
      ensureConversation();persistCurrentConversation();
      const ai={role:"assistant",content:"",streaming:true,reasoningStartedAt:null,reasoningEndedAt:null,_toolLog:[],requestedModel:state.model,_actualModel:null,_modelSupportsTools:!!(state.models.find(m=>m.id===state.model)?.capabilities?.tools)};state.messages.push(ai);renderMessages();
      state.generating=true;updateGeneratingUI();
      try{await requestCompletion(ai,chatMessages())}
      catch(e){
    if(e.name!=="AbortError"){
      ai.error = true;
      ai.content = isAdminAccount() ? ("Error: " + e.message) : friendlyErrorText(e.message);
      toast("Request failed");
    }
  }
      finally{finalizeAssistantMessage(ai);state.generating=false;updateGeneratingUI();persistCurrentConversation();renderMessages()}
    };
  });
}
async function continueGeneration(index){
  if(state.generating||!isAuthenticated()||state.messages[index]?.role!=="assistant"||!state.messages[index].content)return;
  const ai=state.messages[index];ai.streaming=true;ai.error=false;
  if(!Array.isArray(ai._toolLog)) ai._toolLog=[];
  if(!ai.requestedModel) ai.requestedModel = state.model;
  const prior=state.messages.slice(0,index+1).filter(m=>m.role==="user"||m.role==="assistant");
  const continuation={role:"user",content:"Continue the previous answer from exactly where it stopped. Do not repeat content already given."};
  state.generating=true;updateGeneratingUI();renderMessages();
  try{await requestCompletion(ai,chatMessages())}
  catch(e){
    if(e.name!=="AbortError"){
      ai.error = true;
      ai.content = isAdminAccount() ? ("Error: " + e.message) : friendlyErrorText(e.message);
      toast("Continue failed");
    }
  }
  finally{finalizeAssistantMessage(ai);state.generating=false;updateGeneratingUI();persistCurrentConversation();renderMessages()}
}

function renderAttachments(){
  const box = document.getElementById("attachmentStrip") || document.getElementById("attachments") || document.querySelector(".attachment-strip");
  if (!box) return;
  box.classList.add("attachment-strip");
  const list = state.attachments || [];
  if (!list.length) { box.innerHTML = ""; return; }
  box.innerHTML = list.map((a, i) => {
    const name = escapeHtml(a.name || a.filename || "file");
    const isImg = (a.mime || a.type || "").startsWith("image/") || /^data:image\//.test(a.data || a.content || "");
    const src = a.preview || a.dataUrl || (isImg ? (a.data || a.content || "") : "");
    const thumb = isImg && src
      ? `<img src="${src}" alt="">`
      : (ICONS.file || "📄");
    return `<div class="attach-tile" data-attach-idx="${i}">
      <div class="attach-tile-thumb">${thumb}</div>
      <div class="attach-tile-name" title="${name}">${name}</div>
      <button type="button" class="attach-tile-remove" data-remove-attach="${i}" aria-label="Remove">${ICONS.x || "×"}</button>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-remove-attach]").forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const idx = Number(b.dataset.removeAttach);
      state.attachments.splice(idx, 1);
      renderAttachments();
    };
  });
}

function fileIconFor(a){
  const name = (a.name || "").toLowerCase();
  const mime = (a.mime || a.type || "").toLowerCase();
  if (a.kind === "pdf" || mime === "application/pdf" || name.endsWith(".pdf")) return "📕";
  if (/\.(md|markdown)$/.test(name)) return "📝";
  if (/\.(json|yaml|yml|xml|toml)$/.test(name)) return "⚙";
  if (/\.(js|ts|jsx|tsx|py|java|c|cpp|rs|go|rb|php|sh|sql)$/.test(name)) return "⌨";
  if (/\.(csv|xlsx?|numbers)$/.test(name)) return "📊";
  if (/\.(html?|css)$/.test(name)) return "🌐";
  if (/\.(zip|tar|gz|rar)$/.test(name)) return "📦";
  if (/\.(png|jpe?g|gif|webp|svg|bmp)$/.test(name) || mime.startsWith("image/")) return "🖼";
  return "📄";
}
async function readPdfText(file){
  try{
    const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    const data=await file.arrayBuffer();
    const pdf=await pdfjs.getDocument({data}).promise;
    let out="";
    const pages=Math.min(pdf.numPages,30);
    for(let n=1;n<=pages;n++){
      const page=await pdf.getPage(n);
      const tc=await page.getTextContent();
      out+=tc.items.map(x=>x.str||"").join(" ")+"\n";
      if(out.length>=300000)break;
    }
    return out.slice(0,300000)+(pdf.numPages>pages?`\n[PDF truncated after ${pages} pages]`:"");
  }catch(e){throw new Error("PDF text extraction failed. Try a text-based PDF or smaller file.")}
}
function fileDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function handleFiles(files){
  const accepted=[];
  for(const file of Array.from(files).slice(0,5-state.attachments.length)){
    if(file.size>10*1024*1024){toast(`${file.name} is larger than 10 MB`);continue}
    const item={name:file.name,type:file.type,size:file.size,text:"",dataUrl:"",kind:"file"};
    try{
      const lower=file.name.toLowerCase();
      const textLike=/^(text\/|application\/(json|javascript|xml))/i.test(file.type)||/\.(txt|md|markdown|json|csv|js|ts|html|css|xml|yaml|yml|log|py|java|c|cpp|h|hpp|sql|sh|go|rs|php|jsx|tsx|vue)$/i.test(lower);
      if(file.type==="application/pdf"||lower.endsWith(".pdf")){item.kind="pdf";item.text=await readPdfText(file)}
      else if(file.type.startsWith("image/")){item.kind="image";item.dataUrl=await fileDataUrl(file);item.text=`[Image attached: ${file.name}]`}
      else if(textLike){item.kind="text";item.text=(await file.text()).slice(0,300000);if(file.size>300000)item.text+="\n[File content truncated at 300 KB]"}
      else{toast(`${file.name}: unsupported file type`);continue}
      accepted.push(item);
    }catch(e){toast(`${file.name}: ${e.message||"could not read file"}`)}
  }
  state.attachments=state.attachments.concat(accepted).slice(0,5);
  renderAttachments();
}

      const q = (body.querySelector("#personaSearch").value || "").trim().toLowerCase();
      const list = personas.filter(p => !q || p.name.toLowerCase().includes(q));
      const grid = body.querySelector("#personaGrid");
      grid.innerHTML = list.map(p => `
        <div class="persona-card${activeId() === p.id ? " is-active" : ""}" data-persona-id="${escapeHtml(p.id)}">
          <button type="button" class="persona-card-menu" data-persona-menu="${escapeHtml(p.id)}" aria-label="Options">${ICONS.dots}</button>

          <span class="persona-card-desc">${escapeHtml(p.prompt.slice(0, 100))}</span>
        </div>
      `).join("") + `
        <button type="button" class="persona-card persona-card-new" id="personaCreateCard">
          <span class="plus-icon">${ICONS.plus}</span>
          <span>Create new</span>
        </button>`;

      grid.querySelectorAll(".persona-card[data-persona-id]").forEach(card => {
        card.onclick = (e) => {
          if (e.target.closest("[data-persona-menu]")) return;
          const preset = personas.find(x => x.id === card.dataset.personaId);
          if (!preset) return;
          state.persona = { text: preset.prompt, enabled: true, presetId: preset.id };
          savePersona(); renderGrid(); toast(`Persona: ${preset.name}`);
        };
      });

      grid.querySelectorAll("[data-persona-menu]").forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          document.querySelectorAll(".search-provider-menu").forEach(el => el.remove());
          const preset = personas.find(x => x.id === btn.dataset.personaMenu);
          if (!preset) return;
          const menu = document.createElement("div");
          menu.className = "search-provider-menu open";
          menu.style.zIndex = "90";
          menu.innerHTML = `
            <div class="menu-header">${escapeHtml(preset.name)}</div>
            <button type="button" data-act="use">Use persona</button>
            <button type="button" data-act="clear" style="color:var(--danger)">Clear persona</button>`;
          document.body.appendChild(menu);
          const r = btn.getBoundingClientRect();
          menu.style.left = Math.max(8, Math.min(r.right - 200, window.innerWidth - 208)) + "px";
          menu.style.top = Math.min(r.bottom + 6, window.innerHeight - menu.offsetHeight - 8) + "px";
          const close = (ev) => {
            if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener("click", close, true); }
          };
          menu.querySelector("[data-act='use']").onclick = () => {
            menu.remove(); document.removeEventListener("click", close, true);
            state.persona = { text: preset.prompt, enabled: true, presetId: preset.id };
            savePersona(); renderGrid();
          };
          menu.querySelector("[data-act='clear']").onclick = () => {
            menu.remove(); document.removeEventListener("click", close, true);
            state.persona = { text: "", enabled: false, presetId: null };
            savePersona(); renderGrid();
          };
          setTimeout(() => document.addEventListener("click", close, true), 0);
        };
      });

      const create = grid.querySelector("#personaCreateCard");
      if (create) create.onclick = () => openPersonaEditor();
    };

    renderGrid();
    body.querySelector("#personaSearch").addEventListener("input", renderGrid);

    const renderList = () => {
      const q = (body.querySelector("#promptSearch").value || "").trim().toLowerCase();
      const rows = state.savedPrompts.filter(pr => !q || pr.name.toLowerCase().includes(q) || pr.text.toLowerCase().includes(q));
      body.querySelector("#promptList").innerHTML = rows.length
        ? rows.map(pr => `
            <div class="saved-prompt-row">
              <div class="saved-prompt-main"><b>${escapeHtml(pr.name)}</b><span>${escapeHtml(pr.text)}</span></div>
              <div class="saved-prompt-actions">
                <button type="button" data-prompt-use="${escapeHtml(pr.id)}">Insert</button>
                <button type="button" data-prompt-edit="${escapeHtml(pr.id)}">Edit</button>
                <button type="button" data-prompt-del="${escapeHtml(pr.id)}">Delete</button>
              </div>
            </div>`).join("")
        : `<div class="admin-empty">No saved prompts yet.</div>`;
      const list = body.querySelector("#promptList");
      list.querySelectorAll("[data-prompt-use]").forEach(b => b.onclick = () => {
        const pr = state.savedPrompts.find(x => x.id === b.dataset.promptUse);
        if (!pr) return;
        const box = $("#prompt"); box.value = pr.text;
        box.dispatchEvent(new Event("input"));
        closeAllPages(); box.focus();
      });
      list.querySelectorAll("[data-prompt-edit]").forEach(b => b.onclick = () => openSavedPromptEditor(b.dataset.promptEdit));
      list.querySelectorAll("[data-prompt-del]").forEach(b => b.onclick = () => {
        if (!confirm("Delete this saved prompt?")) return;
        state.savedPrompts = state.savedPrompts.filter(x => x.id !== b.dataset.promptDel);
        saveSavedPrompts(); renderList();
      });
    };
    renderList();
    body.querySelector("#promptSearch").addEventListener("input", renderList);
    body.querySelector("#promptAddBtn").onclick = () => openSavedPromptEditor(null);
  });
}

function openSavedPromptEditor(id){

  pushPage(existing?"Edit prompt":"New prompt",(body)=>{
    body.innerHTML=`
      <div class="editor-body">
        <div class="editor-section">

          <input id="spName" class="editor-input" value="${escapeHtml(existing?.name||"")}" maxlength="60" placeholder="e.g. Explain like I'm 5">

        </div>
        <div class="editor-section">
          <label for="spText">Prompt text</label>
          <textarea id="spText" class="editor-textarea" placeholder="Type the full prompt you want to save…">${escapeHtml(existing?.text||"")}</textarea>
          <div class="editor-hint" id="spCounter"></div>
        </div>
        <div class="editor-actions">

          <button class="btn-primary" id="spSave" type="button">${existing?"Save changes":"Create prompt"}</button>
        </div>
      </div>
    `;
    const ta=body.querySelector("#spText");

    body.querySelector("#spCancel").onclick=popPage;
    body.querySelector("#spSave").onclick=()=>{
      const name=body.querySelector("#spName").value.trim(),text=ta.value.trim();

      else{state.savedPrompts=[...state.savedPrompts,{id:"prompt_"+Date.now().toString(36),name,text}]}

      popPage();
      if(pageStack.length && pageStack[pageStack.length-1].title==="Personalities"){
        renderTopPage();
      }
      toast("Prompt saved");

function renderApiKeyCard(k){
  const created = k.createdAt ? new Date(k.createdAt).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "—";
  const lastUsed = k.lastUsedAt ? new Date(k.lastUsedAt).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "Never";
  const revokedAt = k.revokedAt ? new Date(k.revokedAt).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : null;
  const cachedFull = getCachedApiKey(k.id);
  const pill = k.revoked
    ? `<span class="apikey-pill revoked">Revoked</span>`
    : `<span class="apikey-pill active">Active</span>`;
  const keyDisplay = cachedFull ? cachedFull : (k.maskedKey || "crk_live_••••••••");
  const keyClass = cachedFull ? "apikey-card-key has-full" : "apikey-card-key";
  const copyBtn = cachedFull
    ? `<button type="button" class="apikey-copy-icon" data-copy-key-id="${escapeHtml(k.id)}" title="Copy key">${COPY_ICON}</button>`
    : `<button type="button" class="apikey-copy-icon" data-copy-masked="${escapeHtml(k.maskedKey||"")}" title="Only masked key available — copy masked">${COPY_ICON}</button>`;
  const actions = [];
  if(!k.revoked){
    actions.push(`<button type="button" data-rename-key="${escapeHtml(k.id)}">Rename</button>`);
    actions.push(`<button type="button" class="danger" data-revoke-key="${escapeHtml(k.id)}">Revoke</button>`);
  }
  return `
    <div class="apikey-card${k.revoked?" is-revoked":""}" data-key-id="${escapeHtml(k.id)}">
      <div class="apikey-card-head">
        <div class="apikey-card-title">${escapeHtml(k.label || "Unnamed key")}</div>
        ${pill}
      </div>
      <div class="${keyClass}">
        <code>${escapeHtml(keyDisplay)}</code>
        ${copyBtn}
      </div>
      <div class="apikey-card-meta">
        <span>Created <b>${escapeHtml(created)}</b></span>
        <span>Last used <b>${escapeHtml(lastUsed)}</b></span>
        ${revokedAt ? `<span>Revoked <b>${escapeHtml(revokedAt)}</b></span>` : ``}
      </div>
      ${actions.length ? `<div class="apikey-card-actions">${actions.join("")}</div>` : ``}
    </div>
  `;
}

function wireApiKeyActions(container, rerender){
  container.querySelectorAll("[data-copy-key-id]").forEach(b=>b.onclick=()=>{
    const full = getCachedApiKey(b.dataset.copyKeyId);
    if(!full){toast("Full key not available on this device");return}
    copyText(full);
    flashCopyIcon(b);
  });
  container.querySelectorAll("[data-copy-masked]").forEach(b=>b.onclick=()=>{
    copyText(b.dataset.copyMasked);
    flashCopyIcon(b);
  });
  container.querySelectorAll("[data-revoke-key]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Revoke this API key? Any app using it will stop working immediately."))return;
    try{
      const r=await apiFetch(WORKER_BASE+"/apikeys/revoke",{method:"POST",headers:authHeaders(),body:JSON.stringify({id:b.dataset.revokeKey})});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error?.message||"Could not revoke key.")}
      clearCachedApiKey(b.dataset.revokeKey);
      toast("Key revoked");rerender();
    }catch(e){toast(e.message||"Could not revoke key.")}
  });
  container.querySelectorAll("[data-rename-key]").forEach(b=>b.onclick=async()=>{
    const card=b.closest(".apikey-card");
    const currentTitle=card.querySelector(".apikey-card-title").textContent;
    const newLabel=prompt("Rename this key:",currentTitle);
    if(newLabel===null)return;
    const clean=newLabel.trim().slice(0,80);
    if(!clean){toast("Label required");return}
    // The backend doesn't expose a rename endpoint — we keep the
    // new label locally via cached overrides.
    try{ localStorage.setItem("chinaGPTApiKeyLabel_"+b.dataset.renameKey, clean) }catch{}
    toast("Label updated locally");
    rerender();
  });
}
function createApiKey(rerender){
  const label=prompt("Label for this key (optional, e.g. \"My website\"):")||"";
  (async()=>{
    try{
      const r=await apiFetch(WORKER_BASE+"/apikeys/create",{method:"POST",headers:authHeaders(),body:JSON.stringify({label})});
      if(!r.ok){
        if(r.status===404){toast("The API-key service isn't deployed on your backend yet.");return}
        const j=await r.json().catch(()=>({}));throw new Error(j.error?.message||"Could not create key.");
      }
      const j=await r.json();
      if(j.key && j.id) cacheApiKey(j.id, j.key);
      pushPage("API key created",(body)=>{
        body.innerHTML=`
          <div class="apikey-created-warning">
            <b>Copy this key now.</b> For security, it is only shown once. You can still copy it from this browser later, but not from another device.

          <div class="apikey-created-value" id="newKeyValue">${escapeHtml(j.key||"")}</div>

            <button class="btn-ghost" id="newKeyCopy" type="button">Copy</button>

        `;

        body.querySelector("#newKeyDone").onclick=()=>{
          popPage();
          if(typeof rerender==="function") rerender();

      });
    }catch(e){toast(e.message||"Could not create key.")}
  })();
}

async function loginWithCode(code){
  const r = await fetch(WORKER_BASE + "/auth/login", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code })
  });
  let j = {};
  try { j = await r.json(); } catch {}

  console.log("[login] status:", r.status, "body:", j);

  if (!r.ok || !j.ok) throw new Error(j.error || "Invalid access key");

  const c = String(j.code || "").trim();
  if (!c) {
    console.error("Login succeeded but response has no code:", j);
    throw new Error("Server did not return an access code");
  }
  setAuth(c, j.role);
  return j;
}

function openLogin(reason){
  openAuthPage(`
    <div class="auth-head">
      <div class="auth-brand"><span class="logo logo-sm">${LOGO_SVG}</span><b>China-GPT</b></div>
      <button class="auth-back" id="loginClose" type="button">Back</button>
    </div>
    <h2>Enter your access key</h2>
    <p class="auth-sub">Use your China-GPT access key to log in.</p>
    <div class="field">
      <label for="accessCodeField">Access key</label>
      <input id="accessCodeField" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXX-XXXX">
    </div>
    <button class="auth-primary" id="loginBtn" type="button">Log in</button>
    <div class="auth-link-row">Don't have an account? <button id="createAccountLink" type="button">Create one</button></div>
    <p class="auth-error" id="loginError"></p>
  `);
  $("#loginClose").onclick=closeAuthPage;
  $("#createAccountLink").onclick=()=>openCreateAccount();
  setTimeout(()=>$("#accessCodeField").focus(),80);
  const submit=async()=>{
    const code=$("#accessCodeField").value.trim().toUpperCase();
    if(!code){$("#loginError").textContent="Enter your access key.";return}
    $("#loginBtn").disabled=true; $("#loginBtn").textContent="Logging in…"; $("#loginError").textContent="";
    try{
      const j=await loginWithCode(code);
      if (!state.profileName && j.username) {
        state.profileName = j.username;
        try { localStorage.setItem("chinaGPTProfileName", j.username); } catch {}
      }
      closeAuthPage();
      toast(j.role==="admin"?"Admin access granted":"Logged in");
      await refreshAdminLockBanner();
      await loadModels();
      await loadSearchConfig();
      await loadProviderOverrides();
      updateAccountBadge();
      if(reason==="send")send();
    }catch(e){$("#loginError").textContent=e.message||"Invalid access key"}
    finally{const b=$("#loginBtn");if(b){b.disabled=false;b.textContent="Log in"}}
  };
  $("#loginBtn").onclick=submit;
  $("#accessCodeField").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
}

async function openCreateAccount(){
  openAuthPage(`

      <div class="auth-brand"><span class="logo logo-sm">${LOGO_SVG}</span><b>China-GPT</b></div>

  `);

  $("#createClose").onclick = closeAuthPage;
  $("#backLogin").onclick = () => openLogin("login");

  const nameInput = $("#createUsername");
  const goBtn = $("#generateAccount");
  const errBox = document.getElementById("createErr") || (() => {
    const p = document.createElement("p");
