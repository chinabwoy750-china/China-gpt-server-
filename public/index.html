const pageStack=[];
function pushPage(title,renderFn){
  pageStack.push({title,renderFn});
  renderTopPage();
}
function popPage(){
  pageStack.pop();
  renderTopPage();
}
function closeAllPages(){
  pageStack.length=0;
  renderTopPage();
}
function renderTopPage(){
  const el=$("#screenPage");
  if(pageStack.length===0){ el.classList.remove("open"); return; }
  const top=pageStack[pageStack.length-1];
  $("#screenPageTitle").textContent=top.title;
  const body=$("#screenPageBody");
  body.innerHTML="";
  body.scrollTop=0;
  top.renderFn(body);
  el.classList.add("open");
}

async function loadModels(){
  try{
    const r=await fetch(API_BASE+"/models",{headers:authHeaders(false)});
    if(r.status===401||r.status===403){clearAuth();updateBadge();openLogin("models");return}
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); state.models=Array.isArray(j.data)?j.data:[];
    if(!state.model || !state.models.some(m=>m.id===state.model)) state.model=state.models[0]?.id||"";
    localStorage.setItem("chinaGPTModel",state.model); updateBadge(); refreshCatalogIfOpen();
    if (typeof warmIconCache === "function") warmIconCache();
  }catch(e){updateBadge();toast("Could not load models.")}
}
function updateBadge(){
  const label=$("#modelLabel");
  if(label) label.textContent=state.model?cleanModelName(state.model):"Pick a model";
  const chipText=$("#composerChipText");
  const chipIcon=$("#composerChipIcon");
  if(chipText) chipText.textContent=state.model?cleanModelName(state.model):"Pick a model";
  if(chipIcon){
    chipIcon.removeAttribute("data-letter");
    if(state.model){
      const maker=makerOf(state.model);
      const c=providerColor(maker.key);
      chipIcon.style.color=c;
      chipIcon.innerHTML=renderChipIcon(maker.key);
    } else {
      chipIcon.style.color="";
      chipIcon.innerHTML="?";
    }
  }
  updateAccountBadge();
}

function renderMarkdownSafe(text){
  try{
    if(window.marked&&window.DOMPurify){
      marked.setOptions({breaks:true,gfm:true});
      const raw=marked.parse(text);
      return DOMPurify.sanitize(raw,{ADD_ATTR:["target","rel"]});
    }
  }catch(e){}

/* ============================================================
   CHAT / STREAMING
   ============================================================ */
function activeSystemPrompt(){
  if(state.persona&&state.persona.enabled&&state.persona.text&&state.persona.text.trim()) return state.persona.text.trim();
  return "";
}
function chatMessages(){
  const base=state.messages.filter(m=>m.role==="user"||m.role==="assistant").map(m=>({role:m.role,content:m.content||m.displayText||""}));
  const sys=activeSystemPrompt();
  return sys?[{role:"system",content:sys},...base]:base;
}
async function readCompletionResponse(response,onChunk,onReasoning){
  if(!response.ok){let msg="";try{msg=await response.text()}catch{};throw new Error("HTTP "+response.status+(msg?" — "+msg:""))}
  const type=response.headers.get("content-type")||"";
  if(!response.body)return null;
  if(!type.includes("text/event-stream")){
    const j=await response.json();
    const msg=j.choices?.[0]?.message;
    const r=msg?.reasoning_content||msg?.reasoning;
    if(r&&onReasoning)onReasoning(r);
    if(msg?.content) onChunk(msg.content);
    return j.usage||null;
  }
  const reader=response.body.getReader(),decoder=new TextDecoder();let buf="",usage=null;
  while(true){
    const {value,done}=await reader.read();if(done)break;
    buf+=decoder.decode(value,{stream:true});
    const lines=buf.split(/\r?\n/);buf=lines.pop()||"";
    for(const line of lines){
      if(!line.startsWith("data:"))continue;
      const raw=line.slice(5).trim();
      if(!raw||raw==="[DONE]")continue;
      try{
        const j=JSON.parse(raw);const delta=j.choices?.[0]?.delta;
        const rc=delta?.reasoning_content||delta?.reasoning;
        if(rc&&onReasoning)onReasoning(rc);
        const c=delta?.content;if(c)onChunk(c);
        if(j.usage)usage=j.usage;
      }catch{}
    }
  }
  return usage;
}
async function requestCompletion(target, messages, model=state.model){
  state.abortController=new AbortController();
  const body={model,messages,stream:true};
  const streamState = newStreamState();
  try{
    const r=await fetch(API_BASE+"/chat/completions",{
      method:"POST",headers:authHeaders(),body:JSON.stringify(body),signal:state.abortController.signal
    });
    const result = await readCompletionResponse(r,
      c=>{
        const parsed = parseReasoningStream(streamState, c);
        if(parsed.reasoning){
          if(!target.reasoningStartedAt) target.reasoningStartedAt = Date.now();
          target.reasoning = (target.reasoning||"") + parsed.reasoning;
        }
        if(parsed.content) target.content += parsed.content;
        updateStreamingMessage(target);
      },
      rc=>{
        if(!target.reasoningStartedAt) target.reasoningStartedAt=Date.now();
        target.reasoning=(target.reasoning||"")+rc;
        updateStreamingMessage(target);
      }
    );
    const tail = flushReasoningStream(streamState);
    if(tail.reasoning){
      if(!target.reasoningStartedAt) target.reasoningStartedAt = Date.now();
      target.reasoning = (target.reasoning||"") + tail.reasoning;
    }
    if(tail.content) target.content += tail.content;
    updateStreamingMessage(target);
    return result;
  }finally{state.abortController=null;}
}
function finalizeAssistantMessage(ai){
  if(ai.reasoningStartedAt && !ai.reasoningEndedAt){
    ai.reasoningEndedAt=Date.now();
  }
  ai.streaming=false;
}
function updateGeneratingUI(){
  const stop=$("#stopBtn"),sendBtn=$("#sendBtn");
  if(stop)stop.style.display=state.generating?"inline-flex":"none";
  if(sendBtn)sendBtn.style.display=state.generating?"none":"grid";
}
function stopGeneration(){
  if(!state.generating)return;
  try{state.abortController&&state.abortController.abort()}catch{}
  state.generating=false;
  const last=state.messages[state.messages.length-1];
  if(last&&last.role==="assistant")finalizeAssistantMessage(last);
  updateGeneratingUI();persistCurrentConversation();renderMessages();toast("Generation stopped");
}
async function send(){
  const input=$("#prompt"),text=input.value.trim();
  if(!text&&!state.attachments.length)return;
  if(!isAuthenticated()){openLogin("send");return}
  if(!state.model){toast("No model selected.");return}
  if(state.generating){toast("A response is already generating.");return}

  const attachmentText=state.attachments.filter(a=>a.text).map(a=>`\n\n[Attached file: ${a.name}]\n${a.text}`).join("");
  const finalText=(text+attachmentText).trim();
  if(!finalText){toast("This file type cannot be sent as text.");return}

  // Build the user's persisted message first.
  const userMsg = { role:"user", content: finalText };

  ensureConversation();
  input.value="";input.style.height="";
  state.messages.push(userMsg);
  const ai={role:"assistant",content:"",streaming:true,reasoningStartedAt:null,reasoningEndedAt:null};
  state.messages.push(ai);
  state.attachments=[];renderAttachments();

  // If web search is on, insert a "searching" placeholder into the
  // assistant bubble so the user sees progress.
  if (state.webSearch && text) {
    ai._searching = true;
    renderMessages();
    const result = await performWebSearch(text);
    ai._searching = false;
    if (result && (result.answer || result.sources.length)) {
      userMsg._search = {
        answer: result.answer,
        sources: result.sources
      };
    } else {
      toast("Web search returned no usable results — sending anyway");
    }
  }

  renderMessages();persistCurrentConversation();

  state.generating=true;updateGeneratingUI();
  try{await requestCompletion(ai, chatMessagesWithSearch())}
  catch(e){
    if(e.name!=="AbortError"){
      ai.error = true;
      ai.content = isAdminAccount() ? ("Error: " + e.message) : friendlyErrorText(e.message);
      toast("Request failed");
    }
  }
  finally{finalizeAssistantMessage(ai);state.generating=false;updateGeneratingUI();persistCurrentConversation();renderMessages()}
}

/* Like chatMessages(), but injects any captured web-search
   context as a system message before the user's turn. */
function chatMessagesWithSearch(){
  const base = [];
  for (const m of state.messages) {
    if (m.role === "user") {
      if (m._search && (m._search.answer || (m._search.sources && m._search.sources.length))) {
        base.push({
          role: "system",
          content: buildSearchContextMessage(m.content, m._search)
        });
      }
      base.push({ role: "user", content: m.content });
    } else if (m.role === "assistant") {
      base.push({ role: "assistant", content: m.content || "" });
    }
  }
  const sys = activeSystemPrompt();
  return sys ? [{ role:"system", content: sys }, ...base] : base;
}

/* ============================================================
   WEB SEARCH (via 9Router's /v1/search)
   ============================================================
   Returns { answer, sources, raw } on success, null on failure.
   Never throws — the chat must always be able to proceed without
   web context even if search fails. */
async function performWebSearch(query){
  try{
    const r = await fetch(API_BASE + "/search", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({
        model: resolveSearchProvider(),
        query,
        search_type: "web",
        max_results: 5
      })
    });
    if (!r.ok) return null;
    const j = await r.json();
    const answerText = j && j.answer && typeof j.answer.text === "string" ? j.answer.text : "";
    const results = Array.isArray(j && j.results) ? j.results : [];
    const sources = results
      .map(x => ({
        title: (x.title || "").trim() || "Source",
        url: (x.url || "").trim()
      }))
      .filter(x => x.url);
    return {
      answer: answerText,
      sources,
      raw: j
    };
  } catch (e) {
    return null;
  }
}

async function loadSearchConfig(){

function resolveSearchProvider(){
  const available = state.searchConfig.providers || [];
  if (state.searchProvider && available.includes(state.searchProvider)) return state.searchProvider;
  return state.searchConfig.defaultProvider || available[0] || "gemini";
}
function providerDisplayName(slug){
  if (!slug) return "Search";
  return String(slug).charAt(0).toUpperCase() + String(slug).slice(1);
}
function updateSearchProviderUI(){
  const pill = $("#searchProviderPill");
  const label = $("#searchProviderLabel");
  if (!pill || !label) return;
  if (!state.webSearch) { pill.style.display = "none"; return; }
  const available = state.searchConfig.providers || [];

function openSearchProviderMenu(anchorEl){
  document.querySelectorAll(".search-provider-menu").forEach(el => el.remove());

  const menu = document.createElement("div");
  menu.className = "search-provider-menu";
  const providers = state.searchConfig.providers || [];
  const current = resolveSearchProvider();

  menu.innerHTML = `<div class="menu-header">Search provider</div>` + providers.map(p => `
    <button type="button" data-pick-provider="${escapeHtml(p)}">
      <span>${escapeHtml(providerDisplayName(p))}</span>
      ${p === current ? `<span class="check">✓</span>` : ``}
    </button>
  `).join("");

  document.body.appendChild(menu);

  const r = anchorEl.getBoundingClientRect();
  const width = menu.offsetWidth || 180;
  let left = Math.max(10, Math.min(r.right - width, window.innerWidth - width - 10));
  let top = r.top - menu.offsetHeight - 8;
  if (top < 10) top = Math.min(r.bottom + 8, window.innerHeight - menu.offsetHeight - 10);
  menu.style.left = left + "px";
  menu.style.top = Math.max(10, top) + "px";
  menu.classList.add("open");

  menu.querySelectorAll("[data-pick-provider]").forEach(b => b.onclick = () => {
    const picked = b.dataset.pickProvider;
    state.searchProvider = picked;
    localStorage.setItem("chinaGPTSearchProvider", picked);
    menu.remove();
    updateSearchProviderUI();
    toast(`Search provider: ${providerDisplayName(picked)}`);
  });

  const closeOnOutside = (e) => {
    if (!menu.contains(e.target) && e.target !== anchorEl && !anchorEl.contains(e.target)) {
      menu.remove();
      document.removeEventListener("click", closeOnOutside, true);
    }
  };
  setTimeout(() => document.addEventListener("click", closeOnOutside, true), 0);
}

/* Build the system-message context we prepend before the user's
   actual message, so the picked model answers with fresh context. */
function buildSearchContextMessage(query, searchResult){
  const lines = [];
  lines.push(`[Web search results]`);
  lines.push(`Query: ${query}`);
  if (searchResult.answer) {
    lines.push("");
    lines.push("Summary:");
    lines.push(searchResult.answer.trim());
  }
  if (searchResult.sources.length) {
    lines.push("");
    lines.push("Sources:");
    searchResult.sources.forEach((s, i) => {
      lines.push(`${i + 1}. ${s.title} — ${s.url}`);
    });
  }
  lines.push(`[End web search results]`);
  lines.push("");
  lines.push("Use the above context to answer the user's question. Cite source numbers when relevant.");
  return lines.join("\n");
}

async function regenerate(index){
  if(state.generating||!isAuthenticated()||state.messages[index]?.role!=="assistant")return;
  const prior=state.messages.slice(0,index).filter(m=>m.role==="user"||m.role==="assistant");
  if(!prior.length)return;
  state.messages=state.messages.slice(0,index);
  const ai={role:"assistant",content:"",streaming:true,reasoningStartedAt:null,reasoningEndedAt:null};state.messages.push(ai);renderMessages();
  state.generating=true;updateGeneratingUI();
  try{await requestCompletion(ai,prior)}
  catch(e){
    if(e.name!=="AbortError"){
      ai.error = true;
      ai.content = isAdminAccount() ? ("Error: " + e.message) : friendlyErrorText(e.message);
      toast("Regeneration failed");
    }
  }
  finally{finalizeAssistantMessage(ai);state.generating=false;updateGeneratingUI();persistCurrentConversation();renderMessages()}
}

  }
      finally{finalizeAssistantMessage(ai);state.generating=false;updateGeneratingUI();persistCurrentConversation();renderMessages()}
    };

async function continueGeneration(index){
  if(state.generating||!isAuthenticated()||state.messages[index]?.role!=="assistant"||!state.messages[index].content)return;
  const ai=state.messages[index];ai.streaming=true;ai.error=false;
  const prior=state.messages.slice(0,index+1).filter(m=>m.role==="user"||m.role==="assistant");
  const continuation={role:"user",content:"Continue the previous answer from exactly where it stopped. Do not repeat content already given."};
  state.generating=true;updateGeneratingUI();renderMessages();
  try{await requestCompletion(ai,[...prior,continuation])}
  catch(e){
    if(e.name!=="AbortError"){
      ai.error = true;
      ai.content = isAdminAccount() ? ("Error: " + e.message) : friendlyErrorText(e.message);
      toast("Continue failed");
    }
  }
  finally{finalizeAssistantMessage(ai);state.generating=false;updateGeneratingUI();persistCurrentConversation();renderMessages()}
}

function renderAttachments(){

async function readPdfText(file){
  try{
    const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    const data=await file.arrayBuffer();
    const pdf=await pdfjs.getDocument({data}).promise;
    let out="";
    const pages=Math.min(pdf.numPages,30);
    for(let n=1;n<=pages;n++){
      const page=await pdf.getPage(n);
      const tc=await page.getTextContent();
      out+=tc.items.map(x=>x.str||"").join(" ")+"\n";
      if(out.length>=300000)break;
    }
    return out.slice(0,300000)+(pdf.numPages>pages?`\n[PDF truncated after ${pages} pages]`:"");
  }catch(e){throw new Error("PDF text extraction failed. Try a text-based PDF or smaller file.")}
}
function fileDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function handleFiles(files){
  const accepted=[];
  for(const file of Array.from(files).slice(0,5-state.attachments.length)){
    if(file.size>10*1024*1024){toast(`${file.name} is larger than 10 MB`);continue}
    const item={name:file.name,type:file.type,size:file.size,text:"",dataUrl:"",kind:"file"};
    try{
      const lower=file.name.toLowerCase();
      const textLike=/^(text\/|application\/(json|javascript|xml))/i.test(file.type)||/\.(txt|md|markdown|json|csv|js|ts|html|css|xml|yaml|yml|log|py|java|c|cpp|h|hpp|sql|sh|go|rs|php|jsx|tsx|vue)$/i.test(lower);
      if(file.type==="application/pdf"||lower.endsWith(".pdf")){item.kind="pdf";item.text=await readPdfText(file)}
      else if(file.type.startsWith("image/")){item.kind="image";item.dataUrl=await fileDataUrl(file);item.text=`[Image attached: ${file.name}]`}
      else if(textLike){item.kind="text";item.text=(await file.text()).slice(0,300000);if(file.size>300000)item.text+="\n[File content truncated at 300 KB]"}
      else{toast(`${file.name}: unsupported file type`);continue}
      accepted.push(item);
    }catch(e){toast(`${file.name}: ${e.message||"could not read file"}`)}
  }
  state.attachments=state.attachments.concat(accepted).slice(0,5);
  renderAttachments();
}

function openSavedPromptEditor(id){
  const existing=id?state.savedPrompts.find(p=>p.id===id):null;
  pushPage(existing?"Edit prompt":"New prompt",(body)=>{
    body.innerHTML=`
      <div class="editor-body">
        <div class="editor-section">
          <label for="spName">Name</label>
          <input id="spName" class="editor-input" value="${escapeHtml(existing?.name||"")}" maxlength="60" placeholder="e.g. Explain like I'm 5">
          <div class="editor-hint">A short label you'll see in the prompt list.</div>
        </div>
        <div class="editor-section">
          <label for="spText">Prompt text</label>
          <textarea id="spText" class="editor-textarea" placeholder="Type the full prompt you want to save…">${escapeHtml(existing?.text||"")}</textarea>
          <div class="editor-hint" id="spCounter"></div>
        </div>
        <div class="editor-actions">
          <button class="btn-ghost" id="spCancel" type="button">Cancel</button>
          <button class="btn-primary" id="spSave" type="button">${existing?"Save changes":"Create prompt"}</button>
        </div>
      </div>
    `;
    const ta=body.querySelector("#spText");
    const counter=body.querySelector("#spCounter");
    const updateCounter=()=>{counter.textContent=`${ta.value.length} characters`};
    ta.addEventListener("input",updateCounter);updateCounter();
    body.querySelector("#spCancel").onclick=popPage;
    body.querySelector("#spSave").onclick=()=>{
      const name=body.querySelector("#spName").value.trim(),text=ta.value.trim();
      if(!name||!text){toast("Name and prompt text are required");return}
      if(existing){state.savedPrompts=state.savedPrompts.map(p=>p.id===existing.id?{...p,name,text}:p)}
      else{state.savedPrompts=[...state.savedPrompts,{id:"prompt_"+Date.now().toString(36),name,text}]}
      saveSavedPrompts();
      popPage();
      if(pageStack.length && pageStack[pageStack.length-1].title==="Personalities"){
        renderTopPage();
      }
      toast("Prompt saved");
    };
  });
}

function renderApiKeyCard(k){
  const created = k.createdAt ? new Date(k.createdAt).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "—";
  const lastUsed = k.lastUsedAt ? new Date(k.lastUsedAt).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "Never";
  const revokedAt = k.revokedAt ? new Date(k.revokedAt).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : null;
  const cachedFull = getCachedApiKey(k.id);
  const pill = k.revoked
    ? `<span class="apikey-pill revoked">Revoked</span>`
    : `<span class="apikey-pill active">Active</span>`;
  const keyDisplay = cachedFull ? cachedFull : (k.maskedKey || "crk_live_••••••••");
  const keyClass = cachedFull ? "apikey-card-key has-full" : "apikey-card-key";
  const copyBtn = cachedFull
    ? `<button type="button" class="apikey-copy-icon" data-copy-key-id="${escapeHtml(k.id)}" title="Copy key">${COPY_ICON}</button>`
    : `<button type="button" class="apikey-copy-icon" data-copy-masked="${escapeHtml(k.maskedKey||"")}" title="Only masked key available — copy masked">${COPY_ICON}</button>`;
  const actions = [];
  if(!k.revoked){
    actions.push(`<button type="button" data-rename-key="${escapeHtml(k.id)}">Rename</button>`);
    actions.push(`<button type="button" class="danger" data-revoke-key="${escapeHtml(k.id)}">Revoke</button>`);
  }
  return `
    <div class="apikey-card${k.revoked?" is-revoked":""}" data-key-id="${escapeHtml(k.id)}">
      <div class="apikey-card-head">
        <div class="apikey-card-title">${escapeHtml(k.label || "Unnamed key")}</div>
        ${pill}
      </div>
      <div class="${keyClass}">
        <code>${escapeHtml(keyDisplay)}</code>
        ${copyBtn}
      </div>
      <div class="apikey-card-meta">
        <span>Created <b>${escapeHtml(created)}</b></span>
        <span>Last used <b>${escapeHtml(lastUsed)}</b></span>
        ${revokedAt ? `<span>Revoked <b>${escapeHtml(revokedAt)}</b></span>` : ``}
      </div>
      ${actions.length ? `<div class="apikey-card-actions">${actions.join("")}</div>` : ``}
    </div>
  `;
}

function wireApiKeyActions(container, rerender){
  container.querySelectorAll("[data-copy-key-id]").forEach(b=>b.onclick=()=>{
    const full = getCachedApiKey(b.dataset.copyKeyId);
    if(!full){toast("Full key not available on this device");return}
    copyText(full);
    flashCopyIcon(b);
  });
  container.querySelectorAll("[data-copy-masked]").forEach(b=>b.onclick=()=>{
    copyText(b.dataset.copyMasked);
    flashCopyIcon(b);
  });
  container.querySelectorAll("[data-revoke-key]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Revoke this API key? Any app using it will stop working immediately."))return;
    try{
      const r=await fetch(WORKER_BASE+"/apikeys/revoke",{method:"POST",headers:authHeaders(),body:JSON.stringify({id:b.dataset.revokeKey})});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error?.message||"Could not revoke key.")}
      clearCachedApiKey(b.dataset.revokeKey);
      toast("Key revoked");rerender();
    }catch(e){toast(e.message||"Could not revoke key.")}
  });
  container.querySelectorAll("[data-rename-key]").forEach(b=>b.onclick=async()=>{
    const card=b.closest(".apikey-card");
    const currentTitle=card.querySelector(".apikey-card-title").textContent;
    const newLabel=prompt("Rename this key:",currentTitle);
    if(newLabel===null)return;
    const clean=newLabel.trim().slice(0,80);
    if(!clean){toast("Label required");return}
    // The backend doesn't expose a rename endpoint — we keep the
    // new label locally via cached overrides.
    try{ localStorage.setItem("chinaGPTApiKeyLabel_"+b.dataset.renameKey, clean) }catch{}
    toast("Label updated locally");
    rerender();
  });
}
function createApiKey(rerender){
  const label=prompt("Label for this key (optional, e.g. \"My website\"):")||"";
  (async()=>{
    try{
      const r=await fetch(WORKER_BASE+"/apikeys/create",{method:"POST",headers:authHeaders(),body:JSON.stringify({label})});
      if(!r.ok){
        if(r.status===404){toast("The API-key service isn't deployed on your backend yet.");return}
        const j=await r.json().catch(()=>({}));throw new Error(j.error?.message||"Could not create key.");
      }
      const j=await r.json();
      if(j.key && j.id) cacheApiKey(j.id, j.key);
      pushPage("API key created",(body)=>{
        body.innerHTML=`
          <div class="apikey-created-warning">
            <b>Copy this key now.</b> For security, it is only shown once. You can still copy it from this browser later, but not from another device.
          </div>
          <div class="apikey-created-value" id="newKeyValue">${escapeHtml(j.key||"")}</div>
          <div class="row" style="margin-top:12px">
            <button class="btn-ghost" id="newKeyCopy" type="button">Copy</button>
            <button class="btn-primary" id="newKeyDone" type="button">Done</button>
          </div>
        `;
        body.querySelector("#newKeyCopy").onclick=()=>{copyText(j.key||"");toast("Copied")};
        body.querySelector("#newKeyDone").onclick=()=>{
          popPage();
          if(typeof rerender==="function") rerender();
        };
      });
    }catch(e){toast(e.message||"Could not create key.")}
  })();
}

          block.querySelector("#docsBaseUrlCancel").onclick=render;
          block.querySelector("#docsBaseUrlSave").onclick=async()=>{
            const url=input.value.trim();
            if(!url){toast("Enter a URL");return}
            const ok=await saveApiBaseUrl(url);
            if(ok){toast("Base URL saved");render()}
          };
          input.addEventListener("keydown",e=>{
            if(e.key==="Enter"){e.preventDefault();block.querySelector("#docsBaseUrlSave").click()}
            else if(e.key==="Escape"){e.preventDefault();render()}
          });
        };
      }
    };
    // Pull fresh from Redis every time the docs open
    (async()=>{
      await loadApiBaseUrl();
      render();
    })();
  });
}

async function loginWithCode(code){
  const r=await fetch(WORKER_BASE+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})});
  let j={}; try{j=await r.json()}catch{}

async function copyText(text){
  try{await navigator.clipboard.writeText(text)}
  catch{
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch{}ta.remove();
  }
  toast("Copied");
}

async function loadAdminAccounts(options={}){
  if(!isAuthenticated()||state.role!=="admin") throw new Error("Administrator access required");
  if(options.reset!==false) adminAccountsCursor=null;

  params.set("limit","100");
  if(adminAccountsCursor) params.set("cursor",adminAccountsCursor);
  if(adminAccountsSearch.trim()) params.set("search",adminAccountsSearch.trim());
  if(adminAccountsRole!=="all") params.set("role",adminAccountsRole);
  if(adminAccountsStatus!=="all") params.set("status",adminAccountsStatus);
  const r=await fetch(WORKER_BASE+"/admin/accounts?"+params.toString(),{headers:authHeaders(false)});
  let j={}; try{j=await r.json()}catch{}
  if(!r.ok||!j.ok) throw new Error(j.error?.message||j.error||"Could not load accounts");
  if(options.append) adminAccountsData=adminAccountsData.concat(j.accounts||[]);

async function renderProviderIconsPage(){
  const c = $("#adminContent");
  c.innerHTML = `<p class="admin-kicker">Loading providers…</p>`;

  // Make sure the model list is available; fall back to the current list.
  if (!state.models.length && isAuthenticated()) {
    try { await loadModels(); } catch {}
  }
  // Pull the current overrides from the backend.
  try {
    const r = await fetch(WORKER_BASE + "/admin/provider-icons", { headers: authHeaders(false) });
    if (r.ok) {
      const j = await r.json();
      adminIconOverrides = (j && j.icons) || {};
    }
  } catch {}

  const providers = [...new Set(state.models.map(m => makerOf(m.id).key))].sort((a,b)=>providerLabel(a).localeCompare(providerLabel(b)));

  if (!providers.length) {
    c.innerHTML = `<p class="admin-kicker">No models loaded. Provider icons will appear once the catalogue is available.</p>`;
    return;
  }

  const rows = providers.map(k => {
    const color = providerColor(k);
    const tint = hexToRgba(color, .16);
    const border = hexToRgba(color, .35);
    const url = providerIconUrl(k);
    const override = adminIconOverrides[k] || "";
    const status = override
      ? `<span class="provider-row-status override">Override</span>`
      : url
        ? `<span class="provider-row-status ok">Auto</span>`
        : `<span class="provider-row-status missing">No icon</span>`;
    const preview = url
      ? `<span class="tile tile-lg" style="background:${tint};color:${color};border:1px solid ${border}"><span class="tile-icon" style="--icon-url:url('${url}')"></span></span>`
      : `<span class="tile tile-lg" style="background:${tint};color:${color};border:1px solid ${border}">${safeLetter(k)}</span>`;
    return `
      <div class="provider-row" data-provider="${escapeHtml(k)}">
        ${preview}
        <div class="provider-row-main">
          <b>${escapeHtml(providerLabel(k))}</b>
          <small>${escapeHtml(k)}</small>
        </div>
        ${status}
        <div class="provider-row-input">
          <input placeholder="https://example.com/icon.svg" value="${escapeHtml(override)}" data-provider-input="${escapeHtml(k)}">
          <button class="btn-primary" type="button" data-save-icon="${escapeHtml(k)}">Save</button>
          ${override ? `<button class="btn-ghost" type="button" data-clear-icon="${escapeHtml(k)}">Clear</button>` : ``}
        </div>
      </div>`;
  }).join("");

  c.innerHTML = `
    <p class="admin-kicker">Paste a custom icon URL for any provider. Overrides take priority over the automatic Lobe&nbsp;→&nbsp;Simple&nbsp;Icons&nbsp;→&nbsp;models.dev chain. Clear an override to fall back to auto-resolution.</p>
    <div class="provider-grid">${rows}</div>
  `;

  c.querySelectorAll("[data-save-icon]").forEach(btn => btn.onclick = async () => {
    const provider = btn.dataset.saveIcon;
    const input = c.querySelector(`[data-provider-input="${CSS.escape(provider)}"]`);
    const url = (input?.value || "").trim();
    try {
      const r = await fetch(WORKER_BASE + "/admin/provider-icons", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ provider, url })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Save failed");
      adminIconOverrides = j.icons || {};
      // Invalidate the cache for this provider so the preview refreshes.
      iconCache.delete(provider);
      // Resolve fresh, then re-render.
      const slug = slugFor(provider);
      if (adminIconOverrides[provider]) {
        iconCache.set(provider, adminIconOverrides[provider]);
      } else if (slug) {
        for (const src of ICON_SOURCES) {
          const probeUrl = src(slug);
          if (await probeImage(probeUrl)) { iconCache.set(provider, probeUrl); break; }
        }
      }
      toast("Icon saved");
      renderProviderIconsPage();
      updateBadge();
      if ($("#modelsPage").classList.contains("open")) renderCatalog();
    } catch (e) {
      toast(e.message || "Could not save icon");
    }
  });

  c.querySelectorAll("[data-clear-icon]").forEach(btn => btn.onclick = async () => {
    const provider = btn.dataset.clearIcon;
    try {
      const r = await fetch(WORKER_BASE + "/admin/provider-icons", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ provider, url: "" })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Clear failed");
      adminIconOverrides = j.icons || {};
      iconCache.delete(provider);
      toast("Override cleared");
      renderProviderIconsPage();
      updateBadge();
      if ($("#modelsPage").classList.contains("open")) renderCatalog();
    } catch (e) {
      toast(e.message || "Could not clear override");
    }
  });
}

          ${config.providers.map(p => `<option value="${escapeHtml(p)}" ${p === config.defaultProvider ? "selected" : ""}>${escapeHtml(p)}</option>`).join("")}
        </select>
      </div>
      <div class="admin-actions">
        <button class="btn-primary" id="scSave">Save</button>
        <button class="btn-ghost" id="scReset">Reset to Gemini only</button>
      </div>
    </div>
  `;

  const ta = c.querySelector("#scProviders");
  const sel = c.querySelector("#scDefault");
  ta.addEventListener("input", () => {
    const list = ta.value.split(/\r?\n/).map(s => s.trim().toLowerCase()).filter(Boolean);
    const current = sel.value;
    const uniq = [...new Set(list)];
    sel.innerHTML = `<option value="">Pick one…</option>` +
      uniq.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
    if (uniq.includes(current)) sel.value = current;
  });

  c.querySelector("#scSave").onclick = async () => {
    const providers = ta.value.split(/\r?\n/).map(s => s.trim().toLowerCase()).filter(Boolean);
    if (!providers.length) { toast("Add at least one provider"); return; }
    const defaultProvider = sel.value || providers[0];
    try {
      const r = await fetch(WORKER_BASE + "/admin/search-config", {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ providers, defaultProvider })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Save failed");
      state.searchConfig = { providers: j.providers, defaultProvider: j.defaultProvider };
      if (state.searchProvider && !j.providers.includes(state.searchProvider)) {
        state.searchProvider = "";
        localStorage.removeItem("chinaGPTSearchProvider");
      }
      updateSearchProviderUI();
      toast("Search providers saved");
      renderSearchConfigPage();
    } catch (e) { toast(e.message || "Could not save"); }
  };

  c.querySelector("#scReset").onclick = async () => {
    try {
      const r = await fetch(WORKER_BASE + "/admin/search-config", {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ providers: ["gemini"], defaultProvider: "gemini" })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Reset failed");
      state.searchConfig = { providers: ["gemini"], defaultProvider: "gemini" };
      updateSearchProviderUI();
      toast("Reset to Gemini only");
      renderSearchConfigPage();
    } catch (e) { toast(e.message || "Could not reset"); }
  };
}

/* ============================================================
   PROVIDER MAPPING (admin)
   ============================================================ */
const PM_KNOWN_PROVIDERS = [
  "openai","anthropic","google","deepseek","qwen","moonshot","zai","xai",
  "meta","mistral","minimax","nvidia","cohere","bytedance","xiaomi","tencent",
  "meituan","sensetime"
];
async function renderProviderMappingPage(){
  const c = $("#adminContent");
  c.innerHTML = `<p class="admin-kicker">Loading…</p>`;

  if (!state.models.length && isAuthenticated()) {
    try { await loadModels(); } catch {}
  }
  await loadProviderOverrides();

  const allIds = state.models.map(m => m.id);
  const allProviderKeys = [...new Set([
    ...PM_KNOWN_PROVIDERS,
    ...allIds.map(id => makerOf(id).key)
  ])].sort((a,b)=>providerLabel(a).localeCompare(providerLabel(b)));

  const optionList = allProviderKeys
    .map(k => `<option value="${escapeHtml(k)}">${escapeHtml(providerLabel(k))}</option>`)
    .join("");

  const overrides = state.providerOverrides || { byPattern: [], byModelId: {} };
  const countMatches = (pattern) => {
    const low = pattern.toLowerCase();
    return allIds.filter(id => id.toLowerCase().includes(low)).length;
  };
  const previewMatchIds = (pattern) => {
    const low = pattern.toLowerCase();
    return allIds.filter(id => id.toLowerCase().includes(low));
  };

  c.innerHTML = `
    <p class="admin-kicker">Move a family of models from one provider to another by keyword. The upstream model ID never changes — only how the app labels, filters and colours it. Disabling the target provider in Model Health cascades here automatically.</p>

    <div class="admin-section">
      <div class="admin-section-head"><h3>Move by keyword</h3><span>Case-insensitive substring match on the model ID</span></div>
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <div class="field" style="flex:1;min-width:200px;margin:0">
          <label for="pmKeyword">Models containing…</label>
          <input id="pmKeyword" placeholder="e.g. grok" autocomplete="off">
        </div>
        <div class="field" style="flex:0 0 180px;margin:0">
          <label for="pmTarget">Move to</label>
          <select id="pmTarget" style="background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;color:var(--text);outline:0">
            ${optionList}
          </select>
        </div>
        <div class="field" style="flex:0 0 auto;margin:0;align-self:flex-end">
          <label>&nbsp;</label>
          <button class="btn-primary" id="pmAdd" type="button">Move</button>
        </div>
      </div>
      <div class="pm-preview" id="pmPreview">
        <span class="pm-preview-count">Type a keyword to preview which models will be affected.</span>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h3>Active overrides</h3><span>${overrides.byPattern.length} pattern${overrides.byPattern.length===1?"":"s"} · ${Object.keys(overrides.byModelId).length} model${Object.keys(overrides.byModelId).length===1?"":"s"}</span></div>
      <div class="pm-list" id="pmList"></div>
    </div>
  `;

  const input = c.querySelector("#pmKeyword");
  const preview = c.querySelector("#pmPreview");
  const targetSel = c.querySelector("#pmTarget");

  const updatePreview = () => {
    const kw = (input.value || "").trim();
    if (!kw) {
      preview.innerHTML = `<span class="pm-preview-count">Type a keyword to preview which models will be affected.</span>`;
      return;
    }
    const ids = previewMatchIds(kw);
    if (!ids.length) {
      preview.innerHTML = `<span class="pm-preview-count">No models match “${escapeHtml(kw)}”.</span>`;
      return;
    }
    const shown = ids.slice(0, 30);
    preview.innerHTML = `
      <span class="pm-preview-count">${ids.length} model${ids.length===1?"":"s"} will move to ${escapeHtml(providerLabel(targetSel.value))}</span>
      <div class="pm-preview-list">
        ${shown.map(id => {
          const fromKey = makerOf(id).key;
          return `<div>${escapeHtml(id)} <code>${escapeHtml(providerLabel(fromKey))} → ${escapeHtml(providerLabel(targetSel.value))}</code></div>`;
        }).join("")}
        ${ids.length > shown.length ? `<div style="color:var(--dim)">…and ${ids.length - shown.length} more</div>` : ``}
      </div>
    `;
  };
  input.addEventListener("input", updatePreview);
  targetSel.addEventListener("change", updatePreview);

  const listBox = c.querySelector("#pmList");
  const renderList = () => {
    const rows = [];
    for (const { pattern, provider } of (state.providerOverrides.byPattern || [])) {
      const affects = countMatches(pattern);
      rows.push(`
        <div class="pm-row">
          <span class="pm-pattern">keyword: <b>${escapeHtml(pattern)}</b></span>
          <span class="pm-target">→ ${escapeHtml(providerLabel(provider))}</span>
          <span class="pm-affects">${affects} model${affects===1?"":"s"}</span>
          <button type="button" class="danger" data-remove-pattern="${escapeHtml(pattern)}">Remove</button>
        </div>`);
    }
    for (const [modelId, provider] of Object.entries(state.providerOverrides.byModelId || {})) {
      rows.push(`
        <div class="pm-row">
          <span class="pm-pattern">model: <b>${escapeHtml(modelId)}</b></span>
          <span class="pm-target">→ ${escapeHtml(providerLabel(provider))}</span>
          <span class="pm-affects">1 model</span>
          <button type="button" class="danger" data-remove-model="${escapeHtml(modelId)}">Remove</button>
        </div>`);
    }
    listBox.innerHTML = rows.length ? rows.join("") : `<div class="admin-note">No overrides yet.</div>`;

    const refreshUI = () => {
      renderProviderMappingPage();
      refreshCatalogIfOpen();
      if ($("#qsSheet").classList.contains("open")) renderQuickSwitch();
      updateBadge();
    };
    listBox.querySelectorAll("[data-remove-pattern]").forEach(b => b.onclick = async () => {
      try {
        const r = await fetch(WORKER_BASE + "/admin/provider-overrides/pattern/remove", {
          method: "POST", headers: authHeaders(),
          body: JSON.stringify({ pattern: b.dataset.removePattern })
        });
        const j = await r.json().catch(()=>({}));
        if (!r.ok || !j.ok) throw new Error(j.error || "Failed");
        state.providerOverrides.byPattern = j.byPattern || [];
        state.providerOverrides.byModelId = j.byModelId || {};
        toast("Override removed");
        refreshUI();
      } catch (e) { toast(e.message || "Could not remove"); }
    });
    listBox.querySelectorAll("[data-remove-model]").forEach(b => b.onclick = async () => {
      try {
        const r = await fetch(WORKER_BASE + "/admin/provider-overrides/model/remove", {
          method: "POST", headers: authHeaders(),
          body: JSON.stringify({ modelId: b.dataset.removeModel })
        });
        const j = await r.json().catch(()=>({}));
        if (!r.ok || !j.ok) throw new Error(j.error || "Failed");
        state.providerOverrides.byPattern = j.byPattern || [];
        state.providerOverrides.byModelId = j.byModelId || {};
        toast("Override removed");
        refreshUI();
      } catch (e) { toast(e.message || "Could not remove"); }
    });
  };
  renderList();

  c.querySelector("#pmAdd").onclick = async () => {
    const pattern = (input.value || "").trim().toLowerCase();
    const provider = targetSel.value;
    if (!pattern) { toast("Enter a keyword first"); return; }
    if (!provider) { toast("Pick a target provider"); return; }
    const matches = countMatches(pattern);
    if (matches === 0) {
      if (!confirm(`No models currently match "${pattern}". Add the override anyway?`)) return;
    } else {
      if (!confirm(`Move ${matches} model${matches===1?"":"s"} matching "${pattern}" to ${providerLabel(provider)}?`)) return;
    }
    try {
      const r = await fetch(WORKER_BASE + "/admin/provider-overrides/pattern/add", {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ pattern, provider })
      });
      const j = await r.json().catch(()=>({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "Failed");
      state.providerOverrides.byPattern = j.byPattern || [];
      state.providerOverrides.byModelId = j.byModelId || {};
      toast(`Moved ${matches} model${matches===1?"":"s"} to ${providerLabel(provider)}`);
      renderProviderMappingPage();
      refreshCatalogIfOpen();
      if ($("#qsSheet").classList.contains("open")) renderQuickSwitch();
      updateBadge();
    } catch (e) { toast(e.message || "Could not save"); }
  };
}

/* ============================================================
   MODEL HEALTH (admin)
   ============================================================ */
let mhState = {
  disabledModels: [],
  disabledProviders: [],
  results: {},
  autoDisableThreshold: 3,
  filter: "all",
  running: false,
  stopped: false,
  progress: { done: 0, total: 0 }
};
let mhAllModels = [];

async function renderModelHealthPage(){
  const c = $("#adminContent");
  c.innerHTML = `<p class="admin-kicker">Loading…</p>`;

  try {
    const [stateRes, modelsRes] = await Promise.all([
      fetch(WORKER_BASE + "/admin/model-health", { headers: authHeaders(false) }),
      fetch(WORKER_BASE + "/admin/model-health/all-models", { headers: authHeaders(false) })
    ]);
    if (stateRes.ok) {
      const j = await stateRes.json();
      mhState.disabledModels = j.disabledModels || [];
      mhState.disabledProviders = j.disabledProviders || [];
      mhState.results = j.results || {};
      mhState.autoDisableThreshold = j.autoDisableThreshold || 3;
    }
    if (modelsRes.ok) {
      const j = await modelsRes.json();
      mhAllModels = j.data || [];
    }
  } catch (e) {
    c.innerHTML = `<p class="admin-kicker">Could not reach backend: ${escapeHtml(e.message)}</p>`;
    return;
  }

  renderModelHealthTable();
}

function renderModelHealthTable(){
  const c = $("#adminContent");
  const disabledSet = new Set(mhState.disabledModels);
  const disabledProvSet = new Set(mhState.disabledProviders);

  const byProvider = {};
  for (const m of mhAllModels) {
    const maker = makerOf(m.id);
    if (!byProvider[maker.key]) byProvider[maker.key] = { label: maker.label, models: [] };
    byProvider[maker.key].models.push(m);
  }

  const total = mhAllModels.length;
  const okCount = Object.values(mhState.results).filter(r => r.status === "ok").length;
  const failCount = Object.values(mhState.results).filter(r => r.status === "failed").length;
  const disabledCount = mhState.disabledModels.length;
  const untestedCount = total - okCount - failCount;

  const f = mhState.filter;
  const STALE_MS = 24 * 60 * 60 * 1000;
  const now = Date.now();
  const matchesFilter = (id) => {
    if (f === "all") return true;
    if (f === "failing") return mhState.results[id]?.status === "failed" && !disabledSet.has(id);
    if (f === "disabled") return disabledSet.has(id);
    if (f === "untested") return !mhState.results[id] && !disabledSet.has(id);
    if (f === "ok") return mhState.results[id]?.status === "ok";
    if (f === "stale") {
      const r = mhState.results[id];
      if (!r || !r.lastTested) return false;
      const t = Date.parse(r.lastTested);
      return Number.isFinite(t) && (now - t) > STALE_MS;
    }
    return true;
  };

  const progressPct = mhState.progress.total > 0
    ? Math.round((mhState.progress.done / mhState.progress.total) * 100)
    : 0;

  c.innerHTML = `
    <p class="admin-kicker">Test models directly against 9Router. Failures auto-disable after ${mhState.autoDisableThreshold} consecutive attempts. Disabled models are hidden from everyone, including API callers.</p>

    <div class="mh-summary">
      ${adminStat("Total", total, "In catalogue")}
      ${adminStat("Passing", okCount, "Last test OK")}
      ${adminStat("Failing", failCount, "Last test failed")}
      ${adminStat("Disabled", disabledCount, "Hidden from users")}
    </div>

    <div class="mh-toolbar">
      <button class="btn-primary" id="mhTestAll" ${mhState.running ? "disabled" : ""}>${mhState.running ? "Testing…" : "▶ Test all"}</button>
      ${mhState.running ? `<button class="btn-ghost" id="mhStop">Stop</button>` : ``}
      <button class="btn-ghost" id="mhRefresh">Refresh</button>
      <div class="mh-bulk-actions">
        <button class="btn-ghost mh-danger" id="mhDisableAllFailing" ${failCount === 0 || mhState.running ? "disabled" : ""}>⊘ Disable all failing (${failCount})</button>
        <button class="btn-ghost mh-accent" id="mhEnableAll" ${disabledCount === 0 ? "disabled" : ""}>✓ Enable all disabled (${disabledCount})</button>
      </div>
      <span class="spacer"></span>
      ${mhState.running ? `
        <span class="mh-progress">${mhState.progress.done} / ${mhState.progress.total}
          <span class="mh-progress-bar"><i style="width:${progressPct}%"></i></span>
        </span>` : ``}
      <span class="mh-progress">Untested: ${untestedCount}</span>
    </div>

    <div class="mh-filter-row">
      ${[["all","All"],["ok","Passing"],["failing","Failing"],["disabled","Disabled"],["untested","Untested"],["stale","Stale (24h+)"]].map(([id,label]) =>
        `<button type="button" class="mh-filter${mhState.filter === id ? " is-active" : ""}" data-mh-filter="${id}">${label}</button>`
      ).join("")}
    </div>

    ${Object.entries(byProvider).sort((a,b)=>a[1].label.localeCompare(b[1].label)).map(([key, data]) => {
      const models = data.models.filter(m => matchesFilter(m.id));
      if (!models.length) return "";
      const providerDisabled = disabledProvSet.has(key);
      return `
        <div class="mh-table" style="margin-bottom:14px">
          <div class="mh-provider-head">
            <span>${escapeHtml(data.label)} · ${models.length} model${models.length === 1 ? "" : "s"}</span>
            ${providerDisabled
              ? `<button type="button" data-mh-enable-provider="${escapeHtml(key)}">Enable whole provider</button>`
              : `<button type="button" data-mh-disable-provider="${escapeHtml(key)}">Disable whole provider (${data.models.length})</button>`}
          </div>
          ${models.map(m => renderMhRow(m, disabledSet, disabledProvSet)).join("")}
        </div>
      `;
    }).join("")}

    ${total === 0 ? `<div class="admin-note">No models returned from upstream.</div>` : ``}
  `;

  // Wire filter buttons
  c.querySelectorAll("[data-mh-filter]").forEach(b => b.onclick = () => {
    mhState.filter = b.dataset.mhFilter;
    renderModelHealthTable();
  });

  // Refresh
  const refBtn = c.querySelector("#mhRefresh");
  if (refBtn) refBtn.onclick = () => renderModelHealthPage();

  // Test all
  const testAllBtn = c.querySelector("#mhTestAll");
  if (testAllBtn) testAllBtn.onclick = () => startMhTestAll();

  // Disable all failing
  const disableAllBtn = c.querySelector("#mhDisableAllFailing");
  if (disableAllBtn) disableAllBtn.onclick = () => mhDisableAllFailing();

  // Enable all disabled
  const enableAllBtn = c.querySelector("#mhEnableAll");
  if (enableAllBtn) enableAllBtn.onclick = () => mhEnableAll();

  // Stop
  const stopBtn = c.querySelector("#mhStop");
  if (stopBtn) stopBtn.onclick = () => { mhState.stopped = true; toast("Stopping after current tests…") };

  // Per-row actions
  c.querySelectorAll("[data-mh-test]").forEach(b => b.onclick = () => mhTestOne(b.dataset.mhTest));
  c.querySelectorAll("[data-mh-disable]").forEach(b => b.onclick = () => mhDisableModel(b.dataset.mhDisable));
  c.querySelectorAll("[data-mh-enable]").forEach(b => b.onclick = () => mhEnableModel(b.dataset.mhEnable));

  // Provider actions
  c.querySelectorAll("[data-mh-disable-provider]").forEach(b => b.onclick = () => mhDisableProvider(b.dataset.mhDisableProvider));
  c.querySelectorAll("[data-mh-enable-provider]").forEach(b => b.onclick = () => mhEnableProvider(b.dataset.mhEnableProvider));
}

function renderMhRow(m, disabledSet, disabledProvSet) {
  const id = m.id;
  const maker = makerOf(id);
  const result = mhState.results[id];
  const isDisabled = disabledSet.has(id) || disabledProvSet.has(maker.key);
  const statusClass = isDisabled ? "status-disabled"
                    : result?.status === "ok" ? "status-ok"
                    : result?.status === "failed" ? "status-failed"
                    : "status-untested";
  const statusText = isDisabled ? "Disabled"
                    : result?.status === "ok" ? "OK"
                    : result?.status === "failed" ? "Failed"
                    : "Untested";
  const latency = result?.latency != null ? `${result.latency} ms` : "—";
  const lastTested = result?.lastTested
    ? new Date(result.lastTested).toLocaleTimeString()
    : "—";
  const failures = result?.consecutiveFailures || 0;

  return `
    <div class="mh-row ${statusClass}${isDisabled ? " is-disabled" : ""}" data-mh-id="${escapeHtml(id)}">
      <span class="mh-dot"></span>
      <span class="mh-row-main">
        <b>${escapeHtml(cleanModelName(id))}</b>
        <small>${escapeHtml(id)}</small>
        ${result?.errorMessage && !isDisabled ? `<small style="color:var(--danger);font-family:inherit;font-size:11px;margin-top:3px">${escapeHtml(result.errorMessage.slice(0, 140))}</small>` : ""}
      </span>
      <span class="mh-row-cell">${escapeHtml(statusText)}${failures > 0 && !isDisabled ? ` (${failures}/${mhState.autoDisableThreshold})` : ""}</span>
      <span class="mh-row-cell">${escapeHtml(latency)}</span>
      <span class="mh-row-cell">${escapeHtml(lastTested)}</span>
      <span class="mh-row-actions">
        <button class="primary" data-mh-test="${escapeHtml(id)}" ${mhState.running ? "disabled" : ""}>Test</button>
        ${isDisabled
          ? `<button data-mh-enable="${escapeHtml(id)}">Enable</button>`
          : `<button class="danger" data-mh-disable="${escapeHtml(id)}">Disable</button>`}
      </span>
    </div>
  `;
}

async function mhTestOne(modelId) {
  const row = document.querySelector(`.mh-row[data-mh-id="${CSS.escape(modelId)}"]`);
  const btn = row?.querySelector("[data-mh-test]");
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  try {
    const r = await fetch(WORKER_BASE + "/admin/model-health/test", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ modelId })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || "Test failed");
    mhState.results[modelId] = j.result;
    if (j.autoDisabled && !mhState.disabledModels.includes(modelId)) {
      mhState.disabledModels.push(modelId);
      toast(`${cleanModelName(modelId)} auto-disabled after ${mhState.autoDisableThreshold} failures`);
    }
    renderModelHealthTable();
  } catch (e) {
    toast(e.message || "Could not test model");
    if (btn) { btn.disabled = false; btn.textContent = "Test"; }
  }
}

async function startMhTestAll() {
  const ids = mhAllModels.map(m => m.id);
  mhState.running = true;
  mhState.stopped = false;
  mhState.progress = { done: 0, total: ids.length };
  renderModelHealthTable();

  const queue = [...ids];
  const CONCURRENCY = 4;
  const worker = async () => {
    while (queue.length > 0 && !mhState.stopped) {
      const id = queue.shift();
      if (!id) break;
      try {
        const r = await fetch(WORKER_BASE + "/admin/model-health/test", {
          method: "POST", headers: authHeaders(), body: JSON.stringify({ modelId: id })
        });
        if (r.ok) {
          const j = await r.json();
          mhState.results[id] = j.result;
          if (j.autoDisabled && !mhState.disabledModels.includes(id)) {
            mhState.disabledModels.push(id);
          }
        }
      } catch { /* skip */ }
      mhState.progress.done++;
      // Throttle re-renders — every 4 completions.
      if (mhState.progress.done % 4 === 0) renderModelHealthTable();
    }
  };

  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, ids.length) }, worker));
  mhState.running = false;
  renderModelHealthTable();
  toast(mhState.stopped ? "Test run stopped" : `Tested ${mhState.progress.done} models`);
}

async function mhDisableModel(modelId) {
  try {
    const r = await fetch(WORKER_BASE + "/admin/model-health/disable-model", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ modelId })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || "Failed");
    mhState.disabledModels = j.disabledModels;
    renderModelHealthTable();
    toast("Model disabled");
  } catch (e) { toast(e.message || "Could not disable"); }
}

async function mhEnableModel(modelId) {

    const r = await fetch(WORKER_BASE + "/admin/model-health/enable-model", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ modelId })
    });

    if (!r.ok || !j.ok) throw new Error(j.error || "Failed");

}

async function mhDisableProvider(provider) {

  try {

    });

async function mhEnableProvider(provider) {
  try {
    const r = await fetch(WORKER_BASE + "/admin/model-health/enable-provider", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ provider })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || "Failed");
    mhState.disabledProviders = j.disabledProviders;
    renderModelHealthTable();
    toast("Provider enabled");
  } catch (e) { toast(e.message || "Could not enable provider"); }
}

/* Bulk disable every model whose last test was "failed". Sends one
   request instead of N — the backend merges the list in a single
   KV write. */
async function mhDisableAllFailing() {
  const failing = mhAllModels
    .map(m => m.id)
    .filter(id => mhState.results[id]?.status === "failed" && !mhState.disabledModels.includes(id));

  if (!failing.length) {
    toast("No failing models to disable");
    return;
  }
  if (!confirm(`Disable ${failing.length} failing model${failing.length === 1 ? "" : "s"}? Users will stop seeing them.`)) return;

  try {
    const r = await fetch(WORKER_BASE + "/admin/model-health/disable-batch", {
      method: "POST", headers: authHeaders(),
      body: JSON.stringify({ modelIds: failing })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || "Bulk disable failed");
    mhState.disabledModels = j.disabledModels || [];
    renderModelHealthTable();
    toast(`Disabled ${j.added || failing.length} model${(j.added || failing.length) === 1 ? "" : "s"}`);
  } catch (e) {
    toast(e.message || "Could not disable");
  }
}

/* Clear the whole disabled list and reset failure counters. */
async function mhEnableAll() {
  const count = mhState.disabledModels.length;
  if (!count) { toast("Nothing to enable"); return; }
  if (!confirm(`Enable all ${count} disabled model${count === 1 ? "" : "s"}? They'll appear for users again on the next test.`)) return;

  try {
    const r = await fetch(WORKER_BASE + "/admin/model-health/enable-all", {
      method: "POST", headers: authHeaders()
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || "Bulk enable failed");
    mhState.disabledModels = [];
    // Clear consecutive failures so nothing auto-trips right away
    for (const id of Object.keys(mhState.results || {})) {
      if (mhState.results[id]) mhState.results[id].consecutiveFailures = 0;
    }
    renderModelHealthTable();
    toast(`Enabled ${count} model${count === 1 ? "" : "s"}`);
  } catch (e) {
    toast(e.message || "Could not enable");
  }
}

function saveModelPrefs(){

function isFavorite(id){return state.favorites.includes(id)}
function toggleFavorite(id){
  state.favorites=isFavorite(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];
  saveModelPrefs();renderCatalog();
}
function markModelUsed(id){state.recentModels=[id,...state.recentModels.filter(x=>x!==id)].slice(0,20);saveModelPrefs()}
function modelCaps(m){
  const caps=[];
  const c=m.capabilities||{};
  if(c.vision) caps.push("Vision");
  if(c.tools) caps.push("Tools");
  if(c.reasoning) caps.push("Reasoning");
  if(c.audioInput) caps.push("Audio");
  if(!caps.length){
    const text=JSON.stringify(m).toLowerCase();
    if(/vision|image|multimodal/.test(text))caps.push("Vision");
    if(/tool|function/.test(text))caps.push("Tools");
    if(/reason/.test(text))caps.push("Reasoning");
  }
  return caps.slice(0,3);
}
function modelSortKey(m,mode){
  const maker=makerOf(m.id);
  return mode==="provider"
    ? (maker.label+" "+cleanModelName(m.id)).toLowerCase()
    : cleanModelName(m.id).toLowerCase();
}
function selectModel(id){
  if(!isAuthenticated()){openLogin("model");return}
  state.model=id;localStorage.setItem("chinaGPTModel",id);
  markModelUsed(id);persistCurrentConversation();updateBadge();closeModelsPage();
}
function fmtContext(n){
  if(!n) return "—";
  if(n>=1000000) return (n/1000000).toFixed(n%1000000===0?0:2)+"M";
  if(n>=1000) return Math.round(n/1000)+"K";
  return String(n);
}
function fmtPrice(p){
  if(p===undefined||p===null||p==="") return "—";
  const n=Number(p); if(Number.isNaN(n)) return "—";
  if(n===0) return "Free";
  if(n<0.01) return "$"+n.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");
  return "$"+n.toFixed(2);
}
let catalogFilter="all", catalogQuery="", catalogSort="name";
function buildFilters(){
  const makers=[...new Set(state.models.map(m=>makerOf(m.id).key))].sort((a,b)=>{
    return providerLabel(a).localeCompare(providerLabel(b));
  });
  const box=$("#modelFilters");
  box.innerHTML=`<button type="button" class="filter${catalogFilter==="all"?" is-active":""}" data-filter="all">All providers</button>`+
    makers.map(k=>`<button type="button" class="filter${catalogFilter===k?" is-active":""}" data-filter="${escapeHtml(k)}">${renderTile(k,"tile-xs")}${escapeHtml(providerLabel(k))}</button>`).join("");
  box.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{catalogFilter=b.dataset.filter;buildFilters();renderCatalog()});
  $("#favoritesOnlyBtn").classList.toggle("is-on",state.favoritesOnly);
  $("#favoritesOnlyBtn").textContent=state.favoritesOnly?"★ Favorites":"☆ Favorites";
  $("#recentOnlyBtn").classList.toggle("is-on",state.recentOnly);
  $("#modelSort").value=catalogSort;
}
function renderCatalog(){
  const q=catalogQuery.trim().toLowerCase();
  let rows=state.models.filter(m=>{
    const maker=makerOf(m.id);
    if(catalogFilter!=="all"&&maker.key!==catalogFilter)return false;
    if(state.favoritesOnly&&!isFavorite(m.id))return false;
    if(state.recentOnly&&!state.recentModels.includes(m.id))return false;
    if(q&&!m.id.toLowerCase().includes(q)&&!cleanModelName(m.id).toLowerCase().includes(q)&&!maker.label.toLowerCase().includes(q))return false;
    return true;
  });
  rows.sort((a,b)=>modelSortKey(a,catalogSort).localeCompare(modelSortKey(b,catalogSort)));
  $("#catalogCount").textContent=`${rows.length} model${rows.length===1?"":"s"} in the catalog`;
  const box=$("#modelResults");
  box.innerHTML=rows.length?rows.map(m=>{
    const maker=makerOf(m.id),isActive=m.id===state.model,caps=modelCaps(m);
    const ctx=fmtContext(m.context_length||m.contextWindow);
    const pin=fmtPrice(m.pricing?.prompt??m.pricing?.input);
    const pout=fmtPrice(m.pricing?.completion??m.pricing?.output);
    const lastCell=isActive?'<span class="selected-flag">✓ Selected</span>':pout;
    const lastLabel=isActive?"Status":"Output / 1M";
    const c=providerColor(maker.key);
    return `<div class="model-row${isActive?" is-active":""}">
      <button type="button" class="model-main" data-model="${escapeHtml(m.id)}">
        <span class="model-id">
          ${renderTile(maker.key)}
          <span class="model-id-text">
            <b>${escapeHtml(cleanModelName(m.id))}</b>
            <span class="model-meta">
              <small style="color:${c}">${escapeHtml(maker.label)}</small>
              ${caps.map(cap=>`<span class="cap-badge">${escapeHtml(cap)}</span>`).join("")}
            </span>
          </span>
        </span>
        <span class="model-cell" data-label="Context">${ctx}</span>
        <span class="model-cell price" data-label="Input / 1M">${pin}</span>
        <span class="model-cell price" data-label="${lastLabel}">${lastCell}</span>
      </button>
      <button type="button" class="model-copy-id" data-copy-id="${escapeHtml(m.id)}" aria-label="Copy model ID" title="Copy model ID">${COPY_ICON}</button>
      <button type="button" class="model-fav${isFavorite(m.id)?" is-on":""}" data-fav-model="${escapeHtml(m.id)}" aria-label="Favorite model" title="Favorite">${isFavorite(m.id)?"★":"☆"}</button>
    </div>`;
  }).join(""):`<div class="side-empty" style="padding:20px">No models match the selected filters.</div>`;
  box.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>selectModel(b.dataset.model));
  box.querySelectorAll("[data-copy-id]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    copyText(b.dataset.copyId);
    flashCopyIcon(b);
  });
  box.querySelectorAll("[data-fav-model]").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFavorite(b.dataset.favModel)});
}

function renderQuickSwitch(){

  const titleText=sheet.querySelector("#qsSheetTitleText");

  if(quickSwitchMaker==="all"){
    titleText.textContent="All providers";
    if(titleDot)titleDot.style.background="var(--accent)";

    if(titleDot)titleDot.style.background=providerColor(quickSwitchMaker);
  }

  provRow.innerHTML=`<button type="button" class="qs-prov-tile${quickSwitchMaker==="all"?" is-active":""}" data-qs-maker="all" title="All providers" ${quickSwitchMaker==="all"?'style="background:var(--accent);color:#fff;border-color:transparent"':''}>All</button>`+
    makers.map(k=>{
      const c=providerColor(k);
      const active=quickSwitchMaker===k;
      const st=active
        ? `background:${c};color:#fff;border-color:transparent`
        : `background:${hexToRgba(c,.14)};color:${c};border-color:${hexToRgba(c,.3)}`;
      const url=providerIconUrl(k);

        ? `<span class="tile-icon" style="--icon-url:url('${url}')"></span>`
        : letter;
      return `<button type="button" class="qs-prov-tile${active?" is-active":""}" data-qs-maker="${escapeHtml(k)}" title="${escapeHtml(providerLabel(k))}" style="${st}">${inner}</button>`;
    }).join("");
  provRow.querySelectorAll("[data-qs-maker]").forEach(b=>b.onclick=()=>{quickSwitchMaker=b.dataset.qsMaker;renderQuickSwitch()});
  renderQuickSwitchList();

function renderQuickSwitchList(){
  const sheet=$("#qsSheet");if(!sheet)return;
  const list=sheet.querySelector("#qsList");if(!list)return;
  const q=(quickSwitchQuery||"").trim().toLowerCase();
  let rows=state.models.filter(m=>{
    const maker=makerOf(m.id);
    if(quickSwitchMaker!=="all" && maker.key!==quickSwitchMaker) return false;
    if(q && !m.id.toLowerCase().includes(q) && !cleanModelName(m.id).toLowerCase().includes(q) && !maker.label.toLowerCase().includes(q)) return false;
    return true;
  });
  rows.sort((a,b)=>cleanModelName(a.id).localeCompare(cleanModelName(b.id)));
  list.innerHTML=rows.length?rows.map(m=>{
    const maker=makerOf(m.id),isActive=m.id===state.model;
    const ctx=fmtContext(m.context_length||m.contextWindow);
    const c=providerColor(maker.key);

  list.querySelectorAll("[data-qs-model]").forEach(b=>{
    b.onclick=(e)=>{
      if(e.target.closest("[data-copy-id]"))return;
      selectModel(b.dataset.qsModel);
      closeQuickModelSwitch();
    };
    b.onkeydown=(e)=>{
      if(e.key==="Enter"||e.key===" "){
        if(e.target.closest("[data-copy-id]"))return;
        e.preventDefault();
        selectModel(b.dataset.qsModel);
        closeQuickModelSwitch();
      }
    };
  });
  list.querySelectorAll("[data-copy-id]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    copyText(b.dataset.copyId);
    flashCopyIcon(b);
  });
}

$("#stopBtn").onclick=stopGeneration;
$("#prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#prompt").addEventListener("input",e=>{e.target.style.height="";e.target.style.height=Math.min(200,e.target.scrollHeight)+"px"});
$("#newChat").onclick=()=>{
  if(state.generating){toast("Wait for the response to finish.");return}
  if(state.messages.length&&!confirm("Start a new chat? Your current conversation will remain saved."))return;
  state.messages=[];state.attachments=[];state.conversationId="";
  localStorage.removeItem("chinaGPTConversationId");
  renderAttachments();renderMessages();renderRecent();
  $("#prompt").focus();$("#shell").classList.remove("nav-open");
};
$("#navModels").onclick=openModelsPage;
$("#navChats").onclick=openChatManager;
$("#apiDocsBtn").onclick=openApiDocs;
$("#accountBtn").onclick=openAccountPage;
$("#fileInput").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value=""});
const composerDrop=$("#composer");
["dragenter","dragover"].forEach(ev=>composerDrop.addEventListener(ev,e=>{e.preventDefault();composerDrop.classList.add("is-dragging")}));
["dragleave","drop"].forEach(ev=>composerDrop.addEventListener(ev,e=>{e.preventDefault();composerDrop.classList.remove("is-dragging")}));
composerDrop.addEventListener("drop",e=>{if(e.dataTransfer?.files?.length)handleFiles(e.dataTransfer.files)});
$("#modelBtn").onclick=openModelsPage;
$("#composerModelChip").onclick=()=>openQuickModelSwitch();
$("#personalitiesBtn").onclick=openPersonalities;
$("#menuBtn").onclick=()=>$("#shell").classList.add("nav-open");
$("#drawerClose").onclick=()=>$("#shell").classList.remove("nav-open");
$("#scrim").onclick=()=>$("#shell").classList.remove("nav-open");
$("#searchBtn").onclick=toggleWebSearch;
$("#searchProviderPill").onclick = (e) => {
  e.stopPropagation();
  openSearchProviderMenu($("#searchProviderPill"));
};
$("#qsBackdrop").addEventListener("click",closeQuickModelSwitch);

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if($("#qsSheet").classList.contains("open")){closeQuickModelSwitch();return}
    if($("#authPage").classList.contains("open")){closeAuthPage();return}
    if(pageStack.length>0){popPage();return}
    if($("#modelsPage").classList.contains("open")){closeModelsPage();return}
    if($("#adminPage").classList.contains("open")){closeAdmin();return}
    $("#shell").classList.remove("nav-open");
  }
});

/* ============================================================
   INIT
   ============================================================ */
updateAccountBadge();
renderRecent();
renderAttachments();
renderMessages();

(async () => {
  // Preload admin icon overrides, api base URL, and models.
  if (isAuthenticated()) {
    await Promise.all([
      loadApiBaseUrl(),
      loadProviderIconOverrides(),
      loadSearchConfig(),
      loadProviderOverrides()
    ]);
    await loadModels();
    // Warm icons after models arrive — this drives the multi-source probe.
    warmIconCache();
  } else {
    updateBadge();
  }
  if (state.conversationId) loadConversation(state.conversationId);
})();
</script>
</body>
</html>
